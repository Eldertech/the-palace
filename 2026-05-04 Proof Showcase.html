// ============ RENDERING ============
function escapeHTML(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function urlSafe(s){ return encodeURI(s); }

function renderCard(a){
  const isFollowup = a.section === 'followup';
  const newBadge = a.isNew ? ' <span style="font-size:9px;background:#ff6f59;color:#0f0f10;padding:2px 6px;border-radius:8px;margin-left:6px;font-weight:700;letter-spacing:0.04em;">NEW</span>' : '';
  let mediaHTML = '';

  if(a.section === 'audio'){
    mediaHTML = `<div class="card-media"><audio controls preload="none" src="${urlSafe(a.src)}"></audio></div>`;
    if(a.extra && a.extra.type === 'image'){
      mediaHTML += `<div class="card-media" style="border-bottom:none;"><img loading="lazy" src="${urlSafe(a.extra.src)}" alt="companion image"></div>`;
      mediaHTML += `<div class="card-caption" style="padding-top:0;">${escapeHTML(a.extra.note)}</div>`;
    }
  } else if(a.type === 'image'){
    mediaHTML = `<div class="card-media"><img loading="lazy" src="${urlSafe(a.src)}" alt="${escapeHTML(a.project)}"></div>`;
  } else if(a.type === 'iframe'){
    mediaHTML = `<div class="card-media"><iframe loading="lazy" src="${urlSafe(a.src)}" sandbox="allow-scripts allow-same-origin"></iframe></div>`;
  } else if(a.type === 'text'){
    mediaHTML = `<div class="card-media"><div class="text-preview">${escapeHTML(a.preview)}</div></div>`;
  }

  const captionHTML = a.caption ? `<div class="card-caption">${escapeHTML(a.caption)}</div>` : '';
  const linksHTML = a.src ? `<div class="card-links"><a href="${urlSafe(a.src)}" target="_blank">↗ open in new tab</a></div>` : '';

  if(isFollowup){
    return `
      <div class="card followup">
        <div class="card-header">
          <span class="project">${escapeHTML(a.project)}${newBadge}</span>
          <span class="stage stage-${a.stage}">${a.stage}</span>
        </div>
        <div class="followup-q"><strong>?</strong> ${escapeHTML(a.question)}</div>
        <div class="card-feedback">
          <label>your answer</label>
          <textarea data-id="${a.id}" placeholder="…"></textarea>
          <div class="saved" data-saved="${a.id}">saved</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="card-header">
        <span class="project">${escapeHTML(a.project)}${newBadge}</span>
        <span class="stage stage-${a.stage}">${a.stage}</span>
        <div class="vector">${escapeHTML(a.vector || '')}</div>
      </div>
      ${mediaHTML}
      ${captionHTML}
      ${linksHTML}
      <div class="card-feedback">
        <label>your feedback — what's right, what's wrong, what to do next</label>
        <textarea data-id="${a.id}" placeholder="…"></textarea>
        <div class="saved" data-saved="${a.id}">saved</div>
      </div>
    </div>
  `;
}

function placeCards(){
  const sections = { audio:'audio-cards', visual:'visual-cards', interactive:'interactive-cards', text:'text-cards', followup:'followup-cards' };
  Object.values(sections).forEach(id => document.getElementById(id).innerHTML = '');
  ARTIFACTS.forEach(a => {
    const targetId = sections[a.section];
    if(targetId){
      document.getElementById(targetId).insertAdjacentHTML('beforeend', renderCard(a));
    }
  });
  // load saved feedback
  document.querySelectorAll('textarea[data-id]').forEach(t => {
    const v = localStorage.getItem('feedback-' + t.dataset.id);
    if(v) t.value = v;
    t.addEventListener('input', e => {
      localStorage.setItem('feedback-' + t.dataset.id, t.value);
      const saved = document.querySelector(`[data-saved="${t.dataset.id}"]`);
      if(saved){ saved.classList.add('show'); clearTimeout(saved._t); saved._t = setTimeout(()=>saved.classList.remove('show'), 1500); }
    });
  });
}

document.getElementById('total-count').textContent = ARTIFACTS.filter(a => a.section !== 'followup').length;

document.getElementById('copyAll').addEventListener('click', async () => {
  const lines = [`# Proof Showcase Feedback — 2026-05-04`, ''];
  let any = false;
  ARTIFACTS.forEach(a => {
    const v = localStorage.getItem('feedback-' + a.id);
    if(v && v.trim()){
      lines.push(`## ${a.project}`);
      lines.push(v.trim());
      lines.push('');
      any = true;
    }
  });
  const text = any ? lines.join('\n') : '# No feedback entered yet.';
  try {
    await navigator.clipboard.writeText(text);
    showToast(any ? 'copied to clipboard — paste back to me' : 'no feedback yet');
  } catch(e) {
    // fallback: select-and-copy
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('copied'); } catch(e2){ alert(text); }
    document.body.removeChild(ta);
  }
});

document.getElementById('clearAll').addEventListener('click', () => {
  if(!confirm('Clear all feedback locally? (does not affect saved files)')) return;
  ARTIFACTS.forEach(a => localStorage.removeItem('feedback-' + a.id));
  document.querySelectorAll('textarea[data-id]').forEach(t => t.value = '');
  showToast('cleared');
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}
