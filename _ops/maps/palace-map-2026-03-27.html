  'mirrors':       '#664488',
  'enables':       '#336644',
  'deepens':       '#224466',
  'spawned':       '#885522',
  'emerged-from':  '#556633',
  'couples-with':  '#446655',
  'contradicts':   '#883333',
  'applies-to':    '#447755'
};

// ── Build node map & degree counts ───────────────────────────────────────
const nodeMap = {};
RAW_NODES.forEach(n => { nodeMap[n.id] = n; });

const inDeg = {};
const outDeg = {};
RAW_EDGES.forEach(e => {
  inDeg[e.to] = (inDeg[e.to] || 0) + 1;
  outDeg[e.from] = (outDeg[e.from] || 0) + 1;
});

const maxIn = Math.max(...Object.values(inDeg));

function nodeRadius(id) {
  const deg = (inDeg[id] || 0) + (outDeg[id] || 0);
  return 4 + Math.sqrt(deg) * 1.8;
}

// ── State ─────────────────────────────────────────────────────────────────
const activeTypes  = new Set(Object.keys(TYPE_COLOR));
const activeStages = new Set(['foundational','mature','growing','sprout','seed','dormant','composting','']);
let searchTerm = '';
let selectedNode = null;

// ── Ghost node list ────────────────────────────────────────────────────────
const ghostList = document.getElementById('ghost-list');
GHOST_NODES.forEach(g => {
  const div = document.createElement('div');
  div.textContent = '◌ ' + g;
  div.style.color = '#887755';
  ghostList.appendChild(div);
});

// ── Type filter chips ─────────────────────────────────────────────────────
const typeFilters = document.getElementById('type-filters');
Object.entries(TYPE_COLOR).forEach(([t, c]) => {
  if (!t) return;
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = t;
  chip.style.borderColor = c;
  chip.style.color = c;
  chip.dataset.type = t;
  chip.addEventListener('click', () => {
    if (activeTypes.has(t)) { activeTypes.delete(t); chip.classList.add('off'); }
    else { activeTypes.add(t); chip.classList.remove('off'); }
    updateVisibility();
  });
  typeFilters.appendChild(chip);
});

// ── Stage filter chips ────────────────────────────────────────────────────
const stages = ['foundational','mature','growing','sprout','seed','dormant','composting'];
const stageColors = {
  foundational:'#e8d080', mature:'#c8aa60', growing:'#88cc88', sprout:'#66aa66',
  seed:'#778855', dormant:'#556666', composting:'#444455'
};
const stageFilters = document.getElementById('stage-filters');
stages.forEach(s => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = s;
  chip.style.borderColor = stageColors[s] || '#555';
  chip.style.color = stageColors[s] || '#555';
  chip.dataset.stage = s;
  chip.addEventListener('click', () => {
    if (activeStages.has(s)) { activeStages.delete(s); chip.classList.add('off'); }
    else { activeStages.add(s); chip.classList.remove('off'); }
    updateVisibility();
  });
  stageFilters.appendChild(chip);
});

// ── Relation legend ───────────────────────────────────────────────────────
const relLegend = document.getElementById('rel-legend');
Object.entries(REL_COLOR).forEach(([r, c]) => {
  const row = document.createElement('div');
  row.className = 'legend-row';
  row.innerHTML = `<div class="legend-line" style="background:${c}"></div><span style="color:#aaa">${r}</span>`;
  relLegend.appendChild(row);
});

// ── Search ────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase();
  updateVisibility();
});

// ── SVG + D3 setup ────────────────────────────────────────────────────────
const svg = d3.select('#canvas')
  .attr('width', window.innerWidth)
  .attr('height', window.innerHeight);

const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.1, 4])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Arrow markers per relation type
const defs = svg.append('defs');
Object.entries(REL_COLOR).forEach(([rel, color]) => {
  defs.append('marker')
    .attr('id', 'arrow-' + rel.replace(/[^a-z]/g,''))
    .attr('viewBox', '0 -4 8 8')
    .attr('refX', 12)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-4L8,0L0,4')
    .attr('fill', color)
    .attr('opacity', 0.6);
});

// ── Simulation ────────────────────────────────────────────────────────────
const nodes = RAW_NODES.map(n => ({ ...n }));
const nodeById = {};
nodes.forEach(n => nodeById[n.id] = n);

const edges = RAW_EDGES
  .filter(e => nodeById[e.from] && nodeById[e.to])
  .map(e => ({ source: e.from, target: e.to, rel: e.rel }));

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(d => {
    const relDist = { 'mirrors': 80, 'deepens': 70, 'enables': 90, 'spawned': 85,
                       'emerged-from': 85, 'couples-with': 75, 'connects-to': 120, 'contradicts': 100 };
    return relDist[d.rel] || 100;
  }).strength(0.4))
  .force('charge', d3.forceManyBody().strength(d => -120 - nodeRadius(d.id) * 10))
  .force('center', d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d.id) + 6));

// ── Draw links ────────────────────────────────────────────────────────────
const linkGroup = g.append('g').attr('class', 'links');
const link = linkGroup.selectAll('line')
  .data(edges)
  .join('line')
  .attr('stroke', d => REL_COLOR[d.rel] || '#334')
  .attr('stroke-width', 1)
  .attr('stroke-opacity', 0.4)
  .attr('marker-end', d => `url(#arrow-${d.rel.replace(/[^a-z]/g,'')})`);

// ── Draw nodes ────────────────────────────────────────────────────────────
const nodeGroup = g.append('g').attr('class', 'nodes');

const nodeEl = nodeGroup.selectAll('g')
  .data(nodes)
  .join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', (event, d) => {
      if (!event.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
    .on('end', (event, d) => {
      if (!event.active) sim.alphaTarget(0);
      d.fx = null; d.fy = null;
    })
  )
  .on('click', (event, d) => {
    event.stopPropagation();
    selectNode(d);
  })
  .on('mouseover', (event, d) => {
    const tt = document.getElementById('tooltip');
    tt.style.display = 'block';
    tt.style.left = (event.pageX + 12) + 'px';
    tt.style.top = (event.pageY - 8) + 'px';
    tt.innerHTML = `<strong>${d.title || d.id}</strong><br/><span style="color:#888">${d.type} · ${d.stage}</span><br/><span style="color:#6688aa">in:${inDeg[d.id]||0} out:${outDeg[d.id]||0}</span>`;
  })
  .on('mousemove', event => {
    const tt = document.getElementById('tooltip');
    tt.style.left = (event.pageX + 12) + 'px';
    tt.style.top = (event.pageY - 8) + 'px';
  })
  .on('mouseout', () => {
    document.getElementById('tooltip').style.display = 'none';
  });

nodeEl.append('circle')
  .attr('r', d => nodeRadius(d.id))
  .attr('fill', d => TYPE_COLOR[d.type] || '#555')
  .attr('fill-opacity', d => STAGE_OPACITY[d.stage] || 0.7)
  .attr('stroke', d => TYPE_COLOR[d.type] || '#555')
  .attr('stroke-width', 1.5)
  .attr('stroke-opacity', 0.8);

nodeEl.append('text')
  .attr('dy', d => nodeRadius(d.id) + 10)
  .attr('text-anchor', 'middle')
  .attr('font-size', d => {
    const deg = (inDeg[d.id]||0) + (outDeg[d.id]||0);
    return Math.min(12, 7 + Math.sqrt(deg) * 0.6) + 'px';
  })
  .attr('fill', '#ccc')
  .attr('fill-opacity', d => STAGE_OPACITY[d.stage] || 0.7)
  .attr('pointer-events', 'none')
  .text(d => d.title || d.id);

// ── Simulation tick ───────────────────────────────────────────────────────
sim.on('tick', () => {
  link
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);
  nodeEl.attr('transform', d => `translate(${d.x},${d.y})`);
});

// ── Click canvas to deselect ──────────────────────────────────────────────
svg.on('click', () => {
  selectedNode = null;
  updateHighlight();
  document.getElementById('info-panel').style.display = 'none';
  document.getElementById('stat-selected').textContent = '—';
});

// ── Select node ───────────────────────────────────────────────────────────
function selectNode(d) {
  selectedNode = d;
  updateHighlight();
  
  const outLinks = RAW_EDGES.filter(e => e.from === d.id);
  const inLinks  = RAW_EDGES.filter(e => e.to   === d.id);
  
  const infoPanel = document.getElementById('info-panel');
  infoPanel.style.display = 'block';
  document.getElementById('info-title').textContent = d.title || d.id;
  document.getElementById('info-meta').textContent = `${d.type} · ${d.stage} · in:${inLinks.length} out:${outLinks.length}`;
  
  let html = '';
  if (outLinks.length) {
    html += '<div style="color:#8877aa;margin-bottom:4px">outgoing</div>';
    outLinks.forEach(e => {
      html += `<div class="link-out">→ <em>${e.rel}</em> ${e.to}</div>`;
    });
  }
  if (inLinks.length) {
    html += '<div style="color:#8877aa;margin-top:6px;margin-bottom:4px">incoming</div>';
    inLinks.forEach(e => {
      html += `<div class="link-in">← <em>${e.rel}</em> ${e.from}</div>`;
    });
  }
  document.getElementById('info-links').innerHTML = html;
  document.getElementById('stat-selected').textContent = d.title || d.id;
}

// ── Update highlight ──────────────────────────────────────────────────────
function updateHighlight() {
  if (!selectedNode) {
    nodeEl.select('circle').attr('stroke-width', 1.5).attr('stroke-opacity', 0.8);
    link.attr('stroke-opacity', 0.4).attr('stroke-width', 1);
    return;
  }
  const connectedIds = new Set([selectedNode.id]);
  RAW_EDGES.forEach(e => {
    if (e.from === selectedNode.id) connectedIds.add(e.to);
    if (e.to   === selectedNode.id) connectedIds.add(e.from);
  });
  
  nodeEl.select('circle')
    .attr('stroke-width', d => d.id === selectedNode.id ? 3 : 1)
    .attr('stroke-opacity', d => connectedIds.has(d.id) ? 1 : 0.2)
    .attr('fill-opacity', d => connectedIds.has(d.id) ? (STAGE_OPACITY[d.stage]||0.7) : 0.1);
  
  nodeEl.select('text')
    .attr('fill-opacity', d => connectedIds.has(d.id) ? 1 : 0.15);
  
  link
    .attr('stroke-opacity', d => {
      const s = d.source.id || d.source;
      const t = d.target.id || d.target;
      return (s === selectedNode.id || t === selectedNode.id) ? 0.9 : 0.05;
    })
    .attr('stroke-width', d => {
      const s = d.source.id || d.source;
      const t = d.target.id || d.target;
      return (s === selectedNode.id || t === selectedNode.id) ? 2 : 1;
    });
}

// ── Visibility filter ─────────────────────────────────────────────────────
function isVisible(d) {
  if (!activeTypes.has(d.type)) return false;
  if (!activeStages.has(d.stage) && d.stage !== '') return false;
  if (searchTerm && !(d.id.toLowerCase().includes(searchTerm) || (d.title||'').toLowerCase().includes(searchTerm))) return false;
  return true;
}

function updateVisibility() {
  nodeEl.style('display', d => isVisible(d) ? null : 'none');
  
  link.style('display', d => {
    const s = d.source.id || d.source;
    const t = d.target.id || d.target;
    const sNode = nodeById[s];
    const tNode = nodeById[t];
    return (sNode && isVisible(sNode) && tNode && isVisible(tNode)) ? null : 'none';
  });
  
  const visNodes = nodes.filter(isVisible).length;
  const visEdges = edges.filter(d => {
    const s = d.source.id || d.source;
    const t = d.target.id || d.target;
    return nodeById[s] && isVisible(nodeById[s]) && nodeById[t] && isVisible(nodeById[t]);
  }).length;
  
  document.getElementById('stat-nodes').textContent = visNodes;
  document.getElementById('stat-edges').textContent = visEdges;
}

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  svg.attr('width', window.innerWidth).attr('height', window.innerHeight);
  sim.force('center', d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));
  sim.alpha(0.1).restart();
});

</script>
</body>
</html>
