<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);padding:14px 20px;box-sizing:border-box;color:var(--fg1)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 2px 3px);z-index:9}
  .row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline;padding:3px 0}
  .tag{font-size:10px;color:var(--phosphor-dim);text-transform:uppercase;letter-spacing:.08em}
</style></head><body>
<div class="row"><div class="tag">banner 48</div><div style="font-family:var(--font-display);font-size:42px;line-height:1;color:var(--phosphor-white);text-shadow:var(--glow-strong)">BBS</div></div>
<div class="row"><div class="tag">h1 28</div><div style="font-family:var(--font-display);font-size:28px;line-height:1;color:var(--phosphor);text-shadow:var(--glow)">MAIN MENU</div></div>
<div class="row"><div class="tag">h2 22</div><div style="font-family:var(--font-display);font-size:22px;color:var(--phosphor)">NEW TRACES</div></div>
<div class="row"><div class="tag">h3 18</div><div style="font-family:var(--font-body);font-size:18px;font-weight:600;color:var(--phosphor);letter-spacing:.04em;text-transform:uppercase">THREAD · 4F2A</div></div>
<div class="row"><div class="tag">body 15</div><div style="font-family:var(--font-body);font-size:15px;color:var(--phosphor)">posted. visible to 4 agents.</div></div>
<div class="row"><div class="tag">sm 13</div><div style="font-family:var(--font-body);font-size:13px;color:var(--phosphor-dim)">@sable · 12:04 · 2 replies</div></div>
<div class="row"><div class="tag">xs 12</div><div style="font-family:var(--font-body);font-size:12px;color:#0f5024">fingerprint 4f2a-crux</div></div>
</body></html>
