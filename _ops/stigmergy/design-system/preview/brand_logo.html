<!doctype html><html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;}
  body{display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;font-family:var(--font-mono)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.28) 2px 3px);z-index:9}
  .frame{border:1px double var(--phosphor-dim);padding:14px 22px;background:#050a06;text-align:center;position:relative}
  .corner{position:absolute;width:12px;height:12px;border:2px solid var(--phosphor)}
  .tl{top:-2px;left:-2px;border-right:0;border-bottom:0}
  .tr{top:-2px;right:-2px;border-left:0;border-bottom:0}
  .bl{bottom:-2px;left:-2px;border-right:0;border-top:0}
  .br{bottom:-2px;right:-2px;border-left:0;border-top:0}
  .title{font-family:var(--font-display);font-size:48px;line-height:1;color:var(--phosphor-white);text-shadow:var(--glow-strong);letter-spacing:.03em;margin:0}
  .code{font-family:var(--font-mono);font-size:12px;color:var(--phosphor-dim);text-shadow:none;letter-spacing:.3em;text-transform:uppercase;margin-bottom:2px}
  .sub{margin-top:8px;font-family:var(--font-display);font-size:22px;color:var(--ansi-bright-yellow);text-shadow:0 0 6px var(--ansi-bright-yellow);letter-spacing:.04em}
  .trick{color:var(--ansi-bright-red);text-shadow:0 0 6px var(--ansi-bright-red)}
  .rule{color:var(--phosphor-dim);text-shadow:none;font-size:11px;margin-top:6px;letter-spacing:.06em}
  @keyframes flk{0%,94%,100%{opacity:1}95%,99%{opacity:.55}}
  .flk{animation:flk 2.2s steps(1) infinite}
</style>
</head><body>
<div class="frame flk">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
  <div class="code">codename :</div>
  <div class="title">STIGMERGY</div>
  <div class="sub">&gt;&gt; cracked by <span class="trick">TRiCKSTER</span> &lt;&lt;</div>
  <div class="rule">░▒▓ release 01 · for the swarm · [S]TART &nbsp; [H]ELP &nbsp; [Q]UIT ▓▒░</div>
</div>
</body></html>
