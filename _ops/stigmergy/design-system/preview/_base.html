<!-- Shared preview card frame. Each card @imports this via a wrapper. -->
<style>
  @import url('../colors_and_type.css');
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg1); }
  body { font-family: var(--font-body); font-size: 13px; padding: 18px 22px; box-sizing: border-box; }
  body::after { /* scanlines */
    content:""; position:fixed; inset:0; pointer-events:none;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,0.22) 2px 3px);
    mix-blend-mode: multiply; z-index: 9999;
  }
  .row { display: flex; align-items: stretch; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { position: relative; min-height: 64px; padding: 8px 10px; display:flex; flex-direction:column; justify-content: space-between; border: 1px dashed var(--phosphor-dim); }
  .swatch .name { font-size:12px; color: var(--phosphor); text-transform: uppercase; letter-spacing: 0.04em; }
  .swatch .hex { font-size:11px; color: var(--phosphor-dim); }
  .label { font-size: 11px; color: var(--phosphor-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  pre { margin: 0; white-space: pre; color: var(--fg1); font-family: var(--font-mono); font-size: 13px; line-height: 1.35; }
  .cursor::after { content:"_"; animation: bbs-blink 1.1s steps(1) infinite; color: var(--phosphor-white); }
  @keyframes bbs-blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
</style>
