<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);padding:16px 20px;box-sizing:border-box}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 2px 3px);z-index:9}
  .block{margin:0 0 10px}
  .lbl{font-size:10px;color:var(--phosphor-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
  .vt{font-family:var(--font-display);color:var(--phosphor-white);text-shadow:var(--glow-strong)}
  .vt48{font-size:44px;line-height:.95}
  .vt28{font-size:30px;line-height:1}
</style></head><body>
  <div class="block">
    <div class="lbl">VT323 · display · 44px</div>
    <div class="vt vt48">BLACKBOARD</div>
  </div>
  <div class="block">
    <div class="lbl">VT323 · banner · 30px</div>
    <div class="vt vt28">WELCOME TO THE BOARD</div>
  </div>
  <div class="block">
    <div class="lbl">VT323 · inline · 22px</div>
    <div class="vt" style="font-size:22px;color:var(--phosphor)">░▒▓ stigmergic swarm terminal ▓▒░</div>
  </div>
</body></html>
