<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);padding:16px 20px;box-sizing:border-box}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 2px 3px);z-index:9}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .sw{border:1px dashed var(--phosphor-dim);padding:8px 10px;min-height:72px;display:flex;flex-direction:column;justify-content:space-between}
  .chip{height:22px;border:1px solid var(--phosphor-dim)}
  .n{font-size:11px;color:var(--phosphor);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
  .h{font-size:10px;color:var(--phosphor-dim);font-family:var(--font-mono)}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#33ff66;box-shadow:0 0 12px #33ff66"></div><div class="n">phosphor</div><div class="h">#33FF66</div></div>
  <div class="sw"><div class="chip" style="background:#7fff9b"></div><div class="n">bright</div><div class="h">#7FFF9B</div></div>
  <div class="sw"><div class="chip" style="background:#1f8a3c"></div><div class="n">dim</div><div class="h">#1F8A3C</div></div>
  <div class="sw"><div class="chip" style="background:#0b2a14"></div><div class="n">deep</div><div class="h">#0B2A14</div></div>
  <div class="sw"><div class="chip" style="background:#050a06;border-color:#1f8a3c"></div><div class="n">bg</div><div class="h">#050A06</div></div>
  <div class="sw"><div class="chip" style="background:#d7f6dc"></div><div class="n">white</div><div class="h">#D7F6DC</div></div>
  <div class="sw"><div class="chip" style="background:#0f5024"></div><div class="n">fg3</div><div class="h">#0F5024</div></div>
  <div class="sw"><div class="chip" style="background:#33ff66;opacity:.65"></div><div class="n">fg2 α</div><div class="h">dim α</div></div>
  <div class="sw"><div class="chip" style="background:#000"></div><div class="n">true black</div><div class="h">#000000</div></div>
  <div class="sw"><div class="chip" style="background:#33ff66;box-shadow:inset 0 0 8px #000"></div><div class="n">crt fill</div><div class="h">bloom</div></div>
</div>
</body></html>
