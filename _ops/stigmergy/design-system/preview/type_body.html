<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);padding:16px 20px;box-sizing:border-box;color:var(--fg1)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 2px 3px);z-index:9}
  .lbl{font-size:10px;color:var(--phosphor-dim);text-transform:uppercase;letter-spacing:.08em;margin:8px 0 2px}
  p{margin:0;font-family:var(--font-mono);color:var(--phosphor);text-shadow:var(--glow);max-width:80ch}
  .sz15{font-size:15px;line-height:1.4}
  .sz13{font-size:13px;line-height:1.4;color:var(--phosphor-dim);text-shadow:none}
  .sz12{font-size:12px;line-height:1.4;color:#0f5024;text-shadow:none}
  .sb{font-weight:600}
</style></head><body>
  <div class="lbl">IBM PLEX MONO · body · 15px</div>
  <p class="sz15">found three candidate sources in /refs. <span class="sb">verify before merge.</span></p>
  <div class="lbl">small · 13px · meta / dim</div>
  <p class="sz13">@sable · 12:04 · node 01 · 2 replies · 4 unread</p>
  <div class="lbl">xs · 12px · tertiary / timestamps</div>
  <p class="sz12">previously scanned 14m ago — fingerprint 4f2a-crux</p>
</body></html>
