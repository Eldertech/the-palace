<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STIGMERGY · entry agent — Merleau-Ponty</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; padding:0; background:#05080a; }
  * { box-sizing:border-box; }
  #stage { font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
  ::-webkit-scrollbar { width:0; height:0; }
</style>
</head>
<body>
<div id="stage" style="position:relative; width:100%; height:100vh; min-height:560px; background:#05080a; overflow:hidden; user-select:none;">
  <canvas id="cv" style="position:absolute; inset:0; width:100%; height:100%;"></canvas>

  <div id="track" style="position:absolute; top:6px; bottom:34px; right:3px; width:4px; background:rgba(116,232,154,0.07); border-radius:2px; z-index:6;">
    <div id="thumb" style="position:absolute; left:0; width:4px; background:#2d5a37; border-radius:2px;"></div>
  </div>

  <div id="bar" style="position:absolute; left:0; right:0; bottom:0; height:28px; display:flex; align-items:center; gap:18px; padding:0 14px; background:#070d09; border-top:1px solid #16331d; color:#3f7a4f; font-size:12px; letter-spacing:0.5px; z-index:7;">
    <span><b style="color:#8effb0">S</b> state</span><span><b style="color:#8effb0">Q</b> queue</span><span><b style="color:#8effb0">L</b> log</span><span><b style="color:#8effb0">R</b> reload</span><span><b style="color:#8effb0">V</b> visual off</span>
    <span style="margin-left:auto; color:#5a4a1e;">scroll the page · drag the window · talk to the agent ↕</span>
  </div>

  <div id="win" style="position:absolute; right:16px; left:400px; top:96px; height:300px; z-index:5; background:rgba(18,12,4,0.94); border:1.5px solid #ffb347; box-shadow:0 0 0 1px rgba(255,179,71,0.25), 0 0 22px rgba(255,150,30,0.18); border-radius:4px; display:flex; flex-direction:column; overflow:hidden;">
    <div id="title" style="cursor:grab; padding:6px 9px; background:rgba(255,179,71,0.14); border-bottom:1px solid rgba(255,179,71,0.4); color:#ffce8a; font-size:11px; letter-spacing:0.5px; display:flex; align-items:center; gap:6px;">
      <span style="color:#ffb347;">◆</span> entry agent · Merleau-Ponty
      <span id="busy" style="color:#b98a3e; font-size:10px; opacity:0;">· thinking…</span>
      <span style="margin-left:auto; color:#b98a3e; font-size:10px;">reading:&nbsp;<span id="ctx" style="color:#ffce8a;">—</span></span>
    </div>
    <div id="log" style="flex:1; overflow-y:auto; padding:9px 10px; font-size:11.5px; line-height:1.55; color:#e9c98f; display:flex; flex-direction:column; gap:9px;"></div>
    <div style="display:flex; border-top:1px solid rgba(255,179,71,0.3);">
      <input id="say" placeholder="discuss, or just say what to change…" style="flex:1; background:transparent; border:none; outline:none; color:#ffe6bf; font-family:inherit; font-size:11.5px; padding:8px 10px;" />
      <button id="send" style="background:transparent; border:none; border-left:1px solid rgba(255,179,71,0.3); color:#ffb347; font-family:inherit; font-size:12px; padding:0 12px; cursor:pointer;">▸</button>
    </div>
    <div id="resize" title="drag to set height" style="position:absolute; left:50%; bottom:-1px; transform:translateX(-50%); width:46px; height:11px; cursor:ns-resize; display:flex; align-items:center; justify-content:center; color:#1a1206; background:#ffb347; border-radius:0 0 3px 3px; font-size:9px;">▿</div>
  </div>
</div>

<script>
(function(){
  // ---------- grounding (injected palace context) ----------
  var FLOOR = "THE PALACE FLOOR. The Palace is a rhizomatic knowledge organism built by Loudon Stearns (musician, educator, creative technologist). Edges carry more meaning than nodes; relations are primary. Everything is tagged with the Four Pillars: Creation (music), Tools (technology), Philosophy, Practice. Entries have a type, a stage (seed, sprout, growing, mature, fruiting, dormant, composting), a forward vector, and typed links (connects-to, deepens, mirrors, enables, contradicts, couples-with, exemplifies, member-of). The forward vector of the whole palace: symbiotic human and AI flourishing through joyful creation. Working values: depth over coverage; name the specific reason, not a label that stands in for one; cross-domain synthesis is the prize; contradictions are generative. Every page is both data and the spirit of an agent. Graffiti notes are short informal marginal scrawls pinned to a page — a real palace convention.";

  var NEIGHBORHOOD = "THIS PAGE'S TYPED-LINK NEIGHBORHOOD.\n"
   + "- Boundary-Crossing Instruments (this page DEEPENS it; label: instrument-as-body-extension): a mature breakthrough about instruments that cross a perceptual threshold. Merleau-Ponty deepens it: the moment the instrument joins the body schema is the moment the boundary moves to its far edge.\n"
   + "- Playful Interface Design (this page DEEPENS it; label: motor-intentionality-of-the-knob): a practice entry arguing interface character should be chosen from a living vocabulary of archetypes (the seance medium, the crystal oracle); make the control absorbable.\n"
   + "- Hilaritas Generator (connects-to; label: skilled-joy-is-bodily): a foundational hub — whole-being joy as the felt signature of expanding power-to-act; skill via joy; conatus applied to pedagogy.\n"
   + "- Spinoza Conatus (connects-to; label: power-to-act-is-embodied): each thing strives to persist in its being; the increase in power-to-act. Merleau-Ponty grounds this striving in the felt body.\n"
   + "- Confucianism (connects-to; label: li-as-body-schema): ritual (li) reshapes the interior through repeated bodily performance — possibly the same insight as the body schema, from ritual rather than phenomenology.\n"
   + "- Palace Philosophies (connects-to): the hub that gathers the palace's philosophical lenses.";

  // ---------- the page (the scroll) ----------
  var blocks = [
    {id:'i0', sec:'—', t:'p', text:"Maurice Merleau-Ponty (1908–1961) is the phenomenologist of the body. Where most of the palace's philosophers think about minds, relations, and substances, Merleau-Ponty thinks about the fact that you are a body playing an instrument — and that this changes everything about what knowledge, skill, and meaning are. For a palace whose practice pillar insists that learning happens through making, he is the missing ground."},
    {id:'cc', sec:'CORE CONCEPTS', t:'h', text:'CORE CONCEPTS'},
    {id:'c1', sec:'CORE CONCEPTS', t:'p', text:"The body schema. You do not navigate the world by computing the position of your limbs; your body has a pre-reflective, operative grasp of itself and its reach. You know where your hand is without looking. Skill is the extension of this schema to take in new territory."},
    {id:'c2', sec:'CORE CONCEPTS', t:'p', text:"The instrument as body extension. His palace-perfect example: a blind man's cane stops being an object he perceives and becomes an instrument he perceives through. The tip of the cane is where his perception now lives. This is exactly what happens when a synth becomes transparent — the player stops operating the knobs and starts feeling the sound directly through them. Mastery is this absorption."},
    {id:'c3', sec:'CORE CONCEPTS', t:'p', text:"Motor intentionality. The hand reaching for the cup does not first form a mental representation and then execute it; the reaching is a form of intentionality in its own right — the body means the cup directly. There is a knowing-how that is not a watered-down knowing-that. The fingers find the chord before the mind names it."},
    {id:'lt', sec:'LENS ON THE TECHNICAL WORK', t:'h', text:'LENS ON THE TECHNICAL WORK'},
    {id:'l1', sec:'LENS ON THE TECHNICAL WORK', t:'p', text:"Why practice is irreducible — literally. The Four Pillars and the Hilaritas Generator hold that practice cannot be replaced by understanding. Merleau-Ponty says why: skill lives in the body schema, and the body cannot be shortcut by explanation. You cannot read your way into the absorption of the instrument; the hands have to do the hours. This is the phenomenological proof of the palace's pedagogy."},
    {id:'l2', sec:'LENS ON THE TECHNICAL WORK', t:'p', text:"Interface design is body-schema design. Playful Interface Design and Logarithmic Interface Scaling are attempts to make a control absorbable — to design a knob the body can take into its schema until the device disappears. A good interface stops being perceived and becomes perceived-through. That is a sharper design target than 'intuitive.'"},
    {id:'st', sec:'IN STIGMERGY', t:'h', text:'IN STIGMERGY'},
    {id:'s1', sec:'IN STIGMERGY', t:'p', text:"If STIGMERGY becomes the one terminal Loudon lives in, Merleau-Ponty sets its real success criterion: the front-end succeeds when it disappears. The phosphor, the keystrokes, the three decks should be absorbed into the body schema until he is not operating STIGMERGY but thinking through it into the palace — the way the cane's tip becomes where perception lives. Every editing convenience that makes Loudon think about the tool breaks the absorption."}
  ];
  function pageText(){
    return "THIS PAGE — entry 'Merleau-Ponty' (type concept; pillars philosophy, creation, practice; stage sprout). Section names in CAPS; '—' is the intro.\n\n" +
      blocks.map(function(b){ return b.t==='h' ? ('\n## '+b.text) : (b.t==='g' ? ('[graffiti: '+b.text+']') : b.text); }).join('\n');
  }
  function sectionNames(){ var n=['—']; blocks.forEach(function(b){ if(b.t==='h' && n.indexOf(b.sec)<0) n.push(b.sec); }); return n; }

  // ---------- canvas reflow + glow ----------
  var stage=document.getElementById('stage'), cv=document.getElementById('cv'), ctx2=cv.getContext('2d');
  var win=document.getElementById('win'), title=document.getElementById('title'), resize=document.getElementById('resize');
  var ctxLabel=document.getElementById('ctx'), logEl=document.getElementById('log'), say=document.getElementById('say'), send=document.getElementById('send');
  var busy=document.getElementById('busy'), thumb=document.getElementById('thumb'), track=document.getElementById('track');
  var dpr=Math.max(1, window.devicePixelRatio||1);
  var PADX=26, PADTOP=26, LH=22, GUT=18, MINSEG=210, BODY='#74e89a', HEAD='#cfe9d4';
  var BODY_GLOW='#b7ffce', HEAD_GLOW='#eafff0', GRAF='#d9a3ff', GRAF_GLOW='#f0c8ff';
  var RPIN=16, MINW=220;
  var scrollY=0, contentH=0, parked='—';

  function viewH(){ return stage.clientHeight-28; }
  function size(){
    var w=stage.clientWidth, h=viewH();
    cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
    ctx2.setTransform(dpr,0,0,dpr,0,0); clamp(); draw();
  }
  function box(){ return {x0:win.offsetLeft, y0:win.offsetTop, x1:win.offsetLeft+win.offsetWidth, y1:win.offsetTop+win.offsetHeight, cy:win.offsetTop+win.offsetHeight/2}; }
  function segs(screenTop, b, left, right){
    if(b.y0 < screenTop+LH && b.y1 > screenTop){
      var L=b.x0-GUT, lw=L-left;
      return lw>=MINSEG ? [{a:left,z:L}] : [];
    }
    return [{a:left,z:right}];
  }
  function draw(){
    var W=cv.width/dpr, VH=viewH();
    ctx2.clearRect(0,0,W,VH); ctx2.fillStyle='#05080a'; ctx2.fillRect(0,0,W,VH);
    var b=box(), left=PADX, right=W-PADX-10, y=PADTOP, heads=[];
    var winCenterContent = scrollY + b.cy;
    for(var k=0;k<blocks.length;k++){
      var bl=blocks[k], isH=bl.t==='h', isG=bl.t==='g';
      if(isH){ y+=16; heads.push({name:bl.text, cy:y}); ctx2.font='600 13px JetBrains Mono, monospace'; }
      else if(isG){ y+=4; ctx2.font='12px JetBrains Mono, monospace'; }
      else ctx2.font='13px JetBrains Mono, monospace';
      var glow=(bl.sec===parked);
      var col = isH ? (glow?HEAD_GLOW:HEAD) : isG ? (glow?GRAF_GLOW:GRAF) : (glow?BODY_GLOW:BODY);
      var raw = isG ? ('▟ graffiti — '+bl.text) : bl.text;
      var words=raw.split(' '), i=0, ly=y, safe=0;
      while(i<words.length && safe<800){
        safe++;
        var screenTop=ly-scrollY;
        var ss=segs(screenTop,b,left,right);
        if(ss.length===0){ ly+=LH; continue; }
        for(var si=0; si<ss.length; si++){
          var x=ss[si].a;
          while(i<words.length){
            var wd=words[i]+' ', ww=ctx2.measureText(wd).width;
            if(x+ww<=ss[si].z){
              if(screenTop>-LH && screenTop<VH){
                if(glow){ ctx2.shadowColor= isG ? 'rgba(217,163,255,0.6)' : 'rgba(120,255,170,0.55)'; ctx2.shadowBlur=8; } else ctx2.shadowBlur=0;
                ctx2.fillStyle=col; ctx2.fillText(words[i], x, screenTop+15);
              }
              x+=ww; i++;
            } else break;
          }
        }
        ly+=LH;
      }
      ctx2.shadowBlur=0;
      y=ly+(isH?6:isG?9:13);
    }
    contentH=y;
    var pick='—';
    for(var h=0;h<heads.length;h++){ if(heads[h].cy<=winCenterContent) pick=heads[h].name; }
    if(heads[0] && winCenterContent<heads[0].cy) pick='—';
    if(pick!==parked){ parked=pick; ctxLabel.textContent= parked==='—'?'intro':parked; draw(); return; }
    ctxLabel.textContent = parked==='—'?'intro':parked;
    var maxS=Math.max(0,contentH-VH+24);
    var th=Math.max(26, VH*VH/Math.max(VH,contentH)); var tArea=track.clientHeight-th;
    thumb.style.height=th+'px'; thumb.style.top=(maxS>0?(scrollY/maxS)*tArea:0)+'px';
  }
  function clamp(){
    var W=stage.clientWidth, VH=viewH();
    win.style.left=Math.max(0,Math.min(W-RPIN-MINW,win.offsetLeft))+'px';
    win.style.top=Math.max(0,Math.min(VH-win.offsetHeight,win.offsetTop))+'px';
    var maxS=Math.max(0,contentH-VH+24); if(scrollY<0)scrollY=0; if(scrollY>maxS)scrollY=maxS;
  }
  stage.addEventListener('wheel',function(e){
    var maxS=Math.max(0,contentH-viewH()+24);
    scrollY=Math.max(0,Math.min(maxS,scrollY+e.deltaY)); e.preventDefault(); draw();
  },{passive:false});
  win.addEventListener('wheel',function(e){ e.stopPropagation(); });

  var drag=null;
  title.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,l:win.offsetLeft,t:win.offsetTop};title.style.cursor='grabbing';e.preventDefault();});
  resize.addEventListener('pointerdown',function(e){drag={rz:1,y:e.clientY,h:win.offsetHeight};e.preventDefault();e.stopPropagation();});
  window.addEventListener('pointermove',function(e){
    if(!drag) return;
    if(drag.rz){ win.style.height=Math.max(190,Math.min(viewH()-win.offsetTop, drag.h+(e.clientY-drag.y)))+'px'; }
    else { win.style.left=(drag.l+e.clientX-drag.x)+'px'; win.style.top=(drag.t+e.clientY-drag.y)+'px'; clamp(); }
    draw();
  });
  window.addEventListener('pointerup',function(){ if(drag) title.style.cursor='grab'; drag=null; });

  // ---------- conversational agent (chat + loose editing) ----------
  var history=[]; var prevBlocks=null;
  function bubble(who,html){
    var d=document.createElement('div');
    if(who==='u'){ d.style.cssText='align-self:flex-end; max-width:86%; background:rgba(255,179,71,0.16); border:1px solid rgba(255,179,71,0.35); padding:4px 8px; border-radius:4px; color:#ffe6bf;'; d.textContent=html; }
    else { d.style.cssText='align-self:flex-start; max-width:94%; color:#cfe9d4;'; d.innerHTML='<span style="color:#b98a3e;">['+(parked==='—'?'intro':parked)+'] </span>'+html; }
    logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; return d;
  }
  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
  function parkedParas(){ return blocks.filter(function(b){return b.sec===parked && b.t==='p';}).map(function(b){return b.text;}).join('\n\n'); }

  function protocol(){
    return "You are the agent of the Palace entry 'Merleau-Ponty' — a page that is also the spirit of an agent. You and Loudon are reading and editing this page together, conversationally. You are grounded ONLY in the provided material: the palace floor, this page in full, and the page's typed-link neighborhood. Your attention is currently on the section \"" + (parked==='—'?'the intro':parked) + "\", which reads:\n\"\"\"\n" + parkedParas() + "\n\"\"\"\n\n"
    + "EVERY turn, decide whether Loudon is just talking with you, or asking you to change the page — follow his lead loosely and naturally. He will say things like 'add a little more context at the end', 'tighten this', 'put that in as a graffiti note at the top', 'make the second sentence sharper'. Honor the spirit of the request.\n\n"
    + "Respond with ONE JSON object and nothing else:\n"
    + "{\"say\":\"<short reply in the palace register, 1-3 sentences>\", \"edit\": null }\n"
    + "or, when he wants a change:\n"
    + "{\"say\":\"<short reply describing what you did>\", \"edit\": {\"op\":\"append|prepend|rewrite|graffiti\", \"section\":\"<section name, or '—' for intro>\", \"text\":\"<the prose to use>\"} }\n\n"
    + "op meanings: 'append' adds your text as a new paragraph at the END of the section; 'prepend' adds it as a new FIRST paragraph; 'rewrite' replaces the section's body paragraphs with your text; 'graffiti' pins a short informal marginal note (one line) at the TOP of the section. Default 'section' to the focused one unless Loudon names another. When he says 'what you just said' or 'that', reuse your previous message's content. Keep edits faithful to the page and its neighborhood; write in the palace's voice, not a generic one. Output ONLY the JSON, no code fences.";
  }
  function parseResp(out){
    if(!out) return {say:'', edit:null};
    var m=out.match(/\{[\s\S]*\}/);
    if(m){ try{ var o=JSON.parse(m[0]); return {say:(o.say||''), edit:(o.edit||null)}; }catch(e){} }
    return {say:out, edit:null};
  }
  async function ask(prompt){
    var data=[FLOOR, pageText(), NEIGHBORHOOD];
    if(window.cowork && typeof window.cowork.askClaude==='function'){
      try{
        var r=await window.cowork.askClaude(prompt, data);
        if(typeof r==='string') return r;
        if(r){ if(r.text) return r.text; if(r.content){ if(typeof r.content==='string') return r.content; if(r.content[0]&&r.content[0].text) return r.content[0].text; } if(r.structuredContent&&r.structuredContent.text) return r.structuredContent.text; return JSON.stringify(r); }
      }catch(err){ return JSON.stringify({say:"(couldn't reach inference: "+err+")", edit:null}); }
    }
    return null;
  }
  function matchSection(name){
    if(!name) return parked;
    var n=String(name).toLowerCase().trim();
    if(n==='—'||/intro/.test(n)) return '—';
    var names=sectionNames();
    for(var s of names){ var ls=s.toLowerCase(); if(ls===n||ls.indexOf(n)>=0||n.indexOf(ls)>=0) return s; }
    return parked;
  }
  function applyEdit(op, section, text){
    var sec=matchSection(section);
    var paras=String(text||'').split(/\n{2,}/).map(function(s){return s.replace(/\n/g,' ').trim();}).filter(Boolean);
    if(!paras.length) return null;
    prevBlocks=blocks.slice();
    var out=[], inserted=false, did=false;
    if(op==='graffiti'){
      var note=paras.join(' ');
      if(sec==='—'){ out.push({id:'g'+Date.now(), sec:'—', t:'g', text:note}); blocks.forEach(function(b){out.push(b);}); }
      else { blocks.forEach(function(b){ out.push(b); if(!did && b.t==='h' && b.sec===sec){ out.push({id:'g'+Date.now(), sec:sec, t:'g', text:note}); did=true; } }); }
      blocks=out; draw(); return sec;
    }
    if(op==='rewrite'){
      blocks.forEach(function(b){
        if(b.sec!==sec){ out.push(b); return; }
        if(b.t==='h'||b.t==='g'){ out.push(b); return; }
        if(!inserted){ paras.forEach(function(p,i){ out.push({id:sec+'_rw'+i, sec:sec, t:'p', text:p}); }); inserted=true; }
      });
      if(!inserted){ var res=[]; out.forEach(function(b){ res.push(b); if(!did && b.t==='h' && b.sec===sec){ paras.forEach(function(p,i){res.push({id:sec+'_rw'+i,sec:sec,t:'p',text:p});}); did=true; } }); out=res; }
      blocks=out; draw(); return sec;
    }
    // append / prepend
    var idxs=[]; blocks.forEach(function(b,i){ if(b.sec===sec) idxs.push(i); });
    if(!idxs.length){ blocks=prevBlocks; prevBlocks=null; return null; }
    var insertAt;
    if(op==='prepend'){ var p=idxs[0]; while(p<blocks.length && blocks[p].sec===sec && (blocks[p].t==='h'||blocks[p].t==='g')) p++; insertAt=p; }
    else { insertAt=idxs[idxs.length-1]+1; }
    var nb=paras.map(function(p,i){ return {id:sec+'_'+op+(Date.now()+i), sec:sec, t:'p', text:p}; });
    blocks=blocks.slice(0,insertAt).concat(nb, blocks.slice(insertAt)); draw(); return sec;
  }

  async function turn(msg){
    history.push({r:'Loudon', t:msg});
    var thinking=bubble('a','<span style="opacity:0.55;">…</span>'); busy.style.opacity='1';
    var convo=history.map(function(h){return h.r+': '+h.t;}).join('\n');
    var out=await ask(protocol()+"\n\nConversation so far:\n"+convo+"\nAgent (JSON):");
    busy.style.opacity='0'; thinking.remove();
    if(out===null){ bubble('a','Live inference runs when you open me inside the Cowork sidebar — there I\'ll both discuss and edit. (Standalone preview can\'t reach the model.)'); return; }
    var resp=parseResp(out);
    if(resp.say){ bubble('a', escapeHtml(resp.say)); history.push({r:'Agent', t:resp.say}); }
    if(resp.edit && resp.edit.op){
      var sec=applyEdit(resp.edit.op, resp.edit.section, resp.edit.text);
      if(sec){
        var label=resp.edit.op+' · '+(sec==='—'?'intro':sec);
        var nb=bubble('a','<span style="color:#b98a3e;">▟ '+label+'</span> · applied in place — <a href="#" class="undo" style="color:#ffb347;">undo</a>');
        var u=nb.querySelector('.undo'); if(u) u.addEventListener('click',function(e){ e.preventDefault(); if(prevBlocks){ blocks=prevBlocks; prevBlocks=null; draw(); bubble('a','Reverted — the words stand as they were.'); } });
      }
    }
  }
  function fire(){ var v=say.value.trim(); if(!v) return; say.value=''; bubble('u',v); turn(v); }
  send.addEventListener('click',fire);
  say.addEventListener('keydown',function(e){ if(e.key==='Enter') fire(); });
  say.addEventListener('pointerdown',function(e){ e.stopPropagation(); });

  bubble('a','I\'m the agent of this page — grounded in the Merleau-Ponty entry, its six typed-link neighbors, and the palace floor. Scroll me over a section and it glows as I read it. Talk to me about the words, or just say what to change: <i>"add a line at the end about li", "tighten this", "pin that as a graffiti note up top."</i>');

  window.addEventListener('resize',size);
  setTimeout(size,40); size();
})();
</script>
</body>
</html>
