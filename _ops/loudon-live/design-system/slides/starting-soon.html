<!doctype html><html lang="en" class="skin-graphite"><head><meta charset="utf-8">
<title>Loudon Live · Starting Soon</title>
<link rel="stylesheet" href="stage.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Waveform band sits between two clean bands. Generous vertical headroom
     so sine peaks aren't clipped. */
  .gen {
    position: absolute;
    top: 380px;
    left: 0; right: 0;
    height: 340px;
    overflow: hidden;
    opacity: 1;
    z-index: 1;
  }
  .gen img {
    width: 100%; height: 100%;
    object-fit: fill;
    display: block;
  }

  .note {
    position: absolute;
    top: 110px; left: 120px; right: 120px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 200px;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--fg-1);
    z-index: 2;
  }
  .note em { font-style: italic; font-weight: 300; color: var(--accent); }

  .field-rule {
    position: absolute;
    left: 120px; right: 120px;
    height: 1px;
    background: var(--border);
    opacity: 0.5;
  }
  .field-rule.top    { top: 370px; }
  .field-rule.bottom { top: 730px; }

  .band {
    position: absolute;
    left: 120px; right: 120px;
    top: 770px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .band .eyebrow-big {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    color: var(--accent);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .band .subhead {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: 28px;
    color: var(--fg-2);
    letter-spacing: 0.005em;
    max-width: 1400px;
  }

  .footer-left { display: none; }
  .footer-left-orig {
    bottom: 90px; left: 120px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.18em;
    color: var(--fg-3);
    text-transform: uppercase;
  }
  .footer-right {
    bottom: 78px; right: 120px;
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 56px;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    line-height: 1;
  }
  .footer-right .conn { text-transform: none; font-size: 0.55em; color: var(--fg-3); margin: 0 6px; }
  .footer-right .accent {
    color: var(--accent);
    text-shadow:
      0 0 14px rgba(232,184,74,0.65),
      0 0 32px rgba(232,184,74,0.30);
  }

  /* shared alive-strip — bottom-left pulsing live indicator */
  .alive-strip {
    position: absolute;
    bottom: 90px; left: 120px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--fg-2);
    z-index: 3;
  }
  .alive-strip::before {
    content: '';
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #ff2a2a;
    box-shadow: 0 0 6px rgba(255,42,42,0.95), 0 0 14px rgba(255,42,42,0.75), 0 0 32px rgba(255,42,42,0.40);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .alive-strip .live { color: #ff2a2a; }
  .alive-strip .sep { color: var(--fg-3); }
  .alive-strip .clock {
    font-family: 'Silkscreen', monospace;
    color: var(--accent);
    text-shadow: 0 0 6px rgba(232,184,74,0.45);
    letter-spacing: 0.06em;
  }

</style></head>
<body>
<div class="stage"><div class="slide" data-screen-label="Starting Soon">
  <div class="frame"></div>

  <div class="note">Starting<br><em>soon.</em></div>

  <div class="field-rule top"></div>
  <div class="gen"><img src="../assets/generators/waveform-stack.bold.svg" alt=""></div>
  <div class="field-rule bottom"></div>

  <div class="band">
    <div class="eyebrow-big">Today · all-pass loops &amp; inharmonic resonators</div>
    <div class="subhead">sound from the ground up · working on something synth-shaped · chat is open the whole time.</div>
  </div>

    <div class="alive-strip"><span class="live">stream alive</span><span class="sep">·</span><span class="clock">19:30</span></div>
  <div class="footer-right">LOUD’N <span class="accent">LIVE</span></div>
</div></div>
<script src="stage.js"></script>
</body></html>
