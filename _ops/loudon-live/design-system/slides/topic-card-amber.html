<!doctype html><html lang="en" class="skin-amber-lab"><head><meta charset="utf-8">
<title>Loudon Live · Topic Title · Philosophy register</title>
<link rel="stylesheet" href="stage.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Amber Lab as the philosophy / theory / quote register — Tufte-leaning:
     a contained header band sized exactly to the title bar, generous margins,
     a marginal pull-quote alongside the headline. */
  html, body { background: #f4ecdc; }
  .slide { background: #f4ecdc; color: #2a1d10; }
  .gen { display: none; }
  .frame { border-color: rgba(42,29,16,0.18); }

  /* --- shared horizontal margin so titlebar + image align exactly --- */
  :root { --gutter: 120px; }

  /* title bar - top of slide, gutter-aligned */
  .titlebar {
    position: absolute;
    top: 40px;
    left: var(--gutter); right: var(--gutter);
    height: 76px;
    background: #2a1d10;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 0 28px; z-index: 2;
  }
  .titlebar > * {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    color: #d6c9b0;
  }
  .titlebar .tb-left {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 36px;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    color: #f4ecdc;
    line-height: 1;
    text-align: left;
  }
  .titlebar .tb-left .conn  { text-transform: none; font-size: 0.55em; color: #6e5a45; margin: 0 4px; }
  .titlebar .tb-left .accent { color: #e8651b; text-shadow: 0 0 12px rgba(232,101,27,0.45); }
  .titlebar .tb-center { text-align: center; color: #e8651b; }
  .titlebar .tb-right  { text-align: right; }

  /* thin accent rule - 16 px below title bar */
  .tb-rule {
    position: absolute;
    top: 132px;
    left: var(--gutter); right: var(--gutter);
    height: 1px;
    background: #e8651b;
    opacity: 0.45;
    z-index: 2;
  }

  /* header image - 36 px below rule, ends at 432 */
  .header-image {
    position: absolute;
    top: 168px;
    left: var(--gutter); right: var(--gutter);
    height: 264px;
    background: #2a1d10;
    overflow: hidden;
  }
  .header-image img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: hue-rotate(-12deg) saturate(0.55) brightness(0.85);
    opacity: 0.75;
  }
  /* thoughtful smudge — soft inner vignette + a dust/grain veil */
  .header-image::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(140% 130% at 50% 50%, transparent 30%, rgba(42,29,16,0.55) 100%),
      linear-gradient(180deg, rgba(244,236,220,0.0) 60%, rgba(244,236,220,0.35) 100%);
  }
  .header-image::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none; opacity: 0.45;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.16  0 0 0 0 0.11  0 0 0 0 0.07  0 0 0 0.55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
  }

  /* register stamp — top-right of the header image, like a Tufte marginal note */
  .header-image .stamp {
    position: absolute;
    top: 18px; right: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #f0d9b8;
    background: rgba(42,29,16,0.55);
    padding: 6px 12px;
    border: 1px solid rgba(232,101,27,0.55);
  }

  .grid {
    position: absolute;
    top: 488px;
    left: var(--gutter); right: var(--gutter);
    bottom: 232px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
  }

  .eyebrow-big {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #e8651b;
  }
  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 132px;
    letter-spacing: -0.015em;
    line-height: 0.92;
    color: #2a1d10;
    margin-top: 18px;
  }
  .headline em { font-style: italic; font-weight: 300; color: #e8651b; }

  .pull {
    border-left: 1.5px solid #e8651b;
    padding: 14px 0 14px 28px;
    margin-top: 48px;
  }
  .pull .quote {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 30px;
    line-height: 1.35;
    color: #2a1d10;
    letter-spacing: 0.005em;
  }
  .pull .quote em { font-style: italic; color: #e8651b; font-weight: 400; }
  .pull .attrib {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6e5a45;
    margin-top: 22px;
  }

  /* baseline rule removed */
  .baseline { display: none; }

  .footer-left {
    bottom: 100px; left: var(--gutter);
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px; letter-spacing: 0.18em; color: #6e5a45;
    text-transform: uppercase;
  }
  .footer-left .accent { color: #e8651b; }
  .footer-right {
    bottom: 90px; right: var(--gutter);
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6e5a45;
    font-weight: 500;
    line-height: 1;
  }
  .footer-right .conn  { text-transform: none; font-size: 0.55em; color: #6e5a45; }
  .footer-right .accent { color: #e8651b; }
</style></head>
<body>
<div class="stage"><div class="slide" data-screen-label="Topic Title · Philosophy register">
  <div class="titlebar">
    <span class="tb-left">LOUD’N <span class="accent">LIVE</span></span>
    <span class="tb-center">First principles</span>
    <span class="tb-right">Chapter 01 / 05</span>
  </div>

  <div class="tb-rule"></div>

  <div class="header-image">
    <img src="../assets/generators/spectral-bands.svg" alt="">
    <div class="stamp">Quote · Theory</div>
  </div>

  <div class="grid">
    <div>
      <div class="eyebrow-big">What is a frequency?</div>
      <div class="headline">Cycles<br>per <em>second.</em></div>
    </div>

    <div class="pull">
      <div class="quote">Hilaritas is not a side effect of good teaching — <em>it IS the teaching.</em></div>
      <div class="attrib">After Spinoza · Hilaritas Generator</div>
    </div>
  </div>

  <div class="baseline"></div>
  <div class="footer-left"><span class="accent">●</span> PHILOSOPHY · CREATION · TOOLS · PRACTICE</div>
  <div class="footer-right">Philosophy · <span class="accent">Stream 008</span></div>
</div></div>
<script src="stage.js"></script>
</body></html>
