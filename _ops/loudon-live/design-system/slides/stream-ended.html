<!doctype html><html lang="en" class="skin-graphite"><head><meta charset="utf-8">
<title>Loudon Live · Stream Ended</title>
<link rel="stylesheet" href="stage.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@500&family=Silkscreen&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  /* p5 canvas host — full-bleed, behind everything */
  .liss-host { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: var(--bg); }
  .liss-host canvas { display: block; width: 100%; height: 100%; }
  .gen { display: none; }

  .scan {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(232,184,74,0.02) 0 1px, transparent 1px 4px);
    opacity: 0.6;
  }
  .vignette {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(95% 75% at 50% 50%, transparent 30%, rgba(10,10,15,0.65) 100%);
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 120px;
    z-index: 2;
    text-align: center;
  }
  .subhead {
    position: absolute;
    left: 50%;
    bottom: 180px;
    transform: translateX(-50%);
    display: inline-block;
    font-family: 'Manrope', sans-serif;
    font-weight: 300;
    font-size: 28px;
    color: var(--fg-1);
    letter-spacing: 0.005em;
    background: rgba(10,10,15,0.78);
    backdrop-filter: blur(8px);
    padding: 14px 22px;
    border-left: 3px solid var(--accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.45);
    z-index: 3;
    text-align: left;
  }
  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 220px;
    letter-spacing: -0.02em;
    line-height: 0.95;
    color: var(--fg-1);
    text-shadow: 0 4px 36px rgba(10,10,15,0.85), 0 0 32px rgba(10,10,15,0.5);
    text-align: center;
  }
  .headline em { font-style: italic; font-weight: 300; color: var(--accent); }
  .subhead-inline { display: none; }
  .footer-right {
    bottom: 78px; right: 120px;
    font-family: 'Anton', sans-serif;
    font-weight: 400; font-size: 56px;
    letter-spacing: 0.005em; text-transform: uppercase; line-height: 1;
    text-shadow: 0 2px 18px rgba(10,10,15,0.85);
    z-index: 3;
  }
  .footer-right .conn { text-transform: none; font-size: 0.55em; color: var(--fg-3); margin: 0 6px; }
  .footer-right .accent {
    color: var(--accent);
    text-shadow: 0 0 14px rgba(232,184,74,0.65), 0 0 32px rgba(232,184,74,0.30);
  }

  .alive-strip {
    position: absolute;
    bottom: 90px; left: 120px;
    display: inline-flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--fg-2);
    z-index: 3;
  }
  .alive-strip::before {
    content: '';
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #ff2a2a;
    box-shadow: 0 0 6px rgba(255,42,42,0.95), 0 0 14px rgba(255,42,42,0.75), 0 0 32px rgba(255,42,42,0.40);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .alive-strip .live { color: #ff2a2a; }
  .alive-strip .sep { color: var(--fg-3); }
  .alive-strip .clock {
    font-family: 'Silkscreen', monospace;
    color: var(--accent);
    text-shadow: 0 0 6px rgba(232,184,74,0.45);
    letter-spacing: 0.06em;
  }
</style></head>
<body>
<div class="stage"><div class="slide" data-screen-label="Stream Ended">
  <div class="liss-host" id="lissHost"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="headline">That's<br>the <em>stream.</em></div>
  </div>

  <div class="subhead">Thanks for hanging out · VOD stays up · subscribe for the next one.</div>

  <div class="alive-strip"><span class="live">stream alive</span><span class="sep">·</span><span class="clock">01:42:08</span></div>
  <div class="footer-right">LOUD’N <span class="accent">LIVE</span></div>
</div></div>
<script src="stage.js"></script>
<script>
/* Same detuned two-oscillator Lissajous as the BRB slide, centered. */
new p5(function (s) {
  const W = 1920, H = 1080;
  const A_BASE = 3, B_BASE = 4;
  const DETUNE = 0.0006;
  let t0;

  s.setup = function () {
    const host = document.getElementById('lissHost');
    const c = s.createCanvas(W, H);
    c.parent(host);
    s.noFill();
    s.background(10, 10, 15);
    t0 = s.millis() / 1000;
    draw(0);
  };

  function draw(phi) {
    s.noStroke();
    s.fill(10, 10, 15, 38);
    s.rect(0, 0, W, H);

    const cx = W * 0.50;          // centered behind the headline
    const cy = H * 0.50;
    const A = H * 0.44;
    const B = H * 0.44;
    const a = A_BASE + DETUNE * phi;
    const b = B_BASE;

    s.strokeCap(s.ROUND);

    // primary trace
    s.stroke(232, 184, 74, 230);
    s.strokeWeight(1.8);
    s.beginShape();
    const N = 2600;
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * s.TWO_PI;
      const x = cx + Math.sin(a * t + phi * 0.4) * A;
      const y = cy + Math.sin(b * t) * B;
      s.vertex(x, y);
    }
    s.endShape();

    // ghost trace
    s.stroke(232, 184, 74, 80);
    s.strokeWeight(0.9);
    s.beginShape();
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * s.TWO_PI;
      const x = cx + Math.sin(a * t + phi * 0.4 + 0.04) * A * 0.98;
      const y = cy + Math.sin(b * t + 0.02) * B * 0.98;
      s.vertex(x, y);
    }
    s.endShape();
  }

  s.draw = function () {
    const t = s.millis() / 1000 - t0;
    draw(t);
  };
}, document.body);
</script>
</body></html>
