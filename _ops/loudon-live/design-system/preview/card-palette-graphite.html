<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style></style></head>
<body class="card">
<div class="eyebrow" style="color:#7a7a8e">Graphite (default channel skin)</div>
<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 0.6fr;gap:4px;height:120px">
  <div style="background:#0a0a0f;border:1px solid #7a7a8e33;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:#7a7a8e;text-transform:uppercase">bg</div>
    <div style="font-family:var(--mono);font-size:11px;color:#c8c8d8">#0a0a0f</div>
  </div>
  <div style="background:#12121a;border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:#7a7a8e;text-transform:uppercase">elev</div>
    <div style="font-family:var(--mono);font-size:10px;color:#c8c8d8">#12121a</div>
  </div>
  <div style="background:#e8e8f0;border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;color:#0a0a0f">
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;opacity:.7">fg-1</div>
    <div style="font-family:var(--mono);font-size:10px">#e8e8f0</div>
  </div>
  <div style="background:#c8c8d8;border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;color:#0a0a0f">
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;opacity:.7">fg-2</div>
    <div style="font-family:var(--mono);font-size:10px">#c8c8d8</div>
  </div>
  <div style="background:#7a7a8e;border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;color:#0a0a0f">
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;opacity:.7">fg-3</div>
    <div style="font-family:var(--mono);font-size:10px">#7a7a8e</div>
  </div>
  <div style="background:#e8b84a;border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;color:#0a0a0f">
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;opacity:.7">acc</div>
    <div style="font-family:var(--mono);font-size:9px">#e8b84a</div>
  </div>
</div>
<div style="background:#0a0a0f;border:1px solid #7a7a8e33;border-radius:6px;padding:14px 16px">
  <div style="font-family:var(--serif);font-size:22px;font-weight:700;color:#e8e8f0;letter-spacing:-0.02em">Loudon <em style="font-style:italic;font-weight:300;color:#e8b84a">Live</em></div>
  <div style="font-family:var(--mono);font-size:10px;color:#e8b84a;letter-spacing:0.14em;text-transform:uppercase;margin-top:4px">today · first principles</div>
  <div style="font-family:var(--sans);font-size:12px;color:#7a7a8e;margin-top:4px">Live build · session 003</div>
</div>
</body></html>
