<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body.card { gap: 16px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }

  .param {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: #4a8fff;
    background: rgba(74,143,255,0.06);
    border: 1.5px solid rgba(74,143,255,0.55);
    border-radius: 1px;
    padding: 3px 9px;
    letter-spacing: 0.02em;
  }
  .param.amber { color: var(--accent); background: rgba(232,184,74,0.06); border-color: rgba(232,184,74,0.55); }
  .param.green { color: #00ff66; background: rgba(0,255,102,0.06); border-color: rgba(0,255,102,0.50); }
  .param.red   { color: #ff2a2a; background: rgba(255,42,42,0.06); border-color: rgba(255,42,42,0.55); }

  .tier {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 6px;            /* slight curve — not capsule, not square */
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border: 1.5px solid;
  }
  .tier.sketch { color: var(--accent); border-color: rgba(232,184,74,0.55); background: rgba(232,184,74,0.06); }
  .tier.study  { color: #4a8fff;    border-color: rgba(74,143,255,0.55); background: rgba(74,143,255,0.06); }
  .tier.piece  { color: #00ff66;    border-color: rgba(0,255,102,0.50); background: rgba(0,255,102,0.06); }

  .legend { font-family: var(--mono); font-size: 11px; color: var(--fg-3); padding-top: 8px; border-top: 1px solid var(--border); display:flex; justify-content:space-between; }
</style></head>
<body class="card">
<div class="eyebrow">Tags &amp; params · square edges · 1.5 px borders · technical register</div>

<div class="row">
  <span class="param">fc = 440 Hz</span>
  <span class="param">τ = 12 ms</span>
  <span class="param">Q = 0.707</span>
  <span class="param amber">threshold = −18 dB</span>
  <span class="param amber">ratio = 4 : 1</span>
  <span class="param">feedback = 0.72</span>
  <span class="param">sample_rate = 48 kHz</span>
  <span class="param green">● locked</span>
  <span class="param red">● clip</span>
</div>

<div class="row">
  <span class="tier sketch">sketch</span>
  <span class="tier study">study</span>
  <span class="tier piece">piece</span>
</div>

<div class="legend">
  <span>tags · radius 1 · 1.5 px border</span>
  <span>tier pills · radius 6 · slight curve, not capsule</span>
</div>
</body></html>
