<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="card.css"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Manrope:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
<style></style></head>
<body class="card">
<div class="eyebrow">Buttons · solid accent · outlined · ghost</div>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <button style="font-family:'JetBrains Mono',monospace;letter-spacing:0.22em;text-transform:uppercase;font-weight:500;font-size:12px;background:var(--accent);color:var(--bg);border:0;padding:14px 26px;border-radius:2px;cursor:pointer;box-shadow:var(--glow-accent)">▸ Begin · sound on</button>
  <button style="font-family:'JetBrains Mono',monospace;letter-spacing:0.22em;text-transform:uppercase;font-weight:500;font-size:12px;background:transparent;color:var(--fg-1);border:1.5px solid var(--border);padding:14px 26px;border-radius:2px;cursor:pointer">Walk it again</button>
  <button style="font-family:'Manrope',sans-serif;font-size:13px;font-weight:500;background:var(--bg-elev-2);color:var(--fg-2);border:1.5px solid var(--border);padding:8px 14px;border-radius:2px;cursor:pointer">ghost</button>
</div>
<div class="label" style="line-height:1.5">Mono labels · +0.22em tracking · 2 px radius · accent glow reserved for the <em style="color:var(--accent);font-style:normal">one</em> primary action per view.</div>
</body></html>
