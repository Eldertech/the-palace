<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body.card { background: #050708; }
  .crt-bg { background: #000; position: relative; overflow: hidden; }
  .crt-bg::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(102,255,102,0.04) 0 1px, transparent 1px 3px);
  }
  .crt-bg::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  .swatch { display:grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr 0.7fr; gap:3px; height:90px; }
  .sw { padding: 10px 12px; display:flex; flex-direction:column; justify-content:space-between; border-radius: 4px; }
  .sw .k { font-family: 'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.8; }
  .sw .v { font-family: 'JetBrains Mono', monospace; font-size:10px; }
  .spec { padding: 18px 22px; border-radius: 6px; position: relative; min-height: 150px; }
  .spec .role { font-family: 'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#00ff66; text-shadow: 0 0 8px rgba(0,255,102,0.65); }
  .spec .scope-readout {
    font-family: 'JetBrains Mono', monospace;
    color:#66ff66;
    text-shadow: 0 0 6px rgba(102,255,102,0.7), 0 0 12px rgba(102,255,102,0.3);
    font-size:15px;
    line-height:1.6;
    margin-top:12px;
    letter-spacing:0.04em;
  }
  .spec .scope-readout .dim { color:#2d7a3d; text-shadow:none; }
  .spec .scope-readout .hi  { color:#b8ffb8; }
  .scope-svg { position: absolute; right: 18px; top: 18px; opacity: 0.95; }
</style></head>
<body class="card">
  <div class="eyebrow" style="color:#00ff66;text-shadow:0 0 6px rgba(0,255,102,0.5)">Palette · CRT · scope / DSP / signal-watching</div>

  <div class="swatch">
    <div class="sw" style="background:#000;color:#66ff66;border:1px solid #1a1a1a"><span class="k">bg</span><span class="v">#000000</span></div>
    <div class="sw" style="background:#060d09;color:#66ff66"><span class="k">elev</span><span class="v">#060d09</span></div>
    <div class="sw" style="background:#b8ffb8;color:#000"><span class="k">fg-1</span><span class="v">#b8ffb8</span></div>
    <div class="sw" style="background:#66dd66;color:#000"><span class="k">fg-2</span><span class="v">#66dd66</span></div>
    <div class="sw" style="background:#2d7a3d;color:#000"><span class="k">fg-3</span><span class="v">#2d7a3d</span></div>
    <div class="sw" style="background:#00ff66;color:#000"><span class="k">acc</span><span class="v">#00ff66</span></div>
  </div>

  <div class="spec crt-bg">
    <svg class="scope-svg" width="120" height="80" viewBox="0 0 120 80">
      <rect x="0" y="0" width="120" height="80" fill="none"/>
      <g stroke="#1a3a1a" stroke-width="0.4" fill="none">
        <line x1="0" y1="40" x2="120" y2="40"/>
        <line x1="60" y1="0" x2="60" y2="80"/>
        <line x1="0" y1="20" x2="120" y2="20"/>
        <line x1="0" y1="60" x2="120" y2="60"/>
        <line x1="30" y1="0" x2="30" y2="80"/>
        <line x1="90" y1="0" x2="90" y2="80"/>
      </g>
      <path d="M0,40 Q15,8 30,40 T60,40 T90,40 T120,40" fill="none" stroke="#66ff66" stroke-width="1.6" stroke-linecap="round" style="filter: drop-shadow(0 0 3px #00ff66)"/>
    </svg>

    <div class="role">● TRACE · CH1 · 440 Hz · 5 V/DIV</div>
    <div class="scope-readout">
      <span class="hi">&gt;</span> all_pass(b, x):<br>
      <span class="dim">  </span>y = -b*x + z⁻¹·(x + b·a)<br>
      <span class="dim">→ </span>resonance @ <span class="hi">2.4 kHz</span> · Q = 0.707<br>
      <span class="dim">  </span>partial spacing → <span class="hi">stretched</span>
    </div>
  </div>
</body></html>
