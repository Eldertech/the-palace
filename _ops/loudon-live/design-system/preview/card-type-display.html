<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  body.card { gap: 18px; }
  .stripe { display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--fg-3); }
  .stripe .live { color:var(--danger); display:flex; align-items:center; gap:6px; }
  .stripe .live::before { content:''; width:9px; height:9px; border-radius:50%; background:var(--danger); box-shadow:0 0 8px var(--danger); }
  .stripe .rule { flex:1; height:1px; background:var(--danger); opacity:0.55; }
  .hero { font-family: 'Anton', 'Bebas Neue', sans-serif; font-weight: 400; font-size: 110px; line-height: 0.85; letter-spacing: 0.005em; color: var(--fg-1); text-transform: uppercase; white-space: nowrap; }
  .hero .accent { color: var(--danger); text-shadow: 0 0 14px rgba(255,42,42,0.55), 0 0 28px rgba(255,42,42,0.30); }
  .hero .conn { text-transform: none; font-size: 0.55em; color: var(--fg-3); margin: 0 4px; }
  .hero .live { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 42px; letter-spacing: 0.06em; color: var(--accent); vertical-align: middle; text-shadow: 0 0 12px rgba(232,184,74,0.45); }
  .sub { display:flex; justify-content:space-between; gap:24px; align-items:baseline; font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:0.18em; color:var(--fg-3); text-transform:uppercase; padding-top:10px; border-top:1px solid var(--border); }
  .sub .danger { color: var(--danger); }
  .stamp { font-family: 'Space Grotesk', sans-serif; font-weight:700; font-size:14px; letter-spacing:0.32em; color: var(--fg-2); padding:6px 10px; border:1px solid var(--danger); color:var(--danger); display:inline-block; }
</style></head>
<body class="card">
  <div class="stripe">
    <span class="live">ON AIR</span>
    <span>STREAM 003 · 19:30 PT</span>
    <span class="rule"></span>
    <span>SET 02 / 04</span>
  </div>

  <div class="hero">LOUD’N <span class="accent">LIVE</span></div>

  <div class="sub">
    <span>Anton · 110 · uppercase · +0.005em</span>
    <span class="stamp">DANGER · TECHNO · DANCE</span>
  </div>
</body></html>
