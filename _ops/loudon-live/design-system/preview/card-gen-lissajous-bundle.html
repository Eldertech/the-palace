<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  body.card { gap: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile {
    background: #0a0a0f;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 1.2 / 1;
  }
  .tile canvas { display: block; width: 100%; height: 100%; }
  .cap {
    position: absolute;
    bottom: 6px; left: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    text-shadow: 0 0 6px rgba(0,0,0,0.85);
    pointer-events: none;
  }
</style></head>
<body class="card">
<div class="eyebrow">Generator · Lissajous bundle · same p5 sketch, six oscillator pairs</div>
<div class="grid" id="grid"></div>
<div class="label" style="line-height:1.5">Same renderer · the variety is the detuning between two oscillators. Color tracks the brand palette: amber · phosphor · info · danger · drafting · cobalt.</div>

<script>
const samples = [
  { ratio: [3, 4], hue: '232,184,74',  label: '3 : 4' },
  { ratio: [5, 7], hue: '0,255,102',   label: '5 : 7' },
  { ratio: [2, 3], hue: '74,143,255',  label: '2 : 3' },
  { ratio: [4, 5], hue: '255,42,42',   label: '4 : 5' },
  { ratio: [7, 9], hue: '232,101,27',  label: '7 : 9' },
  { ratio: [3, 8], hue: '168,224,64',  label: '3 : 8' },
];

const grid = document.getElementById('grid');

samples.forEach(spec => {
  const tile = document.createElement('div');
  tile.className = 'tile';
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = spec.label;
  cap.style.color = 'rgb(' + spec.hue + ')';
  tile.appendChild(cap);
  grid.appendChild(tile);

  // each tile gets its own p5 instance
  new p5(function (s) {
    let W = 600, H = 500;
    const [A_BASE, B_BASE] = spec.ratio;
    // detune amount derived from the ratio so each tile has its own character
    const DETUNE = 0.0008 + (spec.ratio[1] - spec.ratio[0]) * 0.00008;
    let t0;

    s.setup = function () {
      const c = s.createCanvas(W, H);
      c.parent(tile);
      s.noFill();
      s.background(10, 10, 15);
      t0 = s.millis() / 1000;
      draw(0);
    };

    function draw(phi) {
      s.noStroke();
      s.fill(10, 10, 15, 42);
      s.rect(0, 0, W, H);

      const cx = W / 2, cy = H / 2;
      const A = W * 0.34;
      const B = H * 0.34;
      const a = A_BASE + DETUNE * phi;
      const b = B_BASE;

      s.strokeCap(s.ROUND);

      const N = 2000;
      // primary
      s.stroke('rgba(' + spec.hue + ',0.92)');
      s.strokeWeight(1.5);
      s.beginShape();
      for (let i = 0; i <= N; i++) {
        const t = (i / N) * s.TWO_PI;
        const x = cx + Math.sin(a * t + phi * 0.4) * A;
        const y = cy + Math.sin(b * t) * B;
        s.vertex(x, y);
      }
      s.endShape();

      // ghost
      s.stroke('rgba(' + spec.hue + ',0.32)');
      s.strokeWeight(0.7);
      s.beginShape();
      for (let i = 0; i <= N; i++) {
        const t = (i / N) * s.TWO_PI;
        const x = cx + Math.sin(a * t + phi * 0.4 + 0.04) * A * 0.97;
        const y = cy + Math.sin(b * t + 0.02) * B * 0.97;
        s.vertex(x, y);
      }
      s.endShape();
    }

    s.draw = function () {
      const t = s.millis() / 1000 - t0;
      draw(t);
    };
  }, document.body);
});
</script>
</body></html>
