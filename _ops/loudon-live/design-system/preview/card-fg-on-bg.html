<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="card.css"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Manrope:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
<style></style></head>
<body class="card">
<div class="eyebrow">Foreground stack · Manrope sans · Cormorant body</div>
<div style="background:var(--bg);border:1.5px solid var(--border);border-radius:2px;padding:18px;line-height:1.6">
  <div style="font-family:'Manrope',sans-serif;font-weight:500;font-size:15px;color:var(--fg-1)">fg-1 — primary, headlines, key terms.</div>
  <div style="font-family:'Manrope',sans-serif;font-weight:300;font-size:14px;color:var(--fg-2);margin-top:4px">fg-2 — body text. Comfortable reading at 14–16 px.</div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-3);margin-top:8px">FG-3 — dim labels, captions, secondary metadata.</div>
  <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:13px;color:var(--fg-4);margin-top:6px">fg-4 — disabled, decorative. Should not carry meaning.</div>
</div>
</body></html>
