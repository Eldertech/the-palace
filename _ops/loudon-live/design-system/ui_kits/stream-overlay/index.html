<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Overlay · Loudon Live</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
function App() {
  const [chatOn, setChatOn] = React.useState(true);
  const [ltShown, setLtShown] = React.useState('now-building');

  const lowerThirds = {
    'now-building': { label: 'Now building', value: 'Shepard tone synth · the infinite staircase' },
    'tool': { label: 'Tool in focus', value: 'Python + NumPy + sounddevice' },
    'chapter': { label: 'Chapter', value: '02 · the leaky integrator' },
    'off': null,
  };

  React.useEffect(() => {
    const fit = () => {
      const el = document.querySelector('.scene');
      if (!el) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  const lt = lowerThirds[ltShown];

  return (
    <React.Fragment>
      <div className="scene-stage">
        <div className="scene" data-screen-label="Stream Overlay">
          <ScreenShareBackground />
          <LiveTag stream="003" elapsed="47:12" />
          <TopicStrap today="all-pass loops &amp; inharmonic resonators" />
          <Watermark />
          {chatOn && <ChatColumn />}
          {lt && <LowerThird label={lt.label} value={lt.value} />}
          <CamFrame />
        </div>
      </div>

      <div className="tweaks">
        <span>VIEW</span>
        {['now-building', 'tool', 'chapter', 'off'].map(k => (
          <button key={k} className={ltShown === k ? 'on' : ''} onClick={() => setLtShown(k)}>
            {k === 'off' ? 'no lower-third' : k.replace('-', ' ')}
          </button>
        ))}
        <span style={{ marginLeft: 14 }}>CHAT</span>
        <button className={chatOn ? 'on' : ''} onClick={() => setChatOn(c => !c)}>{chatOn ? 'on' : 'off'}</button>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
