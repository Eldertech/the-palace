# The palace's public read view — the reader's door (Loudon Live.md: two
# doors, this read view or git). Builds STIGMERGY's STATE deck static from
# main (_ops/stigmergy/app/scripts/build-public.mjs) and publishes it to
# GitHub Pages. The site's address comes from the Pages configuration
# (configure-pages), never from this file, so renaming the account or adding
# a custom domain (Settings → Pages) needs no edit here.
#
# Every push to main rebuilds the view; it can also be run by hand. Pages
# deploys from GitHub Actions (repo Settings → Pages → Source). It went on
# 2026-09-26 with Loudon's yes and a clean Sentry gate (sweep.mjs --gate).
name: Read view

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: read-view
  cancel-in-progress: true

jobs:
  build:
    # arm64: the STIGMERGY lockfile carries rollup's native binaries for arm64
    # Linux (and macOS) but not x64 Linux, so npm ci on x64 builds without one.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _ops/stigmergy/package-lock.json
      - name: ImageMagick (shrinks heroes and icons for the page)
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick
      - name: Install STIGMERGY
        run: npm ci --prefix _ops/stigmergy
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the read view
        run: >
          node _ops/stigmergy/app/scripts/build-public.mjs
          --base "${{ steps.pages.outputs.base_path }}/"
          --site-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _ops/stigmergy/app/dist-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
