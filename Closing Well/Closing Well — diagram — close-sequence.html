<p class="sub">Three lanes: you, the original (working) Claude, and a fresh Closing Well Agent. Amber marks the load-bearing moments no subagent touches. Evidence for <em>Closing Well</em> § Closing Well, Enchanted. Built 2026-07-03.</p>
