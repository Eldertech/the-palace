<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Explorer - Cross-Domain Resonances</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 2px solid #2a2a3e;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1em;
            color: #a0a0b0;
            margin-top: 10px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.9em;
            color: #a0a0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input[type="text"] {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #a0a0b0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .bridges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .bridge-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .bridge-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bridge-card:hover::before {
            opacity: 1;
        }

        .bridge-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .bridge-title {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .bridge-pattern {
            font-size: 0.95em;
            color: #b0b0c0;
            margin-bottom: 12px;
            line-height: 1.5;
            position: relative;
            z-index: 1;
        }

        .bridge-domains {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            position: relative;
            z-index: 1;
        }

        .domain-tag {
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 0.8em;
            color: #c0c0d0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-box {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 0.9em;
            color: #a0a0b0;
            margin-top: 4px;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #808090;
            font-size: 1.1em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            max-width: 800px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 40px;
            position: relative;
            margin: auto;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #a0a0b0;
            font-size: 2em;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: white;
        }

        .modal-title {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 20px;
            padding-right: 40px;
        }

        .modal-pattern {
            font-size: 1.2em;
            color: #b0b0c0;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .modal-section {
            margin-bottom: 24px;
        }

        .modal-section h3 {
            font-size: 1.1em;
            color: #667eea;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-section p {
            line-height: 1.7;
            color: #c0c0d0;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .bridges-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .modal-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bridge Explorer</h1>
            <div class="subtitle">Cross-Domain Resonances in the 4 Pillars Framework</div>
        </header>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="totalBridges">10</div>
                <div class="stat-label">Total Bridges</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="visibleBridges">10</div>
                <div class="stat-label">Showing</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="patternFamilies">10</div>
                <div class="stat-label">Pattern Families</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="searchInput">Search Bridges</label>
                <input type="text" id="searchInput" placeholder="Search by title, pattern, or domain...">
            </div>
            <div class="control-group">
                <label>Filter by Domain</label>
                <div class="filter-buttons" id="domainFilters"></div>
            </div>
        </div>

        <div class="bridges-grid" id="bridgesGrid"></div>
    </div>

    <div class="modal" id="bridgeModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="modal-pattern" id="modalPattern"></div>
            <div class="modal-section">
                <h3>Domains</h3>
                <div id="modalDomains"></div>
            </div>
            <div class="modal-section">
                <h3>Description</h3>
                <p id="modalDescription"></p>
            </div>
            <div class="modal-section">
                <h3>Teaching Applications</h3>
                <p id="modalTeaching"></p>
            </div>
        </div>
    </div>

    <script>
        const bridges = [
            {
                title: "Sidechain ↔ Conversation",
                pattern: "Yielding Space",
                description: "Compression ducks when kick hits, creating rhythmic space. Conversation yields when someone speaks, creating communicative space. Both about making room by temporarily receding.",
                domains: ["audio", "communication", "rhythm"],
                teaching: "Start with sidechain compression demo (kick ducking bass), then discuss how good conversation requires listening (yielding space). The structural identity: both are about one element receding to let another through."
            },
            {
                title: "Dovetail Joint ↔ Counterpoint",
                pattern: "Mutual Support",
                description: "Dovetail joint achieves strength through interlocking shapes that support each other. Counterpoint achieves harmony through melodic lines that support each other. Neither can stand alone.",
                domains: ["woodworking", "music", "structure"],
                teaching: "Show dovetail joint (physical or photo), then play Bach two-part invention. Notice how each voice needs the other, how they interlock rhythmically and harmonically. The pattern: interdependent strength."
            },
            {
                title: "Cooking ↔ Mixing",
                pattern: "Irreversible Processes",
                description: "Once you combine ingredients, you cannot separate them. Once you commit to a mix decision, reversing requires rebuilding. Both teach commitment and intentionality.",
                domains: ["cooking", "audio", "process"],
                teaching: "Discuss cooking a stew (cannot uncombine) and printing stems to audio (committing the mix). The lesson: some processes are one-way. This creates both risk and freedom."
            },
            {
                title: "Kick Drum ↔ Foundation",
                pattern: "Foundation First",
                description: "Kick drum placement determines everything that follows in a mix. Foundation of a building determines everything built above. Early structural choices cascade through entire system.",
                domains: ["audio", "architecture", "systems"],
                teaching: "Start mix with kick placement vs starting with vocals. Show how kick position affects bass, affects percussion, affects whole mix. Connect to architecture, life planning, systems design."
            },
            {
                title: "Reverb ↔ Space-Time",
                pattern: "Space-Time Unity",
                description: "Reverb creates sense of space through time delays. Einstein proved space and time are unified. Both reveal that space IS time from different perspective.",
                domains: ["audio", "physics", "perception"],
                teaching: "Play dry vs wet reverb. Explain how reverb is literally delays (time) creating illusion of space. Connect to relativity, Haas effect. The insight: space and time are interchangeable."
            },
            {
                title: "Frequency Domain ↔ Perspective Shift",
                pattern: "Transform Reveals Truth",
                description: "FFT transforms time domain to frequency domain—same data, different view, different information visible. Reframing problems reveals solutions invisible from original perspective.",
                domains: ["audio", "problem-solving", "mathematics"],
                teaching: "Show waveform (time) vs spectrum analyzer (frequency) on same audio. Point out what each reveals. Connect to problem reframing, coordinate system choice, McGilchrist's hemispheres."
            },
            {
                title: "Quantization ↔ Precision vs Flow",
                pattern: "Perfect vs Alive",
                description: "Quantization snaps notes to grid—gains precision, loses human feel. Over-planning snaps to perfect schedule—gains efficiency, loses spontaneity. Both trade life for exactness.",
                domains: ["audio", "time", "practice"],
                teaching: "Quantize a drum beat 100%, then play original. Discuss when precision matters vs when groove matters. Connect to life: rigidly scheduled vs responsive to moment."
            },
            {
                title: "Saturation ↔ Richness",
                pattern: "Limits Create Character",
                description: "Saturation adds harmonics when signal pushes limits—sounds richer, more alive. Living at your edges creates character—feels richer, more authentic. Limits aren't obstacles, they're sources.",
                domains: ["audio", "philosophy", "growth"],
                teaching: "Add gentle saturation to bland sound, hear it come alive. Discuss how working at your limits (not beyond, not below) creates growth. The sweet spot: edge of capability."
            },
            {
                title: "Compression ↔ Intimacy",
                pattern: "Reduce Distance",
                description: "Compression reduces dynamic range, makes everything feel closer, more intimate. Intimacy reduces distance between inner and outer self, makes connection feel closer, more vulnerable.",
                domains: ["audio", "relationships", "communication"],
                teaching: "Compare uncompressed vs compressed vocal—notice how compression feels intimate (in your ear). Connect to vulnerability: reducing dynamic range of self-expression creates closeness."
            },
            {
                title: "Synthesis ↔ Emergence",
                pattern: "Simple → Complex",
                description: "Two sine waves (simplest sound) plus modulation creates infinite timbral complexity. Simple rules plus interaction creates emergent behavior—flocking, markets, consciousness.",
                domains: ["synthesis", "systems", "complexity"],
                teaching: "Demonstrate FM synthesis: two sine waves → bell sounds. Explain emergent complexity: simple parts, complex interaction, unpredictable results. Connect to systems thinking, non-linearity."
            }
        ];

        let allDomains = new Set();
        bridges.forEach(bridge => {
            bridge.domains.forEach(domain => allDomains.add(domain));
        });

        let activeDomains = new Set();

        function initDomainFilters() {
            const container = document.getElementById('domainFilters');
            const sortedDomains = Array.from(allDomains).sort();
            
            sortedDomains.forEach(domain => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = domain;
                btn.onclick = () => toggleDomain(domain, btn);
                container.appendChild(btn);
            });
        }

        function toggleDomain(domain, btn) {
            if (activeDomains.has(domain)) {
                activeDomains.delete(domain);
                btn.classList.remove('active');
            } else {
                activeDomains.add(domain);
                btn.classList.add('active');
            }
            renderBridges();
        }

        function renderBridges() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('bridgesGrid');
            
            let filtered = bridges.filter(bridge => {
                // Search filter
                const matchesSearch = !searchTerm || 
                    bridge.title.toLowerCase().includes(searchTerm) ||
                    bridge.pattern.toLowerCase().includes(searchTerm) ||
                    bridge.description.toLowerCase().includes(searchTerm) ||
                    bridge.domains.some(d => d.toLowerCase().includes(searchTerm));
                
                // Domain filter
                const matchesDomain = activeDomains.size === 0 || 
                    bridge.domains.some(d => activeDomains.has(d));
                
                return matchesSearch && matchesDomain;
            });

            grid.innerHTML = '';
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">No bridges match your filters. Try adjusting your search or domain filters.</div>';
                document.getElementById('visibleBridges').textContent = '0';
                return;
            }

            filtered.forEach(bridge => {
                const card = document.createElement('div');
                card.className = 'bridge-card';
                card.onclick = () => showBridgeDetails(bridge);
                
                const domainsHTML = bridge.domains.map(d => 
                    `<span class="domain-tag">${d}</span>`
                ).join('');
                
                card.innerHTML = `
                    <div class="bridge-title">${bridge.title}</div>
                    <div class="bridge-pattern"><strong>Pattern:</strong> ${bridge.pattern}</div>
                    <div class="bridge-domains">${domainsHTML}</div>
                `;
                
                grid.appendChild(card);
            });

            document.getElementById('visibleBridges').textContent = filtered.length;
        }

        function showBridgeDetails(bridge) {
            document.getElementById('modalTitle').textContent = bridge.title;
            document.getElementById('modalPattern').textContent = `Pattern: ${bridge.pattern}`;
            document.getElementById('modalDomains').innerHTML = 
                bridge.domains.map(d => `<span class="domain-tag">${d}</span>`).join(' ');
            document.getElementById('modalDescription').textContent = bridge.description;
            document.getElementById('modalTeaching').textContent = bridge.teaching;
            
            document.getElementById('bridgeModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('bridgeModal').classList.remove('active');
        }

        // Initialize
        initDomainFilters();
        renderBridges();

        // Search input listener
        document.getElementById('searchInput').addEventListener('input', renderBridges);

        // Close modal on background click
        document.getElementById('bridgeModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Escape key closes modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Update pattern families count
        const uniquePatterns = new Set(bridges.map(b => b.pattern));
        document.getElementById('patternFamilies').textContent = uniquePatterns.size;
    </script>
</body>
</html>
