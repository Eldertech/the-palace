<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Manifesto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2em;
            color: #999;
            font-weight: 300;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid #444;
            background: #2d2d2d;
            color: #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .filter-btn:hover {
            background: #3d3d3d;
            border-color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .action-btn {
            padding: 12px 24px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
        }

        .card.hidden {
            display: none;
        }

        .card-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border-radius: 12px;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .card-text {
            font-size: 1.3em;
            line-height: 1.6;
            margin-bottom: 12px;
            font-weight: 300;
        }

        .card-expansion {
            font-size: 0.9em;
            color: #999;
            line-height: 1.5;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #3d3d3d;
        }

        .daily-random {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
        }

        .daily-random h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: white;
        }

        .daily-random .card-text {
            font-size: 2em;
            color: white;
            margin-bottom: 16px;
        }

        .daily-random .card-expansion {
            color: rgba(255, 255, 255, 0.8);
            border-top-color: rgba(255, 255, 255, 0.2);
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .daily-random .card-text {
                font-size: 1.5em;
            }
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Quality Manifesto</h1>
            <p class="subtitle">Quality is furtherance of our goals, not theirs.</p>
        </header>

        <div class="daily-random" id="dailyRandom">
            <h2>Today's Focus</h2>
            <div class="card-category" id="randomCategory"></div>
            <div class="card-text" id="randomText"></div>
            <div class="card-expansion" id="randomExpansion"></div>
        </div>

        <div class="action-btns">
            <button class="action-btn" onclick="getNewRandom()">New Random</button>
            <button class="action-btn" onclick="exportCurrent()">Export Current</button>
        </div>

        <div class="controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="definition">Definition</button>
            <button class="filter-btn" data-filter="practice">Practice</button>
            <button class="filter-btn" data-filter="integrity">Integrity</button>
            <button class="filter-btn" data-filter="collaboration">Collaboration</button>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>

        <footer class="footer">
            <p>Quality Manifesto • 4 Pillars Framework</p>
            <p>Wellbeing over metrics. Integrity over optimization. Depth over reach.</p>
        </footer>
    </div>

    <script>
        const manifesto = [
            {
                id: 1,
                category: "definition",
                text: "Quality is furtherance of our goals, not theirs.",
                expansion: "Their quality serves metrics. Our quality serves wellbeing, integrity, depth."
            },
            {
                id: 2,
                category: "practice",
                text: "Life and work are one practice.",
                expansion: "No separation between content and living. Cooking is the work. Walking Haha is the work."
            },
            {
                id: 3,
                category: "integrity",
                text: "Small rooms full of the right people.",
                expansion: "100 engaged > 10,000 passive. Quality of relationship over quantity of attention."
            },
            {
                id: 4,
                category: "practice",
                text: "Integrity over optimization.",
                expansion: "Living your values > tweaking parameters in someone else's system."
            },
            {
                id: 5,
                category: "definition",
                text: "Wellbeing over metrics.",
                expansion: "Success measured by how you feel, not what they count."
            },
            {
                id: 6,
                category: "practice",
                text: "Quality begets quality—when we define quality ourselves.",
                expansion: "The loop only works if quality = our goals. If we adopt their definition, the loop degrades."
            },
            {
                id: 7,
                category: "practice",
                text: "The furniture maker and the synthesist speak the same language.",
                expansion: "Cross-domain mastery. Woodworking ↔ synthesis. Cooking ↔ mixing. Same principles, different materials."
            },
            {
                id: 8,
                category: "collaboration",
                text: "Depth attracts depth.",
                expansion: "Go deep, not broad. Sophisticated people recognize serious work."
            },
            {
                id: 9,
                category: "integrity",
                text: "Rushing destroys what we're building.",
                expansion: "Peaceful, never rushing. The goal is a relaxed life making art."
            },
            {
                id: 10,
                category: "practice",
                text: "The screen is not the world.",
                expansion: "Physical making essential. Saturday no-screen rule. Woodworking, renovation, microcontrollers."
            },
            {
                id: 11,
                category: "definition",
                text: "One student transformed outweighs ten thousand who watched.",
                expansion: "Real impact > vanity metrics. Depth > reach."
            },
            {
                id: 12,
                category: "definition",
                text: "Emily happy at dinner is the metric.",
                expansion: "The people you love, present and peaceful. That's success."
            },
            {
                id: 13,
                category: "practice",
                text: "Building furniture on Saturday is the work.",
                expansion: "Physical making isn't 'taking time away from content.' It IS the work."
            },
            {
                id: 14,
                category: "practice",
                text: "Learning deeply is never wasted time.",
                expansion: "Month-long philosophy arcs > 52 shallow topics. Mastery > exposure."
            },
            {
                id: 15,
                category: "collaboration",
                text: "You witness my becoming, not my arrival.",
                expansion: "Process > product. Practice, not performance."
            },
            {
                id: 16,
                category: "collaboration",
                text: "We explore together—I have no answers, only questions worth asking.",
                expansion: "Collaborative approach. 'Let's explore' not 'I'll teach.'"
            },
            {
                id: 17,
                category: "collaboration",
                text: "Collaboration over competition.",
                expansion: "Lifting others lifts us all. No zero-sum thinking."
            },
            {
                id: 18,
                category: "definition",
                text: "The right hundred over the wrong thousand.",
                expansion: "Quality of community > size of audience."
            },
            {
                id: 19,
                category: "practice",
                text: "Peace is the ultimate luxury.",
                expansion: "Financial comfort buys choice. Choose peace over growth."
            },
            {
                id: 20,
                category: "practice",
                text: "Practice → Commitment → Integrity → Wellbeing → Better practice.",
                expansion: "The self-reinforcing loop at paradigm level. Quality begets quality."
            },
            {
                id: 21,
                category: "definition",
                text: "In the end, it may look like theirs—but the path and the cost are different.",
                expansion: "We arrive peaceful, not depleted. Surrounded by people we love, not followers we've never met."
            }
        ];

        let currentRandom = null;

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = manifesto.map(item => `
                <div class="card" data-category="${item.category}" onclick="selectCard(${item.id})">
                    <div class="card-category">${item.category}</div>
                    <div class="card-text">${item.text}</div>
                    <div class="card-expansion">${item.expansion}</div>
                </div>
            `).join('');
        }

        function filterCards(category) {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function getNewRandom() {
            const randomIndex = Math.floor(Math.random() * manifesto.length);
            currentRandom = manifesto[randomIndex];
            displayRandom(currentRandom);
        }

        function displayRandom(item) {
            document.getElementById('randomCategory').textContent = item.category;
            document.getElementById('randomText').textContent = item.text;
            document.getElementById('randomExpansion').textContent = item.expansion;
        }

        function selectCard(id) {
            currentRandom = manifesto.find(item => item.id === id);
            displayRandom(currentRandom);
            document.getElementById('dailyRandom').scrollIntoView({ behavior: 'smooth' });
        }

        function exportCurrent() {
            if (!currentRandom) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Text
            ctx.fillStyle = 'white';
            ctx.font = '300 48px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            
            // Wrap text
            const maxWidth = 1000;
            const words = currentRandom.text.split(' ');
            let line = '';
            let y = 300;
            const lineHeight = 70;

            words.forEach(word => {
                const testLine = line + word + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth) {
                    ctx.fillText(line, canvas.width / 2, y);
                    line = word + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            });
            ctx.fillText(line, canvas.width / 2, y);

            // Category
            ctx.font = '300 24px -apple-system, sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillText(currentRandom.category.toUpperCase(), canvas.width / 2, y + 60);

            // Footer
            ctx.fillText('Quality Manifesto • 4 Pillars Framework', canvas.width / 2, canvas.height - 40);

            // Download
            const link = document.createElement('a');
            link.download = 'quality-manifesto.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Filter button handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterCards(btn.dataset.filter);
            });
        });

        // Initialize
        renderCards();
        getNewRandom();
    </script>
</body>
</html>
