<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leverage Points Decision Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1em;
            color: #999;
            font-weight: 300;
        }

        .input-section {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #ccc;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            background: #1e1e1e;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
        }

        textarea:focus {
            outline: none;
            border-color: #f5576c;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .analysis-card {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .level-indicator {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .level-low {
            background: rgba(245, 87, 108, 0.2);
            color: #f5576c;
        }

        .level-medium {
            background: rgba(240, 147, 251, 0.2);
            color: #f093fb;
        }

        .level-high {
            background: rgba(67, 233, 123, 0.2);
            color: #43e97b;
        }

        .section-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #f5576c;
        }

        .suggestion {
            background: #1e1e1e;
            border-left: 3px solid #43e97b;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .leverage-scale {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .leverage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #2d2d2d;
            border-radius: 6px;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }

        .leverage-item.current {
            border-left-color: #f5576c;
            background: rgba(245, 87, 108, 0.1);
        }

        .leverage-item.suggestion {
            border-left-color: #43e97b;
            background: rgba(67, 233, 123, 0.1);
        }

        .leverage-number {
            font-weight: 600;
            color: #f093fb;
            width: 40px;
        }

        .leverage-name {
            flex: 1;
            padding: 0 15px;
        }

        .leverage-power {
            font-size: 0.85em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .examples {
            margin-top: 20px;
        }

        .example {
            background: #1e1e1e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #f093fb;
        }

        .example-title {
            font-weight: 600;
            color: #f093fb;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .leverage-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .leverage-power {
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Leverage Points Decision Tool</h1>
            <p class="subtitle">Where are you intervening in the system?</p>
        </header>

        <div class="input-section">
            <label for="decisionInput">Describe your decision or problem:</label>
            <textarea id="decisionInput" placeholder="e.g., Should I post on Instagram daily or 3x weekly?&#10;&#10;e.g., How do I grow my audience faster?&#10;&#10;e.g., Should I collaborate with this brand?"></textarea>
            <button onclick="analyze()">Analyze Leverage Points</button>
        </div>

        <div class="results" id="results">
            <div class="analysis-card">
                <span class="level-indicator" id="currentLevel"></span>
                <h2 class="section-title">Current Analysis</h2>
                <div id="currentAnalysis"></div>
            </div>

            <div class="analysis-card">
                <h2 class="section-title">Higher-Leverage Alternatives</h2>
                <div id="suggestions"></div>
            </div>

            <div class="analysis-card">
                <h2 class="section-title">Leverage Points Reference</h2>
                <div class="leverage-scale" id="leverageScale"></div>
            </div>

            <div class="analysis-card">
                <h2 class="section-title">Similar Examples</h2>
                <div class="examples" id="examples"></div>
            </div>
        </div>
    </div>

    <script>
        const leveragePoints = [
            { number: 12, name: "Parameters", power: "lowest", keywords: ["posting frequency", "schedule", "price", "time", "number", "how often", "how many"] },
            { number: 11, name: "Buffers", power: "low", keywords: ["backlog", "reserve", "buffer", "storage", "inventory"] },
            { number: 10, name: "Stock-Flow Structures", power: "low-medium", keywords: ["workflow", "pipeline", "infrastructure", "layout", "structure"] },
            { number: 9, name: "Delays", power: "medium", keywords: ["timing", "when", "response time", "feedback delay"] },
            { number: 8, name: "Negative Feedback", power: "medium-high", keywords: ["control", "regulation", "limit", "brake", "circuit breaker"] },
            { number: 7, name: "Positive Feedback", power: "medium-high", keywords: ["growth", "reinforcing", "spiral", "compound", "amplify"] },
            { number: 6, name: "Information Flows", power: "high", keywords: ["data", "metrics", "visibility", "transparency", "information", "who knows what"] },
            { number: 5, name: "Rules", power: "high", keywords: ["policy", "rule", "constraint", "requirement", "must", "cannot", "allowed"] },
            { number: 4, name: "Self-Organization", power: "very high", keywords: ["adapt", "evolve", "learn", "emerge", "self-organize"] },
            { number: 3, name: "Goals", power: "very high", keywords: ["purpose", "objective", "goal", "why", "optimize for", "success"] },
            { number: 2, name: "Paradigm", power: "highest", keywords: ["worldview", "belief", "assume", "think", "paradigm", "definition of"] },
            { number: 1, name: "Transcending Paradigms", power: "highest", keywords: ["meta", "questioning paradigms", "multiple perspectives", "flexibility"] }
        ];

        const examples = [
            {
                question: "Should I post on Instagram daily or 3x weekly?",
                current: { level: 12, analysis: "This is a parameters question. You're tweaking the posting frequency number." },
                suggestions: [
                    { level: 5, text: "Set a RULE: 'Only post when I have something meaningful to share.' This protects wellbeing without parameter optimization." },
                    { level: 2, text: "Question the PARADIGM: Why do you think consistent posting matters? Whose definition of quality are you serving?" }
                ]
            },
            {
                question: "How do I grow my audience faster?",
                current: { level: 12, analysis: "Likely thinking about parameters: thumbnails, posting times, video length." },
                suggestions: [
                    { level: 3, text: "Change the GOAL: Instead of 'How do I grow faster?' ask 'How do I attract the RIGHT people?'" },
                    { level: 2, text: "PARADIGM shift: Success = wellbeing + right people, NOT growth rate. This changes every downstream decision." }
                ]
            },
            {
                question: "Should I collaborate with this brand?",
                current: { level: 3, analysis: "This touches on goals - does this serve your actual objectives?" },
                suggestions: [
                    { level: 6, text: "INFORMATION FLOWS: Will they inject their metrics into your decision-making?" },
                    { level: 5, text: "RULES: Your constitution says 'Collaborations with people I'd want as friends.' Does this brand meet that test?" },
                    { level: 2, text: "PARADIGM: This comes from old paradigm where visibility = success. In your paradigm, integrity > visibility." }
                ]
            }
        ];

        function identifyLevel(input) {
            input = input.toLowerCase();
            let scores = leveragePoints.map(lp => ({
                ...lp,
                score: lp.keywords.filter(kw => input.includes(kw)).length
            }));
            
            // Default to parameters if no clear match
            let maxScore = Math.max(...scores.map(s => s.score));
            if (maxScore === 0) return leveragePoints[0];
            
            return scores.find(s => s.score === maxScore);
        }

        function analyze() {
            const input = document.getElementById('decisionInput').value.trim();
            if (!input) {
                alert('Please describe your decision or problem.');
                return;
            }

            const currentLevel = identifyLevel(input);
            renderResults(currentLevel, input);
        }

        function renderResults(current, input) {
            // Show results
            document.getElementById('results').classList.add('active');
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

            // Current level indicator
            const levelIndicator = document.getElementById('currentLevel');
            levelIndicator.textContent = `Level #${current.number}: ${current.name}`;
            levelIndicator.className = 'level-indicator';
            if (current.power.includes('low')) levelIndicator.classList.add('level-low');
            else if (current.power.includes('high')) levelIndicator.classList.add('level-high');
            else levelIndicator.classList.add('level-medium');

            // Current analysis
            document.getElementById('currentAnalysis').innerHTML = `
                <p style="font-size: 1.1em; line-height: 1.6; color: #ccc;">
                    You're operating at <strong>level #${current.number}</strong> (${current.name}), which has <strong>${current.power}</strong> leverage.
                    ${current.number >= 8 ? 
                        "This is actually a good place to intervene! You're thinking systemically." : 
                        "Consider whether you can intervene at a higher leverage point."}
                </p>
            `;

            // Suggestions
            const higherLevels = leveragePoints.filter(lp => lp.number < current.number && lp.number <= 5);
            const suggestions = document.getElementById('suggestions');
            
            if (higherLevels.length > 0) {
                suggestions.innerHTML = higherLevels.slice(0, 3).map(lp => `
                    <div class="suggestion">
                        <strong style="color: #43e97b;">Level #${lp.number}: ${lp.name}</strong>
                        <p style="margin-top: 8px; line-height: 1.5; color: #ccc;">
                            Instead of tweaking ${current.name.toLowerCase()}, consider working at this level.
                            ${getSuggestionText(lp.number, input)}
                        </p>
                    </div>
                `).join('');
            } else {
                suggestions.innerHTML = `
                    <p style="color: #43e97b; font-size: 1.1em;">
                        You're already working at a high-leverage level! Keep operating at this paradigm.
                    </p>
                `;
            }

            // Leverage scale
            renderLeverageScale(current.number);

            // Examples
            renderExamples(input);
        }

        function getSuggestionText(level, input) {
            const suggestions = {
                5: "What RULE could you set that makes this decision automatic? Rules protect your paradigm without requiring constant willpower.",
                6: "Who gets what information when? Changing information flows can fundamentally alter how the system behaves.",
                3: "What is this system actually trying to optimize for? If you change the goal, everything downstream changes.",
                2: "What paradigm is this question coming from? Their paradigm (metrics = success) or yours (wellbeing = success)?"
            };
            return suggestions[level] || "This level offers higher leverage for systemic change.";
        }

        function renderLeverageScale(currentLevel) {
            const scale = document.getElementById('leverageScale');
            scale.innerHTML = leveragePoints.map(lp => {
                const isCurrent = lp.number === currentLevel;
                const isSuggestion = lp.number < currentLevel && lp.number >= 2 && lp.number <= 5;
                const classes = `leverage-item ${isCurrent ? 'current' : ''} ${isSuggestion ? 'suggestion' : ''}`;
                
                return `
                    <div class="${classes}">
                        <span class="leverage-number">#${lp.number}</span>
                        <span class="leverage-name">${lp.name}</span>
                        <span class="leverage-power">${lp.power}</span>
                    </div>
                `;
            }).join('');
        }

        function renderExamples(input) {
            const examplesDiv = document.getElementById('examples');
            
            // Find most relevant example
            const relevantExample = examples[0]; // Could make this smarter
            
            examplesDiv.innerHTML = examples.map(ex => `
                <div class="example">
                    <div class="example-title">${ex.question}</div>
                    <p style="color: #ccc; margin: 8px 0;"><strong>Current level:</strong> #${ex.current.level} - ${ex.current.analysis}</p>
                    ${ex.suggestions.map(s => `
                        <p style="color: #43e97b; margin: 8px 0; padding-left: 15px; border-left: 2px solid #43e97b;">
                            Level #${s.level}: ${s.text}
                        </p>
                    `).join('')}
                </div>
            `).join('');
        }

        // Initialize with placeholder analysis
        document.getElementById('decisionInput').value = examples[0].question;
    </script>
</body>
</html>
