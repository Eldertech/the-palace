<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Domain Resonances Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: #1e1e2e;
            border-right: 1px solid #3d3d3d;
            overflow-y: auto;
            padding: 24px;
        }

        .main-canvas {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 1.8em;
            font-weight: 300;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 24px;
        }

        .filter-section {
            margin-bottom: 24px;
        }

        .filter-title {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-btn {
            display: block;
            width: 100%;
            padding: 10px 16px;
            margin-bottom: 8px;
            border: 1px solid #3d3d3d;
            background: #2d2d2d;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 0.9em;
        }

        .filter-btn:hover {
            background: #3d3d3d;
            border-color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
        }

        .legend {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #3d3d3d;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .legend-label {
            font-size: 0.85em;
            color: #999;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .detail-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(30, 30, 46, 0.95);
            border: 1px solid #667eea;
            border-radius: 12px;
            padding: 24px;
            display: none;
            backdrop-filter: blur(10px);
            max-height: 80vh;
            overflow-y: auto;
        }

        .detail-panel.active {
            display: block;
        }

        .detail-close {
            float: right;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .detail-close:hover {
            color: #e0e0e0;
        }

        .detail-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 8px;
            clear: both;
        }

        .detail-type {
            font-size: 0.75em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .detail-description {
            font-size: 0.9em;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 16px;
        }

        .detail-connections {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #3d3d3d;
        }

        .detail-connection-title {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .connection-item {
            font-size: 0.85em;
            color: #667eea;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .connection-item:hover {
            text-decoration: underline;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            padding: 12px 20px;
            border: 1px solid #667eea;
            background: rgba(30, 30, 46, 0.9);
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Resonances</h1>
            <p class="subtitle">Pattern Network</p>

            <div class="filter-section">
                <div class="filter-title">View Mode</div>
                <button class="filter-btn active" data-mode="all">All Connections</button>
                <button class="filter-btn" data-mode="resonances">Resonances Only</button>
                <button class="filter-btn" data-mode="themes">Themes Only</button>
                <button class="filter-btn" data-mode="patterns">Pattern Families</button>
            </div>

            <div class="filter-section">
                <div class="filter-title">Focus Area</div>
                <button class="filter-btn" data-focus="yielding">Yielding Space</button>
                <button class="filter-btn" data-focus="support">Mutual Support</button>
                <button class="filter-btn" data-focus="subtraction">Subtraction Reveals</button>
                <button class="filter-btn" data-focus="foundation">Foundation First</button>
                <button class="filter-btn" data-focus="spacetime">Space-Time</button>
            </div>

            <div class="legend">
                <div class="filter-title">Legend</div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #667eea;"></div>
                    <div class="legend-label">Resonance (Bridge)</div>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #ff6464;"></div>
                    <div class="legend-label">Weekly Theme</div>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #4a4;"></div>
                    <div class="legend-label">Pattern Family</div>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #fa4;"></div>
                    <div class="legend-label">Domain</div>
                </div>
            </div>
        </div>

        <div class="main-canvas">
            <canvas id="network"></canvas>
            
            <div class="detail-panel" id="detailPanel">
                <span class="detail-close" onclick="closeDetail()">&times;</span>
                <div class="detail-title" id="detailTitle"></div>
                <div class="detail-type" id="detailType"></div>
                <div class="detail-description" id="detailDescription"></div>
                <div class="detail-connections">
                    <div class="detail-connection-title">Connected To:</div>
                    <div id="detailConnections"></div>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" onclick="resetView()">Reset View</button>
                <button class="control-btn" onclick="togglePhysics()">Toggle Physics</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('network');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let nodes = [];
        let edges = [];
        let selectedNode = null;
        let isDragging = false;
        let dragNode = null;
        let offsetX = 0, offsetY = 0;
        let panX = 0, panY = 0;
        let zoom = 1;
        let physicsEnabled = true;
        let currentMode = 'all';
        let currentFocus = null;

        function resizeCanvas() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }

        // Data structure
        const data = {
            resonances: [
                {
                    id: 'sidechain-conversation',
                    name: 'Sidechain ↔ Conversation',
                    type: 'resonance',
                    pattern: 'yielding',
                    description: 'Making space by yielding. Both operate on principle of: one occupies space while other ducks.',
                    connections: ['kick-drum-paradox', 'four-on-floor', 'suzuki']
                },
                {
                    id: 'dovetail-counterpoint',
                    name: 'Dovetail ↔ Counterpoint',
                    type: 'resonance',
                    pattern: 'support',
                    description: 'Mutual support without external reinforcement. Both create strength through complementary design.',
                    connections: ['four-on-floor']
                },
                {
                    id: 'cooking-mixing',
                    name: 'Cooking ↔ Mixing',
                    type: 'resonance',
                    pattern: 'subtraction',
                    description: 'Irreversible processes that develop subtraction-first thinking. Can always add, rarely remove.',
                    connections: ['high-pass-low-pass', 'lao-tzu']
                },
                {
                    id: 'kick-foundation',
                    name: 'Kick ↔ Foundation',
                    type: 'resonance',
                    pattern: 'foundation',
                    description: 'Early structural choices constrain everything after. Foundation defines what is possible.',
                    connections: ['kick-drum-paradox', 'first-sound', 'marcus-aurelius']
                },
                {
                    id: 'reverb-spacetime',
                    name: 'Reverb ↔ Space-Time',
                    type: 'resonance',
                    pattern: 'spacetime',
                    description: 'Space creates time smear, time creates spatial perception. Not separate—unified phenomenon.',
                    connections: ['heidegger']
                }
            ],
            themes: [
                {
                    id: 'kick-drum-paradox',
                    name: 'The Kick Drum Paradox',
                    type: 'theme',
                    description: 'Small decisions, infinite implications. Meadows leverage points in production.',
                    connections: ['sidechain-conversation', 'kick-foundation', 'meadows']
                },
                {
                    id: 'four-on-floor',
                    name: 'Four on the Floor',
                    type: 'theme',
                    description: 'Repetition as meditation. Suzuki beginner mind applied to rhythm.',
                    connections: ['sidechain-conversation', 'dovetail-counterpoint', 'suzuki']
                },
                {
                    id: 'first-sound',
                    name: 'The First Sound',
                    type: 'theme',
                    description: 'Beginnings shape everything. Marcus Aurelius on intentional starting.',
                    connections: ['kick-foundation', 'marcus-aurelius']
                },
                {
                    id: 'high-pass-low-pass',
                    name: 'High Pass Low Pass',
                    type: 'theme',
                    description: 'What you remove defines what remains. Lao Tzu wu wei in mixing.',
                    connections: ['cooking-mixing', 'lao-tzu']
                }
            ],
            patterns: [
                {
                    id: 'yielding',
                    name: 'Yielding Space',
                    type: 'pattern',
                    description: 'Two things cannot occupy same space. One must yield. Appears in: sidechain, conversation, negative space, rests.',
                    connections: ['sidechain-conversation']
                },
                {
                    id: 'support',
                    name: 'Mutual Support',
                    type: 'pattern',
                    description: 'Strength through complementary relationship. Appears in: dovetails, counterpoint, ecosystems, arches.',
                    connections: ['dovetail-counterpoint']
                },
                {
                    id: 'subtraction',
                    name: 'Subtraction Reveals',
                    type: 'pattern',
                    description: 'What you remove defines what remains. Appears in: filtering, sculpture, editing, wu wei.',
                    connections: ['cooking-mixing']
                },
                {
                    id: 'foundation',
                    name: 'Foundation First',
                    type: 'pattern',
                    description: 'Early structural choices constrain later options. Appears in: architecture, mixing, code, writing.',
                    connections: ['kick-foundation']
                },
                {
                    id: 'spacetime',
                    name: 'Space-Time Unity',
                    type: 'pattern',
                    description: 'Space and time are interchangeable. Appears in: reverb, relativity, Haas effect.',
                    connections: ['reverb-spacetime']
                }
            ],
            sources: [
                { id: 'meadows', name: 'Donella Meadows', type: 'source' },
                { id: 'suzuki', name: 'Shunryu Suzuki', type: 'source' },
                { id: 'marcus-aurelius', name: 'Marcus Aurelius', type: 'source' },
                { id: 'lao-tzu', name: 'Lao Tzu', type: 'source' },
                { id: 'heidegger', name: 'Martin Heidegger', type: 'source' }
            ]
        };

        function initializeNetwork() {
            const allItems = [
                ...data.resonances,
                ...data.themes,
                ...data.patterns,
                ...data.sources
            ];

            // Create nodes
            nodes = allItems.map((item, i) => ({
                id: item.id,
                name: item.name,
                type: item.type,
                pattern: item.pattern,
                description: item.description || '',
                connections: item.connections || [],
                x: width / 2 + Math.random() * 400 - 200,
                y: height / 2 + Math.random() * 400 - 200,
                vx: 0,
                vy: 0,
                radius: item.type === 'resonance' ? 12 : item.type === 'theme' ? 10 : item.type === 'pattern' ? 14 : 8
            }));

            // Create edges
            edges = [];
            nodes.forEach(node => {
                node.connections.forEach(connId => {
                    const target = nodes.find(n => n.id === connId);
                    if (target) {
                        edges.push({ source: node, target });
                    }
                });
            });
        }

        function getNodeColor(node) {
            if (node.type === 'resonance') return '#667eea';
            if (node.type === 'theme') return '#ff6464';
            if (node.type === 'pattern') return '#4a4';
            if (node.type === 'source') return '#fa4';
            return '#999';
        }

        function applyForces() {
            if (!physicsEnabled) return;

            const centerX = width / 2;
            const centerY = height / 2;
            const repulsion = 5000;
            const attraction = 0.01;

            // Repulsion between all nodes
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[j].x - nodes[i].x;
                    const dy = nodes[j].y - nodes[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const force = repulsion / (dist * dist);
                    const fx = (dx / dist) * force;
                    const fy = (dy / dist) * force;
                    nodes[i].vx -= fx;
                    nodes[i].vy -= fy;
                    nodes[j].vx += fx;
                    nodes[j].vy += fy;
                }
            }

            // Attraction along edges
            edges.forEach(edge => {
                const dx = edge.target.x - edge.source.x;
                const dy = edge.target.y - edge.source.y;
                const fx = dx * attraction;
                const fy = dy * attraction;
                edge.source.vx += fx;
                edge.source.vy += fy;
                edge.target.vx -= fx;
                edge.target.vy -= fy;
            });

            // Gentle center pull
            nodes.forEach(node => {
                const dx = centerX - node.x;
                const dy = centerY - node.y;
                node.vx += dx * 0.0001;
                node.vy += dy * 0.0001;
            });

            // Update positions
            nodes.forEach(node => {
                if (node !== dragNode) {
                    node.x += node.vx;
                    node.y += node.vy;
                    node.vx *= 0.9;
                    node.vy *= 0.9;
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);

            // Draw edges
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.3)';
            ctx.lineWidth = 2;
            edges.forEach(edge => {
                ctx.beginPath();
                ctx.moveTo(edge.source.x, edge.source.y);
                ctx.lineTo(edge.target.x, edge.target.y);
                ctx.stroke();
            });

            // Draw nodes
            nodes.forEach(node => {
                ctx.fillStyle = getNodeColor(node);
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                ctx.fill();

                if (selectedNode === node) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // Label
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(node.name, node.x, node.y - node.radius - 8);
            });

            ctx.restore();
        }

        function getNodeAtPosition(x, y) {
            const adjustedX = (x - panX) / zoom;
            const adjustedY = (y - panY) / zoom;

            for (let node of nodes) {
                const dx = adjustedX - node.x;
                const dy = adjustedY - node.y;
                if (Math.sqrt(dx * dx + dy * dy) < node.radius) {
                    return node;
                }
            }
            return null;
        }

        function showDetail(node) {
            selectedNode = node;
            document.getElementById('detailTitle').textContent = node.name;
            document.getElementById('detailType').textContent = node.type;
            document.getElementById('detailDescription').textContent = node.description;

            const connContainer = document.getElementById('detailConnections');
            connContainer.innerHTML = '';
            
            if (node.connections && node.connections.length > 0) {
                node.connections.forEach(id => {
                    const conn = nodes.find(n => n.id === id);
                    if (conn) {
                        const item = document.createElement('div');
                        item.className = 'connection-item';
                        item.textContent = conn.name;
                        item.addEventListener('click', () => focusNode(id));
                        connContainer.appendChild(item);
                    }
                });
            } else {
                connContainer.innerHTML = '<div style="color: #666;">No connections</div>';
            }

            document.getElementById('detailPanel').classList.add('active');
        }

        function closeDetail() {
            selectedNode = null;
            document.getElementById('detailPanel').classList.remove('active');
        }

        function focusNode(nodeId) {
            const node = nodes.find(n => n.id === nodeId);
            if (node) {
                showDetail(node);
            }
        }

        function resetView() {
            panX = 0;
            panY = 0;
            zoom = 1;
        }

        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
        }

        // Event listeners
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const node = getNodeAtPosition(x, y);

            if (node) {
                dragNode = node;
            } else {
                isDragging = true;
                offsetX = x - panX;
                offsetY = y - panY;
            }
        });

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (dragNode) {
                dragNode.x = (x - panX) / zoom;
                dragNode.y = (y - panY) / zoom;
                dragNode.vx = 0;
                dragNode.vy = 0;
            } else if (isDragging) {
                panX = x - offsetX;
                panY = y - offsetY;
            }
        });

        canvas.addEventListener('mouseup', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (dragNode && !isDragging) {
                const node = getNodeAtPosition(x, y);
                if (node === dragNode) {
                    showDetail(node);
                }
            }

            dragNode = null;
            isDragging = false;
        });

        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            zoom *= delta;
            zoom = Math.max(0.3, Math.min(3, zoom));
        });

        // Filter buttons
        document.querySelectorAll('[data-mode]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
            });
        });

        document.querySelectorAll('[data-focus]').forEach(btn => {
            btn.addEventListener('click', () => {
                const wasSame = btn.classList.contains('active');
                document.querySelectorAll('[data-focus]').forEach(b => b.classList.remove('active'));
                
                if (!wasSame) {
                    btn.classList.add('active');
                    currentFocus = btn.dataset.focus;
                    const patternNode = nodes.find(n => n.id === currentFocus);
                    if (patternNode) {
                        showDetail(patternNode);
                    }
                } else {
                    currentFocus = null;
                    closeDetail();
                }
            });
        });

        // Initialize
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initializeNetwork();
        
        // Animation loop
        function animate() {
            applyForces();
            draw();
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
