<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Pillars Theme Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1em;
            color: #999;
            font-weight: 300;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-label {
            color: #999;
            font-size: 0.9em;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #444;
            background: #2d2d2d;
            color: #e0e0e0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85em;
        }

        .filter-btn:hover {
            background: #3d3d3d;
            border-color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .themes-section {
            background: #2d2d2d;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #3d3d3d;
        }

        .section-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .theme-card {
            background: #1e1e2e;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-card:hover {
            transform: translateY(-2px);
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .theme-card.completed {
            opacity: 0.5;
            border-color: #4a4;
        }

        .theme-card.planned {
            border-color: #fa4;
        }

        .theme-title {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 4px;
            color: #e0e0e0;
        }

        .theme-subtitle {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 12px;
        }

        .theme-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meta-tag {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        .meta-tag.deep {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6464;
        }

        .planner-section {
            background: #2d2d2d;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #3d3d3d;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .week-slot {
            background: #1e1e2e;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            padding: 12px;
            min-height: 80px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .week-slot:hover {
            border-color: #667eea;
        }

        .week-slot.filled {
            border-color: #4a4;
            background: linear-gradient(135deg, rgba(68, 170, 68, 0.1) 0%, rgba(68, 170, 68, 0.05) 100%);
        }

        .week-number {
            font-size: 0.75em;
            color: #999;
            margin-bottom: 4px;
        }

        .week-theme {
            font-size: 0.9em;
            font-weight: 500;
            color: #e0e0e0;
        }

        .week-philosopher {
            font-size: 0.75em;
            color: #999;
            margin-top: 4px;
        }

        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .detail-modal.active {
            display: flex;
        }

        .modal-content {
            background: #2d2d2d;
            border-radius: 12px;
            padding: 32px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #667eea;
        }

        .modal-close {
            float: right;
            font-size: 2em;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .modal-close:hover {
            color: #e0e0e0;
        }

        .detail-content h2 {
            color: #667eea;
            margin-bottom: 8px;
        }

        .detail-content h3 {
            font-size: 1.4em;
            margin-bottom: 12px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-label {
            color: #999;
            font-size: 0.85em;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #e0e0e0;
            margin-bottom: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn-secondary {
            background: #3d3d3d;
            color: #e0e0e0;
            border: 1px solid #555;
        }

        .btn-secondary:hover {
            background: #4d4d4d;
        }

        .pillars-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .pillar {
            background: #1e1e2e;
            border-radius: 6px;
            padding: 10px 12px;
            border: 1px solid #3d3d3d;
        }

        .pillar-name {
            font-size: 0.75em;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .pillar-value {
            font-size: 0.85em;
            color: #ccc;
            line-height: 1.4;
        }

        .music-list {
            list-style: none;
            margin-top: 6px;
        }

        .music-list li {
            font-size: 0.875em;
            color: #ccc;
            padding: 3px 0;
            border-bottom: 1px solid #3a3a4e;
        }

        .music-list li:last-child {
            border-bottom: none;
        }

        .music-list li::before {
            content: '▶  ';
            color: #667eea;
            font-size: 0.75em;
        }

        .readings-list {
            margin-top: 6px;
        }

        .reading-item {
            font-size: 0.875em;
            color: #ccc;
            padding: 3px 0;
        }

        .loading-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border: 1px solid #3d3d3d;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 300;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.85em;
            color: #999;
            margin-top: 4px;
        }

        .arc-display {
            margin-top: 20px;
            padding: 16px;
            background: #1e1e2e;
            border-radius: 8px;
            border: 1px solid #3d3d3d;
        }

        .arc-title {
            font-size: 1.1em;
            color: #667eea;
            margin-bottom: 12px;
        }

        .arc-progress {
            height: 8px;
            background: #3d3d3d;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .arc-progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .arc-info {
            font-size: 0.85em;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>4 Pillars Theme Planner</h1>
            <p class="subtitle">Plan your weekly themes with monthly philosopher arcs</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalThemes">40</div>
                <div class="stat-label">Total Themes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedThemes">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="plannedThemes">0</div>
                <div class="stat-label">Planned</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="remainingThemes">40</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>

        <div class="controls">
            <div class="filter-group">
                <span class="filter-label">Difficulty:</span>
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="fundamental">Fundamental</button>
                <button class="filter-btn" data-filter="deep">Deep</button>
            </div>
            <div class="filter-group">
                <span class="filter-label">Status:</span>
                <button class="filter-btn active" data-status="all">All</button>
                <button class="filter-btn" data-status="available">Available</button>
                <button class="filter-btn" data-status="completed">Completed</button>
                <button class="filter-btn" data-status="planned">Planned</button>
            </div>
        </div>

        <div class="main-grid">
            <div class="themes-section">
                <h2 class="section-title">Theme Library</h2>
                <div class="theme-grid" id="themeGrid"></div>
            </div>

            <div class="planner-section">
                <h2 class="section-title">52-Week Planner</h2>
                <div class="arc-display">
                    <div class="arc-title" id="currentArcTitle">Current Arc: Not Started</div>
                    <div class="arc-progress">
                        <div class="arc-progress-fill" id="arcProgress" style="width: 0%"></div>
                    </div>
                    <div class="arc-info" id="arcInfo">Plan your first 3-month philosopher arc</div>
                </div>
                <div class="calendar" id="calendar"></div>
            </div>
        </div>
    </div>

    <div class="detail-modal" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="detail-content" id="detailContent"></div>
        </div>
    </div>

    <script>
        // Theme data — parsed from the inline JSON block above
        const themes = {
            fundamental: [],
            deep: []
        };

        let allThemes = [];

        function loadThemes() {
            try {
                const raw = document.getElementById('themes-data');
                if (!raw) throw new Error('themes-data block missing');
                const data = JSON.parse(raw.textContent);
                themes.fundamental = data.fundamental_themes || [];
                themes.deep = data.deep_themes || [];
            } catch (e) {
                console.warn('Could not parse themes data:', e);
            }
            allThemes = [...themes.fundamental, ...themes.deep];
            loadState();
            renderThemes();
            renderCalendar();
            updateStats();
        }
        let plannedWeeks = {};
        let completedThemes = new Set();
        let currentFilter = 'all';
        let currentStatus = 'all';

        function renderThemes() {
            const grid = document.getElementById('themeGrid');
            let filtered = allThemes;

            if (currentFilter !== 'all') {
                filtered = currentFilter === 'fundamental' ? themes.fundamental : themes.deep;
            }

            if (currentStatus === 'completed') {
                filtered = filtered.filter(t => completedThemes.has(t.id));
            } else if (currentStatus === 'planned') {
                filtered = filtered.filter(t => Object.values(plannedWeeks).some(w => w.id === t.id) && !completedThemes.has(t.id));
            } else if (currentStatus === 'available') {
                filtered = filtered.filter(t => !completedThemes.has(t.id) && !Object.values(plannedWeeks).some(w => w.id === t.id));
            }

            grid.innerHTML = filtered.map(theme => `
                <div class="theme-card ${completedThemes.has(theme.id) ? 'completed' : ''} ${Object.values(plannedWeeks).some(w => w.id === theme.id) ? 'planned' : ''}" onclick="showThemeDetail(${theme.id})">
                    <div class="theme-title">${theme.title}</div>
                    <div class="theme-subtitle">${theme.subtitle}</div>
                    <div class="theme-meta">
                        <span class="meta-tag ${theme.id > 20 ? 'deep' : ''}">${theme.id > 20 ? 'Deep' : 'Fundamental'}</span>
                        <span class="meta-tag">${theme.philosopher}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            
            for (let week = 1; week <= 52; week++) {
                const planned = plannedWeeks[week];
                calendar.innerHTML += `
                    <div class="week-slot ${planned ? 'filled' : ''}" onclick="planWeek(${week})">
                        <div class="week-number">Week ${week}</div>
                        ${planned ? `
                            <div class="week-theme">${planned.title}</div>
                            <div class="week-philosopher">${planned.philosopher}</div>
                        ` : '<div class="week-theme" style="color: #555;">Click to plan</div>'}
                    </div>
                `;
            }
        }

        function updateStats() {
            document.getElementById('totalThemes').textContent = allThemes.length;
            document.getElementById('completedThemes').textContent = completedThemes.size;
            document.getElementById('plannedThemes').textContent = Object.keys(plannedWeeks).length;
            document.getElementById('remainingThemes').textContent = allThemes.length - completedThemes.size;
        }

        function showThemeDetail(id) {
            const theme = allThemes.find(t => t.id === id);
            if (!theme) return;
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailContent');

            const isCompleted = completedThemes.has(id);
            const isFundamental = theme.difficulty === 'fundamental';

            const musicHTML = theme.music_to_study && theme.music_to_study.length ? `
                <div class="detail-section">
                    <div class="detail-label">Music to Study</div>
                    <ul class="music-list">
                        ${theme.music_to_study.map(m => `<li>${m}</li>`).join('')}
                    </ul>
                </div>` : '';

            const readingsHTML = (theme.musical_reading || theme.philosophical_reading) ? `
                <div class="detail-section">
                    <div class="detail-label">Readings</div>
                    <div class="readings-list">
                        ${theme.musical_reading ? `<div class="reading-item">🎵 ${theme.musical_reading}</div>` : ''}
                        ${theme.philosophical_reading ? `<div class="reading-item">📖 ${theme.philosophical_reading}</div>` : ''}
                    </div>
                </div>` : '';

            const pillarsHTML = theme.pillars ? `
                <div class="detail-section">
                    <div class="detail-label">Four Pillars</div>
                    <div class="pillars-grid">
                        <div class="pillar"><div class="pillar-name">Creation</div><div class="pillar-value">${theme.pillars.creation}</div></div>
                        <div class="pillar"><div class="pillar-name">Tools</div><div class="pillar-value">${theme.pillars.tools}</div></div>
                        <div class="pillar"><div class="pillar-name">Philosophy</div><div class="pillar-value">${theme.pillars.philosophy}</div></div>
                        <div class="pillar"><div class="pillar-name">Practice</div><div class="pillar-value">${theme.pillars.practice}</div></div>
                    </div>
                </div>` : '';

            content.innerHTML = `
                <h2>${isFundamental ? 'Fundamental' : 'Deep'} Theme</h2>
                <h3>${theme.title}</h3>
                <div class="detail-section">
                    <div class="detail-label">Subtitle</div>
                    <div class="detail-value">${theme.subtitle}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">Philosopher</div>
                    <div class="detail-value">${theme.philosopher}</div>
                </div>
                ${theme.technical_concept ? `
                <div class="detail-section">
                    <div class="detail-label">Technical Concept</div>
                    <div class="detail-value">${theme.technical_concept}</div>
                </div>` : ''}
                ${theme.philosophical_concept ? `
                <div class="detail-section">
                    <div class="detail-label">Philosophical Concept</div>
                    <div class="detail-value">${theme.philosophical_concept}</div>
                </div>` : ''}
                ${theme.cross_domain_connection ? `
                <div class="detail-section">
                    <div class="detail-label">Cross-Domain Connection</div>
                    <div class="detail-value">${theme.cross_domain_connection}</div>
                </div>` : ''}
                ${musicHTML}
                ${readingsHTML}
                ${pillarsHTML}
                <div class="action-buttons">
                    ${!isCompleted ? `<button class="btn btn-primary" onclick="markCompleted(${id})">Mark Completed</button>` : ''}
                    ${isCompleted ? `<button class="btn btn-secondary" onclick="unmarkCompleted(${id})">Unmark</button>` : ''}
                    <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function planWeek(week) {
            // In production, this would show a selector
            closeModal();
        }

        function markCompleted(id) {
            completedThemes.add(id);
            updateStats();
            renderThemes();
            closeModal();
            saveState();
        }

        function unmarkCompleted(id) {
            completedThemes.delete(id);
            updateStats();
            renderThemes();
            closeModal();
            saveState();
        }

        function saveState() {
            localStorage.setItem('4pillars_state', JSON.stringify({
                plannedWeeks,
                completedThemes: Array.from(completedThemes)
            }));
        }

        function loadState() {
            const saved = localStorage.getItem('4pillars_state');
            if (saved) {
                const state = JSON.parse(saved);
                plannedWeeks = state.plannedWeeks || {};
                completedThemes = new Set(state.completedThemes || []);
            }
        }

        // Filter handlers
        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderThemes();
            });
        });

        document.querySelectorAll('.filter-btn[data-status]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-status]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStatus = btn.dataset.status;
                renderThemes();
            });
        });

        // Initialize — fetch JSON then render
        loadThemes();
    </script>
