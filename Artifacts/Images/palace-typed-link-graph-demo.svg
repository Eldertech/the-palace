<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340">

  <!-- Background -->
  <rect width="640" height="340" fill="#13131f"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e1e30" stroke-width="0.5"/>
    </pattern>
    <!-- Arrow markers -->
    <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L6,3 z" fill="#7b68ee"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L6,3 z" fill="#6ab0de"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L6,3 z" fill="#7dba84"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L6,3 z" fill="#c8a84b"/>
    </marker>
  </defs>
  <rect width="640" height="340" fill="url(#grid)"/>

  <!-- ── Edges (drawn before nodes so nodes sit on top) ── -->

  <!-- Kuramoto → Cooperation Yields Agency : mirrors (purple, symmetric dashes) -->
  <line x1="172" y1="124" x2="296" y2="88"
        stroke="#7b68ee" stroke-width="1.8"
        stroke-dasharray="5 3"
        marker-end="url(#arr-purple)"/>
  <!-- reverse tick to indicate symmetric -->
  <line x1="174" y1="122" x2="298" y2="86"
        stroke="#7b68ee" stroke-width="1.8"
        stroke-dasharray="5 3"
        marker-start="url(#arr-purple)"/>

  <!-- Kuramoto → Spinoza Conatus : mirrors (purple, symmetric) -->
  <line x1="172" y1="198" x2="296" y2="240"
        stroke="#7b68ee" stroke-width="1.8"
        stroke-dasharray="5 3"
        marker-end="url(#arr-purple)"/>
  <line x1="174" y1="200" x2="298" y2="242"
        stroke="#7b68ee" stroke-width="1.8"
        stroke-dasharray="5 3"
        marker-start="url(#arr-purple)"/>

  <!-- Cooperation → Four Pillars : connects-to (blue) -->
  <line x1="390" y1="95" x2="480" y2="148"
        stroke="#6ab0de" stroke-width="1.6"
        marker-end="url(#arr-blue)"/>

  <!-- Spinoza → Cooperation : enables (green, directed) -->
  <line x1="345" y1="220" x2="345" y2="118"
        stroke="#7dba84" stroke-width="1.6"
        marker-end="url(#arr-green)"/>

  <!-- Kuramoto → Four Pillars : couples-with (amber, bidirectional) -->
  <line x1="175" y1="162" x2="468" y2="162"
        stroke="#c8a84b" stroke-width="1.4"
        stroke-dasharray="4 4"
        marker-end="url(#arr-amber)"
        marker-start="url(#arr-amber)"/>

  <!-- ── Edge labels ── -->
  <rect x="185" y="90" width="52" height="14" rx="3" fill="#13131f" opacity="0.85"/>
  <text x="211" y="101" fill="#7b68ee" font-family="'Courier New', monospace" font-size="9.5" text-anchor="middle">mirrors</text>

  <rect x="182" y="212" width="52" height="14" rx="3" fill="#13131f" opacity="0.85"/>
  <text x="208" y="223" fill="#7b68ee" font-family="'Courier New', monospace" font-size="9.5" text-anchor="middle">mirrors</text>

  <rect x="406" y="106" width="70" height="14" rx="3" fill="#13131f" opacity="0.85"/>
  <text x="441" y="117" fill="#6ab0de" font-family="'Courier New', monospace" font-size="9.5" text-anchor="middle">connects-to</text>

  <rect x="302" y="155" width="50" height="14" rx="3" fill="#13131f" opacity="0.85"/>
  <text x="327" y="166" fill="#7dba84" font-family="'Courier New', monospace" font-size="9.5" text-anchor="middle">enables</text>

  <rect x="285" y="150" width="66" height="14" rx="3" fill="#13131f" opacity="0.85"/>
  <text x="318" y="161" fill="#c8a84b" font-family="'Courier New', monospace" font-size="9.5" text-anchor="middle">couples-with</text>

  <!-- ── Nodes ── -->

  <!-- Kuramoto Coupling (left, hub — thicker ring) -->
  <circle cx="132" cy="162" r="46" fill="#1c1c2e" stroke="#7b68ee" stroke-width="3"/>
  <circle cx="132" cy="162" r="40" fill="#1c1c2e" stroke="#7b68ee" stroke-width="1" opacity="0.4"/>
  <text x="132" y="156" fill="#d0cef8" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle" font-weight="bold">Kuramoto</text>
  <text x="132" y="171" fill="#d0cef8" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle" font-weight="bold">Coupling</text>
  <text x="132" y="185" fill="#7b68ee" font-family="'Courier New', monospace" font-size="8" text-anchor="middle">hub</text>

  <!-- Cooperation Yields Agency (top center) -->
  <circle cx="345" cy="80" r="44" fill="#1c1c2e" stroke="#6ab0de" stroke-width="2"/>
  <text x="345" y="70" fill="#c8e4f4" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" text-anchor="middle">Cooperation</text>
  <text x="345" y="84" fill="#c8e4f4" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" text-anchor="middle">Yields Agency</text>
  <text x="345" y="98" fill="#6ab0de" font-family="'Courier New', monospace" font-size="8" text-anchor="middle">concept</text>

  <!-- Spinoza Conatus (bottom center) -->
  <circle cx="345" cy="252" r="40" fill="#1c1c2e" stroke="#7dba84" stroke-width="2"/>
  <text x="345" y="247" fill="#c6e8c8" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle">Spinoza</text>
  <text x="345" y="261" fill="#c6e8c8" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle">Conatus</text>
  <text x="345" y="275" fill="#7dba84" font-family="'Courier New', monospace" font-size="8" text-anchor="middle">concept</text>

  <!-- Four Pillars (right, hub) -->
  <circle cx="522" cy="162" r="46" fill="#1c1c2e" stroke="#c8a84b" stroke-width="3"/>
  <circle cx="522" cy="162" r="40" fill="#1c1c2e" stroke="#c8a84b" stroke-width="1" opacity="0.4"/>
  <text x="522" y="156" fill="#f0e0a0" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle" font-weight="bold">Four</text>
  <text x="522" y="171" fill="#f0e0a0" font-family="Georgia, 'Times New Roman', serif" font-size="11" text-anchor="middle" font-weight="bold">Pillars</text>
  <text x="522" y="185" fill="#c8a84b" font-family="'Courier New', monospace" font-size="8" text-anchor="middle">hub</text>

  <!-- ── Caption ── -->
  <line x1="40" y1="312" x2="600" y2="312" stroke="#2a2a40" stroke-width="1"/>
  <text x="320" y="328" fill="#555570" font-family="Georgia, 'Times New Roman', serif" font-size="10" text-anchor="middle" font-style="italic">A fragment of the palace graph — typed links as directed semantic claims. Double-headed dashes indicate symmetric relationships.</text>

</svg>
