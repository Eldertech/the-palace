<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d9d4c8"/>
    </marker>
    <marker id="arrfb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e0a13a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="560" fill="#15140f"/>

  <text x="32" y="44" fill="#f2ede1" font-family="'Anton',sans-serif" font-size="30" letter-spacing="1">NEUROPULSE — CORRECTED SIGNAL FLOW</text>
  <text x="32" y="70" fill="#8f897b" font-size="13">cycle-4 fix · one mean-field feedback channel · route() deinterleave · single coupled state recursion</text>

  <!-- feedback channel -->
  <text x="36" y="150" fill="#e0a13a" font-size="13">coupling</text>
  <text x="36" y="166" fill="#7a7568" font-size="11">(mean-field, fed back)</text>

  <!-- population bank -->
  <rect x="180" y="118" width="210" height="74" rx="6" fill="#1f1d16" stroke="#4a4636"/>
  <text x="285" y="146" fill="#f2ede1" font-size="14" text-anchor="middle">population_bank</text>
  <text x="285" y="166" fill="#8f897b" font-size="11" text-anchor="middle">par(i, N, neuron(i, c))</text>
  <text x="285" y="182" fill="#7a7568" font-size="10" text-anchor="middle">1 in → 2N interleaved out</text>

  <line x1="120" y1="155" x2="178" y2="155" stroke="#d9d4c8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- interleaved bus label -->
  <text x="430" y="140" fill="#7a7568" font-size="10">V0 s0 V1 s1 … V₍ₙ₋₁₎ s₍ₙ₋₁₎</text>
  <line x1="390" y1="155" x2="500" y2="155" stroke="#d9d4c8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- deinterleave -->
  <rect x="500" y="118" width="180" height="74" rx="6" fill="#1f1d16" stroke="#4a4636"/>
  <text x="590" y="146" fill="#f2ede1" font-size="14" text-anchor="middle">deinterleave</text>
  <text x="590" y="166" fill="#8f897b" font-size="11" text-anchor="middle">route(2N, 2N, …)</text>
  <text x="590" y="182" fill="#7a7568" font-size="10" text-anchor="middle">→ [ V bus | spike bus ]</text>

  <!-- two buses -->
  <line x1="680" y1="142" x2="760" y2="142" stroke="#9cc7d8" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="680" y1="172" x2="760" y2="172" stroke="#cf6a5a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="760" y="120" width="128" height="40" rx="5" fill="#16242b" stroke="#3c5a64"/>
  <text x="824" y="138" fill="#9cc7d8" font-size="12" text-anchor="middle">V bus (N)</text>
  <text x="824" y="153" fill="#6f8a92" font-size="10" text-anchor="middle">mean · gain_mix</text>

  <rect x="760" y="166" width="128" height="40" rx="5" fill="#2a1916" stroke="#5e3730"/>
  <text x="824" y="184" fill="#cf6a5a" font-size="12" text-anchor="middle">spike bus (N)</text>
  <text x="824" y="199" fill="#94655c" font-size="10" text-anchor="middle">mean → coupling</text>

  <!-- audio out -->
  <line x1="824" y1="160" x2="824" y2="250" stroke="#9cc7d8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="824" y="270" fill="#9cc7d8" font-size="13" text-anchor="middle">audio out ▶</text>

  <!-- feedback path: spike bus mean -> coupling (the ~ loop) -->
  <path d="M824,206 L824,330 L80,330 L80,168" fill="none" stroke="#e0a13a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrfb)"/>
  <text x="430" y="324" fill="#e0a13a" font-size="11" text-anchor="middle">~ _   the single-channel Kuramoto feedback (one sample delay = axonal delay)</text>

  <!-- bug box -->
  <rect x="32" y="372" width="856" height="156" rx="8" fill="#1a1812" stroke="#4a4636"/>
  <text x="52" y="400" fill="#e0a13a" font-size="14" font-family="'Anton',sans-serif" letter-spacing="1">THREE BUGS, ONE ROOT CAUSE — FIXED</text>

  <text x="52" y="426" fill="#cf6a5a" font-size="12">✗ before</text>
  <text x="130" y="426" fill="#bdb7a8" font-size="12">par(i,N,_),par(i,N,_) only split 2N down the middle → "V bus" was V0 s0 V1 s1…, scrambled.</text>
  <text x="130" y="446" fill="#bdb7a8" font-size="12">phase/timer/vel re-declared INSIDE V_step → four divorced state machines, none initialized right.</text>
  <text x="130" y="466" fill="#bdb7a8" font-size="12">the ~ _ loop closed over the wrong channel because the deinterleave was wrong.</text>

  <text x="52" y="494" fill="#9cc7d8" font-size="12">✓ after</text>
  <text x="130" y="494" fill="#d9d4c8" font-size="12">route(2N,2N,…) gives a true [V bus | spike bus] split. One coupled state recursion</text>
  <text x="130" y="514" fill="#d9d4c8" font-size="12">(V,phase,timer,vel) ~ (_,_,_,_). One feedback channel, so ~ is unambiguous. mean_N collapses each bus.</text>

  <text x="888" y="548" fill="#5c5849" font-size="10" text-anchor="end">Loudon Live · Autodidact Polymaths</text>
</svg>
