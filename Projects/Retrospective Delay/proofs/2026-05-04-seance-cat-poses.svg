<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <style>
      .bg { fill: #0f0f10; }
      .panel { fill: #1a1a1d; stroke: #2a2a30; stroke-width: 1; }
      .label { fill: #f5d68b; font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .sub { fill: #9a9aa0; font-family: -apple-system, system-ui, sans-serif; font-size: 11px; }
      .knob-bg { fill: #2a2a30; stroke: #444; stroke-width: 1; }
      .knob-mark { stroke: #ff6f59; stroke-width: 3; stroke-linecap: round; }
      .cat-body { fill: #6dd3c7; }
      .cat-stripe { fill: #4a9d92; }
      .cat-eye { fill: #0f0f10; }
      .cat-pupil { fill: #f5d68b; }
      .cat-mouth { fill: none; stroke: #0f0f10; stroke-width: 2; stroke-linecap: round; }
      .ecto { fill: #c576c5; opacity: 0.3; }
      .ecto2 { fill: #6dd3c7; opacity: 0.4; }
      .star { fill: #f5d68b; }
      .zzz { fill: #6dd3c7; font-family: serif; font-style: italic; font-size: 24px; }
      .title { fill: #f5d68b; font-family: -apple-system, system-ui, sans-serif; font-size: 22px; font-weight: 600; }
      .subtitle { fill: #c0c0c0; font-family: -apple-system, system-ui, sans-serif; font-size: 13px; }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <text x="600" y="32" class="title" text-anchor="middle">Retrospective Delay — the séance medium responds to the gain knob</text>
  <text x="600" y="52" class="subtitle" text-anchor="middle">the past is dormant, summoned, present</text>

  <!-- PANEL 1: gain = 0, dormant -->
  <g transform="translate(40, 80)">
    <rect class="panel" width="360" height="340" rx="6"/>
    <!-- Sleeping cat curled up -->
    <g transform="translate(180, 200)">
      <!-- body curled -->
      <ellipse class="cat-body" cx="0" cy="20" rx="80" ry="45"/>
      <ellipse class="cat-stripe" cx="-30" cy="15" rx="12" ry="6"/>
      <ellipse class="cat-stripe" cx="0" cy="10" rx="14" ry="6"/>
      <ellipse class="cat-stripe" cx="30" cy="15" rx="12" ry="6"/>
      <!-- head tucked -->
      <circle class="cat-body" cx="-55" cy="15" r="28"/>
      <!-- closed eyes (just lines) -->
      <path d="M -68 12 Q -62 16 -56 12" stroke="#0f0f10" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M -52 12 Q -46 16 -40 12" stroke="#0f0f10" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- ears -->
      <path d="M -78 -5 L -70 -22 L -64 -8 Z" class="cat-body"/>
      <path d="M -50 -5 L -42 -22 L -36 -8 Z" class="cat-body"/>
      <!-- tail curled around -->
      <path d="M 70 25 Q 110 30 100 -10 Q 90 -30 60 -10" stroke="#6dd3c7" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- zzz -->
      <text x="50" y="-20" class="zzz">z</text>
      <text x="65" y="-40" class="zzz" font-size="20">z</text>
      <text x="80" y="-58" class="zzz" font-size="16">z</text>
    </g>
    <!-- knob -->
    <g transform="translate(60, 290)">
      <circle class="knob-bg" cx="0" cy="0" r="22"/>
      <line class="knob-mark" x1="0" y1="0" x2="-15" y2="15"/>
      <text x="0" y="48" class="sub" text-anchor="middle">gain</text>
    </g>
    <text x="180" y="50" class="label" text-anchor="middle">gain = 0</text>
    <text x="180" y="68" class="sub" text-anchor="middle">the buffer records, the past is silent</text>
  </g>

  <!-- PANEL 2: gain = mid, summoning -->
  <g transform="translate(420, 80)">
    <rect class="panel" width="360" height="340" rx="6"/>
    <!-- Reaching cat -->
    <g transform="translate(180, 220)">
      <!-- swirling ectoplasm starting -->
      <ellipse class="ecto" cx="60" cy="-40" rx="35" ry="20"/>
      <ellipse class="ecto2" cx="80" cy="-60" rx="25" ry="15"/>
      <!-- body upright -->
      <ellipse class="cat-body" cx="0" cy="20" rx="40" ry="55"/>
      <ellipse class="cat-stripe" cx="-15" cy="20" rx="8" ry="20"/>
      <ellipse class="cat-stripe" cx="15" cy="20" rx="8" ry="20"/>
      <!-- head looking up and to the right -->
      <circle class="cat-body" cx="10" cy="-40" r="32"/>
      <!-- ears alert -->
      <path d="M -10 -55 L -8 -78 L 4 -60 Z" class="cat-body"/>
      <path d="M 18 -60 L 26 -82 L 30 -62 Z" class="cat-body"/>
      <!-- eyes wide, pupils tracking up-right -->
      <ellipse class="cat-eye" cx="0" cy="-42" rx="6" ry="7"/>
      <ellipse class="cat-eye" cx="20" cy="-42" rx="6" ry="7"/>
      <ellipse class="cat-pupil" cx="2" cy="-44" rx="2" ry="3"/>
      <ellipse class="cat-pupil" cx="22" cy="-44" rx="2" ry="3"/>
      <!-- mouth slightly open -->
      <ellipse class="cat-eye" cx="10" cy="-28" rx="4" ry="3"/>
      <!-- arm reaching up-right -->
      <path d="M 30 0 Q 60 -30 80 -55" stroke="#6dd3c7" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle class="cat-body" cx="80" cy="-55" r="10"/>
      <!-- other arm at side -->
      <ellipse class="cat-body" cx="-32" cy="20" rx="10" ry="22"/>
    </g>
    <!-- knob halfway -->
    <g transform="translate(60, 290)">
      <circle class="knob-bg" cx="0" cy="0" r="22"/>
      <line class="knob-mark" x1="0" y1="0" x2="0" y2="-18"/>
      <text x="0" y="48" class="sub" text-anchor="middle">gain</text>
    </g>
    <text x="180" y="50" class="label" text-anchor="middle">gain = mid</text>
    <text x="180" y="68" class="sub" text-anchor="middle">the ghost emerges, ectoplasm swirls</text>
  </g>

  <!-- PANEL 3: gain = peak, full séance -->
  <g transform="translate(800, 80)">
    <rect class="panel" width="360" height="340" rx="6"/>
    <!-- swirling ectoplasm wraps around -->
    <g transform="translate(180, 200)">
      <ellipse class="ecto" cx="-80" cy="-30" rx="50" ry="30"/>
      <ellipse class="ecto2" cx="80" cy="-30" rx="50" ry="30"/>
      <ellipse class="ecto" cx="0" cy="-90" rx="60" ry="25"/>
      <ellipse class="ecto2" cx="-60" cy="60" rx="40" ry="20"/>
      <ellipse class="ecto" cx="60" cy="60" rx="40" ry="20"/>
      <!-- stars -->
      <polygon class="star" points="-100,-60 -96,-50 -86,-50 -94,-43 -90,-33 -100,-40 -110,-33 -106,-43 -114,-50 -104,-50"/>
      <polygon class="star" points="100,-60 104,-50 114,-50 106,-43 110,-33 100,-40 90,-33 94,-43 86,-50 96,-50"/>
      <polygon class="star" points="0,-110 4,-100 14,-100 6,-93 10,-83 0,-90 -10,-83 -6,-93 -14,-100 -4,-100"/>
      <!-- body upright triumphant -->
      <ellipse class="cat-body" cx="0" cy="30" rx="42" ry="55"/>
      <ellipse class="cat-stripe" cx="-12" cy="30" rx="6" ry="22"/>
      <ellipse class="cat-stripe" cx="12" cy="30" rx="6" ry="22"/>
      <!-- head -->
      <circle class="cat-body" cx="0" cy="-30" r="34"/>
      <!-- big ears -->
      <path d="M -22 -42 L -22 -75 L -8 -50 Z" class="cat-body"/>
      <path d="M 22 -42 L 22 -75 L 8 -50 Z" class="cat-body"/>
      <!-- starry eyes -->
      <circle class="cat-eye" cx="-12" cy="-32" r="8"/>
      <circle class="cat-eye" cx="12" cy="-32" r="8"/>
      <polygon class="star" points="-12,-38 -10,-34 -6,-34 -10,-31 -8,-27 -12,-30 -16,-27 -14,-31 -18,-34 -14,-34"/>
      <polygon class="star" points="12,-38 14,-34 18,-34 14,-31 16,-27 12,-30 8,-27 10,-31 6,-34 10,-34"/>
      <!-- big open mouth grin -->
      <path d="M -14 -16 Q 0 -2 14 -16 Q 8 -22 0 -20 Q -8 -22 -14 -16 Z" class="cat-eye"/>
      <!-- arms outstretched both sides -->
      <path d="M -30 5 Q -75 -20 -100 -10" stroke="#6dd3c7" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M 30 5 Q 75 -20 100 -10" stroke="#6dd3c7" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle class="cat-body" cx="-100" cy="-10" r="12"/>
      <circle class="cat-body" cx="100" cy="-10" r="12"/>
    </g>
    <!-- knob full right -->
    <g transform="translate(60, 290)">
      <circle class="knob-bg" cx="0" cy="0" r="22"/>
      <line class="knob-mark" x1="0" y1="0" x2="15" y2="15"/>
      <text x="0" y="48" class="sub" text-anchor="middle">gain</text>
    </g>
    <text x="180" y="50" class="label" text-anchor="middle">gain = peak</text>
    <text x="180" y="68" class="sub" text-anchor="middle">the past is fully present, the medium ascends</text>
  </g>

  <!-- footer -->
  <text x="600" y="460" class="subtitle" text-anchor="middle">stage 4 target — JSUI implementation. character morphs continuously across the knob's range.</text>
</svg>
