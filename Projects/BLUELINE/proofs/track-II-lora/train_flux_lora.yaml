---
# BLUELINE Track II — character LoRA (ai-toolkit / ostris). Trains the "r4ng3r" ranger
# from the 8-image dataset. Run on a GPU pod: `python run.py train_flux_lora.yaml`.
# Needs HF_TOKEN with FLUX.1-dev access (gated) — see TRAIN.md.
job: extension
config:
  name: "r4ng3r_flux_lora"
  process:
    - type: 'sd_trainer'
      training_folder: "/workspace/out"
      device: cuda:0
      trigger_word: "r4ng3r"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 300
        max_step_saves_to_keep: 2
      datasets:
        - folder_path: "/workspace/dataset"     # 8 .png + matching .txt captions
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [768, 1024]
      train:
        batch_size: 1
        steps: 1200                              # ~enough for an 8-image character LoRA
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false                # FLUX LoRA: UNet only
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.1-dev"   # gated; HF_TOKEN must have access
        is_flux: true
        quantize: true                            # fp8 base -> fits comfortably on a 24GB+ GPU
      sample:
        sampler: "flowmatch"
        sample_every: 300
        prompts:
          - "r4ng3r, a young woman ranger, standing in a misty forest, full body"
          - "r4ng3r, close-up portrait, dramatic rim light"
          - "r4ng3r, drawing a bow, dynamic action pose"
        neg: ""
        seed: 42
        walk_seed: true
        width: 768
        height: 1024
        sample_steps: 20
meta:
  name: "r4ng3r"
  version: '1.0'
