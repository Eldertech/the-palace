<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" role="img">
  <title>Enrichment supervisor + maker + critic flow (v2 target architecture)</title>
  <desc>Loudon clicks send. Server fires one supervisor Claude. Supervisor builds a brief, dispatches typed maker subagents in parallel, then a fresh-context critic gates the result with one iteration round before writing to the BBS queue. Note: v1 ships only the trigger + critic + text-only subset; this diagram shows the v2 target.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a256"/>
    </marker>
    <marker id="ar-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fb3a8"/>
    </marker>
  </defs>

  <style>
    svg { color: #1a1a1d; }
    .gold { fill: #d4a256; }
    .teal { fill: #5fb3a8; }
    .dim { fill: currentColor; fill-opacity: 0.55; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; }
    .box-g { fill: none; stroke: #d4a256; stroke-width: 1.4; }
    .box-g2 { fill: none; stroke: #d4a256; stroke-opacity: 0.55; stroke-width: 1; }
    .box-t { fill: none; stroke: #5fb3a8; stroke-width: 1.2; }
    .ln { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; fill: none; }
    .ln-g { stroke: #d4a256; stroke-width: 1.3; fill: none; }
    .ln-t { stroke: #5fb3a8; stroke-width: 1.1; fill: none; }
    .ln-d { stroke-dasharray: 4 3; }
    text { fill: currentColor; }
  </style>

  <!-- White backdrop for standalone viewing -->
  <rect width="900" height="720" fill="#fafaf7"/>

  <!-- LOUDON @ BBS -->
  <rect x="320" y="14" width="260" height="48" class="box-g"/>
  <rect x="324" y="18" width="252" height="40" class="box-g2"/>
  <text x="450" y="34" text-anchor="middle" class="gold" font-size="11" letter-spacing="2">▣ LOUDON @ BBS</text>
  <text x="450" y="50" text-anchor="middle" class="dim" font-size="10">localhost:7878 · click ▶ send</text>

  <line x1="450" y1="62" x2="450" y2="92" class="ln" marker-end="url(#ar)"/>
  <text x="460" y="80" class="dim" font-size="10">POST /api/respond</text>

  <!-- SERVER -->
  <rect x="370" y="92" width="160" height="38" class="box"/>
  <text x="450" y="110" text-anchor="middle" font-size="11">server.py</text>
  <text x="450" y="124" text-anchor="middle" class="dim" font-size="10">append inbox · fire worker</text>

  <line x1="450" y1="130" x2="450" y2="162" class="ln-g" marker-end="url(#ar-g)"/>
  <text x="460" y="150" class="dim" font-size="10">claude -p (single, sequential)</text>

  <!-- LEGEND -->
  <g transform="translate(720, 78)">
    <rect width="150" height="52" class="box"/>
    <text x="8" y="14" font-size="10" class="dim">legend</text>
    <line x1="8" y1="26" x2="24" y2="26" class="ln-g"/>
    <text x="30" y="29" font-size="10" class="gold">your touch · success</text>
    <line x1="8" y1="42" x2="24" y2="42" class="ln-t"/>
    <text x="30" y="45" font-size="10" class="teal">subagent · critique</text>
  </g>

  <!-- SUPERVISOR FRAME -->
  <rect x="30" y="165" width="840" height="450" class="box-g"/>
  <rect x="34" y="169" width="832" height="442" class="box-g2"/>
  <text x="50" y="187" class="gold" font-size="11" letter-spacing="2">▢ SUPERVISOR · one global, sequential</text>
  <text x="50" y="202" class="dim" font-size="10">reads inbox + target entry · distills brief · dispatches · validates · writes · commits</text>

  <!-- Brief -->
  <rect x="60" y="225" width="180" height="42" class="box"/>
  <text x="150" y="243" text-anchor="middle" font-size="11">brief per card</text>
  <text x="150" y="258" text-anchor="middle" class="dim" font-size="10">target · purpose · FV · medium</text>

  <line x1="240" y1="246" x2="280" y2="246" class="ln"/>
  <line x1="280" y1="246" x2="280" y2="290" class="ln"/>
  <line x1="280" y1="290" x2="800" y2="290" class="ln"/>

  <!-- Three makers -->
  <line x1="350" y1="290" x2="350" y2="320" class="ln" marker-end="url(#ar)"/>
  <rect x="270" y="320" width="160" height="42" class="box-t"/>
  <text x="350" y="338" text-anchor="middle" class="teal" font-size="11">image-maker</text>
  <text x="350" y="354" text-anchor="middle" class="dim" font-size="10">prompt → render</text>

  <line x1="540" y1="290" x2="540" y2="320" class="ln" marker-end="url(#ar)"/>
  <rect x="460" y="320" width="160" height="42" class="box-t"/>
  <text x="540" y="338" text-anchor="middle" class="teal" font-size="11">audio-maker</text>
  <text x="540" y="354" text-anchor="middle" class="dim" font-size="10">Suno · Kokoro · synth</text>

  <line x1="730" y1="290" x2="730" y2="320" class="ln" marker-end="url(#ar)"/>
  <rect x="650" y="320" width="160" height="42" class="box-t"/>
  <text x="730" y="338" text-anchor="middle" class="teal" font-size="11">text-maker</text>
  <text x="730" y="354" text-anchor="middle" class="dim" font-size="10">poem · voice-act · koan</text>

  <!-- merge to v1 -->
  <line x1="350" y1="362" x2="350" y2="395" class="ln"/>
  <line x1="540" y1="362" x2="540" y2="395" class="ln"/>
  <line x1="730" y1="362" x2="730" y2="395" class="ln"/>
  <line x1="350" y1="395" x2="730" y2="395" class="ln"/>
  <line x1="540" y1="395" x2="540" y2="420" class="ln" marker-end="url(#ar)"/>
  <text x="555" y="412" class="dim" font-size="10">v1 artifact</text>

  <!-- CRITIC -->
  <rect x="430" y="420" width="220" height="44" class="box-t"/>
  <text x="540" y="439" text-anchor="middle" class="teal" font-size="11">CRITIC · fresh context</text>
  <text x="540" y="455" text-anchor="middle" class="dim" font-size="10">verdict: pass / revise / kill</text>

  <!-- split to outcomes -->
  <line x1="540" y1="464" x2="540" y2="490" class="ln"/>
  <line x1="160" y1="490" x2="800" y2="490" class="ln"/>

  <!-- pass -->
  <line x1="160" y1="490" x2="160" y2="510" class="ln-g" marker-end="url(#ar-g)"/>
  <rect x="60" y="510" width="200" height="42" class="box-g2"/>
  <text x="160" y="528" text-anchor="middle" class="gold" font-size="11">pass</text>
  <text x="160" y="544" text-anchor="middle" class="dim" font-size="10">write card.md · queue updates</text>

  <!-- revise -->
  <line x1="540" y1="490" x2="540" y2="510" class="ln-t" marker-end="url(#ar-t)"/>
  <rect x="440" y="510" width="200" height="42" class="box-t"/>
  <text x="540" y="528" text-anchor="middle" class="teal" font-size="11">revise</text>
  <text x="540" y="544" text-anchor="middle" class="dim" font-size="10">critique → maker · cap: 1 round</text>

  <!-- kill -->
  <line x1="800" y1="490" x2="800" y2="510" class="ln" marker-end="url(#ar)"/>
  <rect x="710" y="510" width="160" height="42" class="box"/>
  <text x="790" y="528" text-anchor="middle" font-size="11">kill</text>
  <text x="790" y="544" text-anchor="middle" class="dim" font-size="10">no card · move on</text>

  <!-- iteration loop -->
  <path d="M 440 530 C 200 530, 200 250, 350 318" class="ln-t ln-d" marker-end="url(#ar-t)"/>
  <text x="170" y="455" class="teal" font-size="10" font-style="italic">iterate (cap 1)</text>

  <!-- pass exit out of supervisor -->
  <line x1="160" y1="552" x2="160" y2="595" class="ln-g"/>
  <line x1="160" y1="595" x2="450" y2="595" class="ln-g"/>
  <line x1="450" y1="595" x2="450" y2="643" class="ln-g" marker-end="url(#ar-g)"/>

  <!-- BBS REFRESH -->
  <rect x="290" y="645" width="320" height="48" class="box-g"/>
  <rect x="294" y="649" width="312" height="40" class="box-g2"/>
  <text x="450" y="665" text-anchor="middle" class="gold" font-size="11" letter-spacing="1">↻ BBS · card slid in or revised</text>
  <text x="450" y="681" text-anchor="middle" class="dim" font-size="10">queue stays at 5 · pace catches up to your reading</text>
</svg>
