  <text x="400" y="400" fill="#9a9aa0" font-size="10" text-anchor="middle">drift at n=12 (vs ideal): B=0.0004 → +75 Hz · B=0.001 → +184 Hz · the high partials are where stiffness sings sharp</text>

  <text x="400" y="430" fill="#6dd3c7" font-size="14" text-anchor="middle" font-style="italic">fₙ = n · f₀ · √(1 + B·n²)</text>
  <text x="400" y="448" fill="#555" font-size="9" text-anchor="middle">B = stiffness coefficient · ideal string: B=0 · real pianos: B ≈ 0.0001 (bass) to 0.005+ (highest treble)</text>
