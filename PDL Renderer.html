  <script type="text/babel">
    const { useState } = React;

    // ─── Registry Bootstrap ──────────────────────────────────────────────────────
    // Single source of truth: the inline <script type="application/json" id="vcv-registry">
    // block at the top of the body. That block mirrors vcv_fundamental_registry.json —
    // keep them in sync (when the schema solidifies, the HTML can fetch() the JSON instead).
    //
    // REGISTRY shape after bootstrap: { [moduleType]: { slug, hp, inputs:[...], outputs:[...], params, perceptual_index, ... } }

    const REGISTRY_DATA     = JSON.parse(document.getElementById("vcv-registry").textContent);
    const REGISTRY          = REGISTRY_DATA.modules;
    const PLUGIN_SLUG       = REGISTRY_DATA.plugin_slug || "Fundamental";
    // T11 — virtual endpoint map ({ KEYBOARD: { module: "MIDI_CV", ... }, OUT: { module: "AUDIO_8", ... }})
    // lets the parser auto-bind unregistered-but-referenced instances so patches
    // emit sound-ready without requiring `@KEYBOARD = MIDI_CV` boilerplate.
    const VIRTUAL_ENDPOINTS = REGISTRY_DATA.virtual_endpoints || {};

    // ─── Archetype Bootstrap (T7b) ───────────────────────────────────────────────
    // Synth archetype library — param-cloud projections onto existing topology,
    // keyed by musical identity. Mirrors archetypes.json — keep them in sync.
    const ARCHETYPES_DATA            = JSON.parse(document.getElementById("archetypes").textContent);
    const ARCHETYPES                 = ARCHETYPES_DATA.archetypes || {};
    const ARCHETYPE_ROLE_CONVENTIONS = ARCHETYPES_DATA.role_conventions || {};

    // Build lookup maps from the registry for fast port-type resolution
    function buildRegistryLookup(registry) {
      const inputMap  = {}; // moduleType → { portName → type }
      const outputMap = {};
      for (const [type, mod] of Object.entries(registry)) {
        inputMap[type]  = {};
        outputMap[type] = {};
        for (const p of (mod.inputs  || [])) inputMap[type][p.name]  = p.type;
        for (const p of (mod.outputs || [])) outputMap[type][p.name] = p.type;
      }
      return { inputMap, outputMap };
    }
    const { inputMap: REG_INPUTS, outputMap: REG_OUTPUTS } = buildRegistryLookup(REGISTRY);

    // ─── Constants ──────────────────────────────────────────────────────────────
    const MODULE_W       = 160;
    const MODULE_HEADER  = 28;
    const PORT_H         = 22;
    const PORT_PAD_BOT   = 10;
    const PORT_DOT_R     = 5;
    const COL_GAP        = 100;
    const ROW_GAP        = 28;
    const CANVAS_PAD     = 48;

    const SIGNAL_COLORS = {
      audio:   "#f28b6e",
      cv:      "#a78bfa",
      gate:    "#6ee7b7",
      pitch:   "#60a5fa",
      trigger: "#fbbf24",
      default: "#94a3b8",
    };

    const SIGNAL_LABELS = {
      audio: "Audio", cv: "CV", gate: "Gate", pitch: "Pitch", trigger: "Trigger",
    };

    // ─── Helpers ─────────────────────────────────────────────────────────────────
    function modHeight(numInputs) {
      return MODULE_HEADER + Math.max(numInputs, 1) * PORT_H + PORT_PAD_BOT;
    }
    function inputPortY(modY, portIdx) {
      return modY + MODULE_HEADER + portIdx * PORT_H + PORT_H / 2;
    }
    function outputPortY(modY, numInputs) {
      return modY + MODULE_HEADER + (Math.max(numInputs, 1) * PORT_H) / 2;
    }

    // ─── Registry Port Type Resolution ───────────────────────────────────────────
    // Priority: explicit bracket > destination registry input > source registry output > null
    // Callers chain with || and put "default" at the end — so these must return null on miss,
    // never the string "default" (which would be truthy and short-circuit the chain).
    function resolveInputType(instanceId, portName, bracketType, instanceTypes) {
      if (bracketType) return bracketType;                    // explicit bracket wins
      const modType = instanceTypes[instanceId];
      if (modType && REG_INPUTS[modType]) {
        const t = REG_INPUTS[modType][portName];
        if (t) return t;
      }
      return null;                                           // miss → let caller try next resolver
    }

    function resolveOutputType(instanceId, portName, bracketType, instanceTypes) {
      if (bracketType) return bracketType;                    // explicit bracket wins
      const modType = instanceTypes[instanceId];
      if (modType && REG_OUTPUTS[modType]) {
        const t = REG_OUTPUTS[modType][portName || "OUT"];
        if (t) return t;
      }
      return null;                                           // miss → caller falls through to "default"
    }

    // ─── Parser ──────────────────────────────────────────────────────────────────
    // T12 (2026-04-20): every non-empty, non-comment line that matches no known
    // shape — and every @declaration naming an unknown module type — records a
    // warning with its line number and original content. The sidebar surfaces
    // these so silent regex rejection (the 2026-04-19 footgun) is loud, not
    // invisible. Warnings never block parsing; good lines still produce a patch.
    function parsePDL(text) {
      const connections   = [];
      const params        = {};
      const moduleSet     = new Set();
      const instanceTypes = {}; // instanceId → registry module type key
      const warnings      = []; // { source, lineNumber, content, reason }
      const archetypes    = []; // { name, bindings, seed, lineNumber } (T7b)

      const rawLines = text.split("\n");
      for (let i = 0; i < rawLines.length; i++) {
        const rawLine    = rawLines[i];
        const lineNumber = i + 1;

        // Strip trailing `// comment` from any line, then trim. This way an inline
        // comment on a declaration / connection / param line doesn't make the
        // regex below silently reject the whole line — a real bug we hit on
        // 2026-04-19 when @FENV = ADSR  // filter envelope failed to register.
        const stripped = rawLine.replace(/\/\/.*$/, "");
        const line = stripped.trim();
        if (!line) continue;

        // Archetype pragma (T7b):  # archetype: name {role=INST, ...} #seed=N
        // Collected here, resolved at emit time at lower precedence than `*` lines.
        if (line.startsWith("#")) {
          const am = line.match(/^#\s*archetype\s*:\s*([A-Za-z0-9_]+)\s*(\{[^}]*\})?\s*(?:#\s*seed\s*=\s*(-?\d+))?\s*$/);
          if (am) {
            const bindings = {};
            if (am[2]) am[2].slice(1, -1).split(",").map(s => s.trim()).filter(Boolean).forEach(pair => {
              const [role, inst] = pair.split("=").map(x => x.trim());
              if (role && inst) bindings[role] = inst;
            });
            archetypes.push({ name: am[1], bindings, seed: am[3] != null ? parseInt(am[3], 10) : 0, lineNumber });
          } else {
            warnings.push({
              source: "parser", lineNumber, content: rawLine,
              reason: "malformed `# archetype` pragma (expected `# archetype: name {role=INST} #seed=N`)",
            });
          }
          continue;
        }

        // Instance declaration:  @INSTANCE = ModuleType
        if (line.startsWith("@")) {
          const m = line.match(/^@([\w\s]+?)\s*=\s*(\w+)\s*$/);
          if (m) {
            const instanceId = m[1].trim();
            const modType    = m[2].trim();
            if (REGISTRY[modType]) {
              instanceTypes[instanceId] = modType;
            } else {
              warnings.push({
                source: "parser", lineNumber, content: rawLine,
                reason: `unknown module type: "${modType}" — not in registry (known: ${Object.keys(REGISTRY).join(", ")})`,
              });
              // Don't record the binding — a non-existent module type can't be routed.
              // The instance will render as unregistered, with the warning as context.
            }
          } else {
            warnings.push({
              source: "parser", lineNumber, content: rawLine,
              reason: "malformed @instance declaration (expected `@INSTANCE = ModuleType`)",
            });
          }
          continue;
        }

        // Parameter line:  * Module: Key = Val | Key = Val
        // Entries carry their source line number so downstream warnings
        // (emitVcvJson) can point the amber panel at the exact line in the
        // editor. Multiple entries on one line share the same line number —
        // that's fine, any one of them is the right place to look.
        if (line.startsWith("*")) {
          const m = line.match(/^\*\s*([\w\s]+?):\s*(.+)$/);
          if (m) {
            const mod = m[1].trim();
            params[mod] = params[mod] || [];
            m[2].split("|").map(s => s.trim()).filter(Boolean).forEach(e =>
              params[mod].push({ entry: e, lineNumber })
            );
          } else {
            warnings.push({
              source: "parser", lineNumber, content: rawLine,
              reason: "malformed `* param` line (expected `* Mod: Name = Value | Name = Value`)",
            });
          }
          continue;
        }

        // Connection line:  A(:port)? -> B(:port)? [type]?
        const cm = line.match(
          /^([\w\s/]+?)(?::([^->\[\]]+))?\s*->\s*([\w\s/]+?)(?::([^->\[\]]+))?\s*(?:\[(\w+)\])?$/
        );
        if (cm) {
          const [, from, fromPort, to, toPort, bracketType] = cm;
          const fromId = from.trim(), toId = to.trim();
          moduleSet.add(fromId);
          moduleSet.add(toId);
          connections.push({
            from: fromId, fromPort: fromPort?.trim() || null,
            to:   toId,   toPort:   toPort?.trim()   || null,
            bracketType: bracketType?.toLowerCase() || null,
          });
        } else {
          warnings.push({
            source: "parser", lineNumber, content: rawLine,
            reason: "unrecognized line — does not match `@decl`, `A -> B`, `* param`, or `// comment`",
          });
        }
      }

      // T11 — auto-inject virtual endpoints. Any instance name that was referenced
      // in a connection but NOT declared with `@name = Type`, and whose name
      // matches a key in the registry's virtual_endpoints map, gets bound to
      // the mapped module type. This is the whole point of virtual endpoints:
      // `KEYBOARD -> OSC:V/OCT` Just Works without `@KEYBOARD = MIDI_CV`
      // boilerplate, and similarly `AMP -> OUT:IN1` auto-binds OUT to AUDIO_8.
      // Explicit `@` declarations still win — if the user wrote `@KEYBOARD = VCO`
      // the auto-injection skips it.
      for (const [virtName, spec] of Object.entries(VIRTUAL_ENDPOINTS)) {
        if (!instanceTypes[virtName] && moduleSet.has(virtName) && REGISTRY[spec.module]) {
          instanceTypes[virtName] = spec.module;
        }
      }

      // Resolve final port names + signal types for each connection.
      //
      // Priority for an unnamed port, in order (v2.2):
      //   1. Type-matched sibling — if the OTHER side of this connection has a
      //      named port with a known signal type, prefer a port on THIS side
      //      whose type matches. This is what makes `KEYBOARD -> ENV:GATE`
      //      auto-pick KEYBOARD:GATE (gate) instead of KEYBOARD:PITCH (default).
      //   2. Module's `default_input` / `default_output` (v2.1+ explicit).
      //   3. First port in declaration order (legacy fallback).
      //
      // Type-matching matters for virtual endpoints that expose many typed
      // outputs (MIDI_CV has 12, grouped as pitch/gate/cv/trigger); without
      // it, every unnamed KEYBOARD-> cable would resolve to PITCH.
      const findPortByType = (ports, type) => ports?.find(p => p.type === type)?.name || null;

      const resolvedConnections = connections.map(c => {
        const toModType    = instanceTypes[c.to];
        const fromModType  = instanceTypes[c.from];
        const toModReg     = toModType   && REGISTRY[toModType];
        const fromModReg   = fromModType && REGISTRY[fromModType];
        const toDefault    = toModReg   && (toModReg.default_input    || toModReg.inputs?.[0]?.name);
        const fromDefault  = fromModReg && (fromModReg.default_output || fromModReg.outputs?.[0]?.name);

        // Start with explicit ports.
        let toPort   = c.toPort;
        let fromPort = c.fromPort;

        // Step 1 — type-matched sibling. Only fills in a missing port if the
        // OTHER side is already named AND typed.
        if (toPort && !fromPort && fromModReg) {
          const destType = toModReg?.inputs?.find(p => p.name === toPort)?.type;
          if (destType) fromPort = findPortByType(fromModReg.outputs, destType) || fromPort;
        }
        if (fromPort && !toPort && toModReg) {
          const srcType = fromModReg?.outputs?.find(p => p.name === fromPort)?.type;
          if (srcType) toPort = findPortByType(toModReg.inputs, srcType) || toPort;
        }

        // Step 2/3 — module default, then first-port legacy. Unregistered
        // endpoints fall through to "In"/"Out" placeholders.
        toPort   = toPort   || toDefault   || "In";
        fromPort = fromPort || fromDefault || "Out";

        const type = resolveInputType(c.to, toPort, c.bracketType, instanceTypes)
                  || resolveOutputType(c.from, fromPort, c.bracketType, instanceTypes)
                  || "default";
        return { ...c, toPort, fromPort, type };
      });

      return { connections: resolvedConnections, params, modules: [...moduleSet], instanceTypes, archetypes, warnings };
    }

    // ─── .vcv Emitter ────────────────────────────────────────────────────────────
    // Transforms a parsed PDL spec + registry into a VCV Rack patch JSON object.
    //
    // Scope (T7a phase 2, 2026-05-26):
    //   - Only registered instances become VCV modules. Unregistered endpoints
    //     (KEYBOARD, OUT, external controllers) are treated as virtual — cables
    //     that touch them are skipped in the emitter output.
    //   - Module placement packs left-to-right by HP width, wrapping at LAYOUT_MAX_HP.
    //   - Parameter values: per-param, prefer the numeric value from the PDL `*`
    //     line for that instance, else the registry `default`. Named perceptual
    //     regions (`CUTOFF = dark`) resolve through the param's `regions` table
    //     via `sampleRegion()` — phase 2 wired this branch into the non-finite
    //     path phase 1 already routed to a warning. Param-name lookups also
    //     check each spec's `aliases` array (e.g. `CUTOFF` resolves to VCF's
    //     canonical `FREQ`). Unknown regions still warn and fall back to default.
    //
    // Schema caveats:
    //   VCV Rack's .vcv JSON schema was written from public documentation and sample
    //   files. If a generated file fails to load, the most likely culprits are field
    //   name casing or the exact version string. Compare against a file saved out of
    //   VCV Rack 2.x and adjust this emitter accordingly. The structural shape —
    //   modules[] with {id, plugin, model, version, params, pos} and cables[] with
    //   {id, outputModuleId, outputId, inputModuleId, inputId, color} — is stable.

    const LAYOUT_MAX_HP = 120;
    const CABLE_COLORS_VCV = {
      audio:   "#f28b6e",
      cv:      "#a78bfa",
      gate:    "#6ee7b7",
      pitch:   "#60a5fa",
      trigger: "#fbbf24",
      default: "#94a3b8",
    };

    // T7a phase 2 — resolve a PDL param name against the canonical name AND
    // any `aliases` declared on the spec. Returns the spec object, or null if
    // nothing matches. The emitter records resolved values under the canonical
    // `spec.name` so downstream `params[].value` lookups by canonical name
    // continue to work (aliases are PDL surface only, never registry truth).
    function resolveParamSpec(modReg, name) {
      const params = (modReg && modReg.params) || [];
      for (const spec of params) {
        if (spec.name === name) return spec;
        if (Array.isArray(spec.aliases) && spec.aliases.includes(name)) return spec;
      }
      return null;
    }

    // T7a phase 2 — sample a named perceptual region into a concrete numeric
    // value in the spec's native units. `pos` ∈ [0,1] picks within the region;
    // omitted → midpoint (deterministic, byte-identical .vcv runs guaranteed).
    // T7b's seeded resolver will pass a per-archetype `pos` for within-region
    // variance without touching this function. Returns null if the region
    // name isn't declared — the caller warns and falls back to default.
    function sampleRegion(spec, regionName, pos) {
      const region = spec && spec.regions && spec.regions[regionName];
      if (!region) return null;
      const [lo, hi] = region;
      const p = (pos == null) ? 0.5 : pos;
      const v = lo + (hi - lo) * p;
      const [rmin, rmax] = spec.range;
      return Math.min(rmax, Math.max(rmin, v));
    }

    // ─── Archetype resolver (T7b) ────────────────────────────────────────────────
    // An archetype is a param-cloud projection onto EXISTING topology — it never
    // injects modules. Roles map to declared instances by name convention (or an
    // explicit {role=INST} binding); each region samples at a deterministic
    // position from (seed, archetype, instance, param); constraints run last.
    // Emit precedence: explicit `*` line > archetype param > registry default.
    // Mirrored by verify_t7b.js — keep the two in sync.
    function archetypeHash(seed, archetypeName, instId, paramName) {
      const str = seed + ":" + archetypeName + ":" + instId + ":" + paramName;
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    }

    function inferRole(instId) {
      return ARCHETYPE_ROLE_CONVENTIONS[instId.toUpperCase()] || null;
    }

    function clampToParam(modReg, name, v) {
      const spec = resolveParamSpec(modReg, name);
      if (!spec || !spec.range) return v;
      return Math.min(spec.range[1], Math.max(spec.range[0], v));
    }

    function resolveArchetype(archDef, archetypeName, seed, instanceTypes, bindings) {
      const out = {};
      const warnings = [];
      const roles    = (archDef.topology && archDef.topology.roles) || {};
      const required = (archDef.topology && archDef.topology.required) || [];
      const roleToInst = {};

      // Explicit bindings win.
      for (const [role, inst] of Object.entries(bindings || {})) {
        if (instanceTypes[inst]) roleToInst[role] = inst;
        else warnings.push({ source: "archetype", reason: `archetype "${archetypeName}" binding ${role}=${inst} but "${inst}" is not a declared instance` });
      }
      // Convention inference for unbound roles (name -> role, type must match).
      for (const role of Object.keys(roles)) {
        if (roleToInst[role]) continue;
        for (const [inst, type] of Object.entries(instanceTypes)) {
          if (inferRole(inst) === role && type === roles[role] && !Object.values(roleToInst).includes(inst)) {
            roleToInst[role] = inst;
            break;
          }
        }
      }
      // Required roles present?
      for (const role of required) {
        if (!roleToInst[role]) {
          warnings.push({ source: "archetype", reason: `archetype "${archetypeName}" requires role "${role}" (${roles[role]}) but no matching instance was found — its params are skipped` });
        }
      }
      // Sample each role's param cloud at its deterministic position.
      for (const [role, paramMap] of Object.entries(archDef.params || {})) {
        const inst = roleToInst[role];
        if (!inst) continue;
        const modReg = REGISTRY[instanceTypes[inst]];
        out[inst] = out[inst] || {};
        for (const [pname, regionName] of Object.entries(paramMap)) {
          const spec = resolveParamSpec(modReg, pname);
          if (!spec) {
            warnings.push({ source: "archetype", reason: `archetype "${archetypeName}" role ${role}: param "${pname}" not in registry for ${instanceTypes[inst]}` });
            continue;
          }
          const pos = archetypeHash(seed, archetypeName, inst, spec.name);
          const val = sampleRegion(spec, regionName, pos);
          if (val == null) {
            const known = spec.regions ? Object.keys(spec.regions).join(", ") : "<none>";
            warnings.push({ source: "archetype", reason: `archetype "${archetypeName}" role ${role}: region "${regionName}" unknown for ${spec.name} (known: ${known})` });
            continue;
          }
          out[inst][spec.name] = val;
        }
      }
      // Constraints run after sampling, in declaration order.
      for (const c of (archDef.constraints || [])) {
        const from = (c.from || "").split(".");
        const to   = (c.to   || "").split(".");
        const fromInst = roleToInst[from[0]];
        const toInst   = roleToInst[to[0]];
        if (!fromInst || !toInst) continue;
        const fromVal = out[fromInst] && out[fromInst][from[1]];
        if (fromVal == null) continue;
        out[toInst] = out[toInst] || {};
        let v = fromVal;
        if (c.kind === "offset")            v = fromVal + (c.delta  || 0);
        else if (c.kind === "proportional") v = fromVal * (c.factor || 1);
        out[toInst][to[1]] = clampToParam(REGISTRY[instanceTypes[toInst]], to[1], v);
      }
      return { params: out, warnings };
    }

    function emitVcvJson(pdlText) {
      const { connections, instanceTypes, params: pdlParams, archetypes: pdlArchetypes, warnings } = parsePDL(pdlText);

      // Only registered instances become VCV modules.
      const registeredIds = Object.keys(instanceTypes).filter(id => REGISTRY[instanceTypes[id]]);

      // Assign sequential integer IDs starting at 1.
      const moduleId = {};
      registeredIds.forEach((id, i) => { moduleId[id] = i + 1; });

      // Layout: left-to-right HP packing with row wrap.
      const positions = {};
      let curX = 0, curRow = 0;
      for (const id of registeredIds) {
        const mod = REGISTRY[instanceTypes[id]];
        const hp  = mod.hp || 1;
        if (curX + hp > LAYOUT_MAX_HP && curX > 0) { curRow++; curX = 0; }
        positions[id] = [curX, curRow];
        curX += hp;
      }

      // T7a phase 2 — resolve PDL `*` entries into per-instance
      // { paramName → numeric value } maps. Each entry is `Name = Value`.
      // Value resolution order:
      //   1. Finite numeric literal → emit verbatim.
      //   2. Otherwise look up `Value` as a region name on the spec's
      //      `regions` table; sample the midpoint (deterministic).
      //   3. Otherwise warn (listing known regions) and fall through to the
      //      registry default downstream.
      // Param-name lookups widen through `aliases` — PDL can say `CUTOFF`
      // and resolve to VCF's canonical `FREQ`. Resolved values are recorded
      // under the canonical `spec.name` so downstream lookups by registry
      // name continue to work.
      // Warnings also fire for: malformed entries missing `=`; param names
      // (including aliases) not in the registry for the instance's module
      // type; and `*` lines referring to instances that were never declared
      // (and aren't virtual endpoints).
      const resolvedParams = {}; // instanceId → { paramName: number }

      // T7b — overlay archetype params first so explicit `*` lines (below) always
      // win. Multiple `# archetype:` directives apply in order; later overwrites.
      for (const a of (pdlArchetypes || [])) {
        const archDef = ARCHETYPES[a.name];
        if (!archDef) {
          warnings.push({
            source: "emitter", lineNumber: a.lineNumber,
            content: `# archetype: ${a.name}`,
            reason: `unknown archetype "${a.name}" (known: ${Object.keys(ARCHETYPES).join(", ") || "<none>"})`,
          });
          continue;
        }
        const { params: archParams, warnings: archWarns } = resolveArchetype(archDef, a.name, a.seed, instanceTypes, a.bindings);
        for (const w of archWarns) warnings.push({ ...w, lineNumber: a.lineNumber });
        for (const [inst, pmap] of Object.entries(archParams)) {
          resolvedParams[inst] = resolvedParams[inst] || {};
          Object.assign(resolvedParams[inst], pmap);
        }
      }

      for (const [instId, entries] of Object.entries(pdlParams || {})) {
        resolvedParams[instId] = resolvedParams[instId] || {};
        const modType = instanceTypes[instId];
        const modReg  = modType && REGISTRY[modType];

        if (!modReg) {
          // Orphan `* INST: ...` — no @ declaration and not a virtual endpoint
          // that resolved to a registry module. Use the first entry's line
          // number; if there are multiple lines for the same orphan instance
          // any one of them is the right place to look.
          const firstLine = entries[0]?.lineNumber ?? null;
          warnings.push({
            source: "emitter", lineNumber: firstLine,
            content: `* ${instId}: ${entries.map(e => e.entry).join(" | ")}`,
            reason: `param line refers to undeclared instance "${instId}" — no values will be emitted`,
          });
          continue;
        }

        for (const { entry, lineNumber } of entries) {
          const eqIdx = entry.indexOf("=");
          if (eqIdx < 0) {
            warnings.push({
              source: "emitter", lineNumber,
              content: `* ${instId}: ${entry}`,
              reason: `param entry missing "=": "${entry}"`,
            });
            continue;
          }
          const name   = entry.slice(0, eqIdx).trim();
          const rawVal = entry.slice(eqIdx + 1).trim();

          const spec = resolveParamSpec(modReg, name);
          if (!spec) {
            const paramNames = (modReg.params || []).map(p => p.name);
            warnings.push({
              source: "emitter", lineNumber,
              content: `* ${instId}: ${entry}`,
              reason: `param "${name}" is not in registry for ${modType} (known: ${paramNames.join(", ") || "<none>"})`,
            });
            continue;
          }

          // JS `Number("")` is 0, so guard empty strings explicitly.
          const num = rawVal === "" ? NaN : Number(rawVal);
          if (Number.isFinite(num)) {
            resolvedParams[instId][spec.name] = num;
            continue;
          }

          // Non-finite → try a named region.
          const sampled = sampleRegion(spec, rawVal);
          if (sampled != null) {
            resolvedParams[instId][spec.name] = sampled;
            continue;
          }

          const known = spec.regions ? Object.keys(spec.regions).join(", ") : "<none>";
          warnings.push({
            source: "emitter", lineNumber,
            content: `* ${instId}: ${entry}`,
            reason: `param "${name}" value "${rawVal}" is not a finite number or known region (known regions for ${spec.name}: ${known}) — falling back to registry default`,
          });
        }
      }

      // Build modules array. Each module's plugin comes from its registry
      // entry's `plugin` field (v2.2+); falls back to the top-level PLUGIN_SLUG
      // for legacy entries that predate per-module plugins. Fundamental and Core
      // modules can now coexist in a single patch — the T11 prerequisite for
      // MIDI_CV + AudioInterface to ride alongside VCO/VCF/ADSR/VCA.
      //
      // T7a phase 1 (2026-04-20) — per-param value emission: prefer the
      // parsed PDL `*` value for this instance, else the registry `default`.
      // Previous behavior wrote `value: 0` for every param regardless of the
      // PDL spec, which made audible generation tests require hand-writing
      // the .vcv file. Registry-default fallback is strictly more correct
      // than zero (e.g. VCO SYNC_MODE defaults to 1, LFO OFFSET defaults to 1).
      //
      // T7a phase 2 (2026-05-26) — `pvals` may now have been populated from
      // a named region (`CUTOFF = dark` → 0.275) rather than a literal. The
      // downstream emission shape doesn't change; the resolution step above
      // is where the new behavior lives.
      const modulesOut = registeredIds.map(id => {
        const modType = instanceTypes[id];
        const mod     = REGISTRY[modType];
        const pvals   = resolvedParams[id] || {};
        return {
          id: moduleId[id],
          plugin: mod.plugin || PLUGIN_SLUG,
          version: REGISTRY_DATA.vcv_rack_version || "2.0.0",
          model: mod.slug,
          params: (mod.params || []).map(p => ({
            id: p.index,
            value: Object.prototype.hasOwnProperty.call(pvals, p.name)
              ? pvals[p.name]
              : (p.default ?? 0),
          })),
          leftModuleId: -1,
          rightModuleId: -1,
          data: {},
          pos: positions[id],
        };
      });

      // Build cables array. Skip any cable whose endpoint isn't a registered module
      // (e.g. KEYBOARD -> OSC on the source side). Emit a warning list so the UI
      // can surface which PDL lines didn't translate.
      const cablesOut = [];
      const skipped   = [];
      let cableCounter = 1;

      for (const c of connections) {
        if (!instanceTypes[c.from] || !instanceTypes[c.to]) {
          skipped.push({ line: `${c.from}${c.fromPort?':'+c.fromPort:''} -> ${c.to}${c.toPort?':'+c.toPort:''}`, reason: "endpoint not registered" });
          continue;
        }

        const fromMod = REGISTRY[instanceTypes[c.from]];
        const toMod   = REGISTRY[instanceTypes[c.to]];
        const fromPort = (fromMod.outputs || []).find(p => p.name === c.fromPort);
        const toPort   = (toMod.inputs   || []).find(p => p.name === c.toPort);

        if (!fromPort || !toPort) {
          skipped.push({
            line: `${c.from}:${c.fromPort} -> ${c.to}:${c.toPort}`,
            reason: !fromPort ? `output port "${c.fromPort}" not in ${instanceTypes[c.from]}` :
                                `input port "${c.toPort}" not in ${instanceTypes[c.to]}`
          });
          continue;
        }

        cablesOut.push({
          id: cableCounter++,
          outputModuleId: moduleId[c.from],
          outputId: fromPort.index,
          inputModuleId: moduleId[c.to],
          inputId: toPort.index,
          color: CABLE_COLORS_VCV[c.type] || CABLE_COLORS_VCV.default,
        });
      }

      const patch = {
        version: REGISTRY_DATA.vcv_rack_version || "2.0.0",
        zoom: 0.0,
        gridOffset: [0.0, 0.0],
        cableOpacity: 0.5,
        cableTension: 0.5,
        lockModules: false,
        modules: modulesOut,
        cables: cablesOut,
      };

      return { patch, skipped, warnings };
    }

    // Triggers a browser download of a .vcv file for the given PDL spec.
    function downloadVcvPatch(pdlText, filename) {
      const { patch, skipped, warnings } = emitVcvJson(pdlText);
      const json = JSON.stringify(patch, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = filename || "patch.vcv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return { skipped, warnings, moduleCount: patch.modules.length, cableCount: patch.cables.length };
    }

    // ─── Port Map ────────────────────────────────────────────────────────────────
    function buildPortMap(connections) {
      const inputPorts  = {};
      const outputPorts = {};

      for (const c of connections) {
        inputPorts[c.to]  = inputPorts[c.to]  || [];
        const inName  = c.toPort   || "In";
        if (!inputPorts[c.to].find(p => p.name === inName))
          inputPorts[c.to].push({ name: inName, type: c.type });

        outputPorts[c.from] = outputPorts[c.from] || [];
        const outName = c.fromPort || "Out";
        if (!outputPorts[c.from].find(p => p.name === outName))
          outputPorts[c.from].push({ name: outName, type: c.type });
      }

      return { inputPorts, outputPorts };
    }

    // ─── Layout ──────────────────────────────────────────────────────────────────
    function layoutModules(modules, connections, inputPorts) {
      const outEdges = {}, inDegree = {};
      for (const m of modules) { outEdges[m] = []; inDegree[m] = 0; }
      for (const c of connections) {
        outEdges[c.from] = outEdges[c.from] || [];
        inDegree[c.to]   = (inDegree[c.to] || 0);
        outEdges[c.from].push(c.to);
        inDegree[c.to]++;
      }

      const col = {}, visited = new Set();
      const queue = modules.filter(m => (inDegree[m] || 0) === 0);
      queue.forEach(m => { col[m] = 0; visited.add(m); });

      let head = 0;
      while (head < queue.length) {
        const m = queue[head++];
        for (const next of (outEdges[m] || [])) {
          col[next] = Math.max(col[next] || 0, col[m] + 1);
          if (!visited.has(next)) { visited.add(next); queue.push(next); }
        }
      }
      for (const m of modules) if (col[m] === undefined) col[m] = 0;

      const cols = {};
      for (const m of modules) {
        const c = col[m];
        cols[c] = cols[c] || [];
        cols[c].push(m);
      }

      const positions = {};
      const colKeys   = Object.keys(cols).map(Number).sort((a, b) => a - b);
      let x = CANVAS_PAD;

      for (const c of colKeys) {
        let y = CANVAS_PAD;
        for (const m of cols[c]) {
          const numIn = (inputPorts[m] || []).length;
          const h     = modHeight(numIn);
          positions[m] = { x, y, w: MODULE_W, h };
          y += h + ROW_GAP;
        }
        x += MODULE_W + COL_GAP;
      }

      const totalW = x - COL_GAP + CANVAS_PAD + 180;
      const totalH = Math.max(...Object.values(positions).map(p => p.y + p.h)) + CANVAS_PAD;

      return { positions, totalW, totalH };
    }

    // ─── Cable Path ──────────────────────────────────────────────────────────────
    function cablePath(x1, y1, x2, y2) {
      const dx = Math.max(Math.abs(x2 - x1) * 0.5, 50);
      return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    }

    // ─── Registry Badge ──────────────────────────────────────────────────────────
    // Shows which module type an instance is bound to (small badge in header)
    function RegistryBadge({ x, y, w, instanceId, instanceTypes }) {
      const modType = instanceTypes[instanceId];
      if (!modType) return null;
      const mod = REGISTRY[modType];
      const label = mod ? `${modType} · ${mod.hp}hp` : modType;
      return (
        <text
          x={x + w / 2} y={y + MODULE_HEADER + 1}
          textAnchor="middle" fill="#475569"
          fontSize={7.5} fontFamily="monospace"
          style={{ userSelect: "none" }}
        >
          {label}
        </text>
      );
    }

    // ─── Module Block ─────────────────────────────────────────────────────────────
    function ModuleBlock({ id, x, y, w, h, inputPorts, outputPorts, instanceTypes }) {
      const inputs    = inputPorts[id]  || [];
      const hasOutput = (outputPorts[id] || []).length > 0;
      const numInputs = inputs.length;
      const outY      = outputPortY(y, numInputs);
      const isRegistered = !!instanceTypes[id];

      return (
        <g>
          {/* Shadow */}
          <rect x={x+3} y={y+3} width={w} height={h} rx={8} fill="rgba(0,0,0,0.22)" />
          {/* Body */}
          <rect x={x} y={y} width={w} height={h} rx={8} fill="#1e293b" stroke={isRegistered ? "#3b5270" : "#334155"} strokeWidth={isRegistered ? 2 : 1.5} />
          {/* Header band */}
          <rect x={x} y={y} width={w} height={MODULE_HEADER} rx={8} fill={isRegistered ? "#2d4060" : "#2d3f55"} />
          <rect x={x} y={y + MODULE_HEADER - 8} width={w} height={8} fill={isRegistered ? "#2d4060" : "#2d3f55"} />
          {/* Module name */}
          <text
            x={x + w / 2} y={y + MODULE_HEADER - 8}
            textAnchor="middle" fill="#f1f5f9"
            fontSize={11} fontWeight="700" fontFamily="monospace"
          >
            {id}
          </text>

          {/* Registry type badge */}
          <RegistryBadge x={x} y={y} w={w} instanceId={id} instanceTypes={instanceTypes} />

          {/* Divider line below header */}
          <line x1={x} y1={y + MODULE_HEADER} x2={x + w} y2={y + MODULE_HEADER} stroke="#334155" strokeWidth={1} />

          {/* Input port rows */}
          {inputs.map((port, i) => {
            const py    = inputPortY(y, i);
            const color = SIGNAL_COLORS[port.type] || SIGNAL_COLORS.default;
            return (
              <g key={port.name}>
                {i % 2 === 1 && (
                  <rect x={x + 1} y={py - PORT_H / 2} width={w - 2} height={PORT_H} fill="rgba(255,255,255,0.02)" />
                )}
                <circle cx={x} cy={py} r={PORT_DOT_R} fill={color} stroke="#0f172a" strokeWidth={1.5} />
                <rect x={x + PORT_DOT_R + 2} y={py - 1} width={3} height={2} fill={color} opacity={0.6} />
                <text
                  x={x + PORT_DOT_R + 10} y={py + 4}
                  fill="#cbd5e1" fontSize={10} fontFamily="monospace"
                >
                  {port.name}
                </text>
                {/* Type tag removed — color on the dot encodes type; text clashed with the output "out" label */}
              </g>
            );
          })}

          {inputs.length === 0 && !hasOutput && (
            <text x={x + w/2} y={y + MODULE_HEADER + PORT_H/2 + 4} textAnchor="middle" fill="#475569" fontSize={9} fontFamily="monospace">
              (no connections)
            </text>
          )}

          {hasOutput && (
            <>
              <circle cx={x + w} cy={outY} r={PORT_DOT_R} fill="#475569" stroke="#0f172a" strokeWidth={1.5} />
              {/* "out" label sits above the dot — avoids colliding with input type rows */}
              <text
                x={x + w} y={outY - PORT_DOT_R - 3}
                textAnchor="middle" fill="#475569"
                fontSize={7.5} fontFamily="monospace"
              >
                out
              </text>
            </>
          )}
        </g>
      );
    }

    // ─── Diagram ─────────────────────────────────────────────────────────────────
    function Diagram({ pdl }) {
      const { connections, params, modules, instanceTypes } = parsePDL(pdl);
      if (modules.length === 0) return (
        <div style={{ color: "#475569", fontSize: 12, padding: 40 }}>
          No modules yet — start typing connections above.
        </div>
      );

      const { inputPorts, outputPorts } = buildPortMap(connections);
      const { positions, totalW, totalH } = layoutModules(modules, connections, inputPorts);

      return (
        <svg
          width={totalW} height={totalH}
          style={{ display: "block", background: "#0f172a", borderRadius: 12 }}
        >
          <defs>
            {Object.entries(SIGNAL_COLORS).map(([type, color]) => (
              <marker key={type} id={`arr-${type}`} markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
                <path d="M0,0 L0,6 L7,3 z" fill={color} />
              </marker>
            ))}
          </defs>

          {/* Cables — drawn first so modules render on top */}
          {connections.map((c, i) => {
            const from = positions[c.from];
            const to   = positions[c.to];
            if (!from || !to) return null;

            const color = SIGNAL_COLORS[c.type] || SIGNAL_COLORS.default;

            const numFromIn = (inputPorts[c.from] || []).length;
            const x1 = from.x + from.w + PORT_DOT_R;
            const y1 = outputPortY(from.y, numFromIn);

            const toPortList = inputPorts[c.to] || [];
            const inName     = c.toPort || "In";
            const portIdx    = Math.max(0, toPortList.findIndex(p => p.name === inName));
            const x2 = to.x - PORT_DOT_R;
            const y2 = inputPortY(to.y, portIdx);

            return (
              <g key={i}>
                <path
                  d={cablePath(x1, y1, x2, y2)}
                  stroke={color} strokeWidth={2} fill="none"
                  strokeOpacity={0.8}
                  markerEnd={`url(#arr-${c.type})`}
                />
              </g>
            );
          })}

          {/* Module blocks */}
          {modules.map(id => {
            const pos = positions[id];
            if (!pos) return null;
            return (
              <ModuleBlock
                key={id} id={id}
                x={pos.x} y={pos.y} w={pos.w} h={pos.h}
                inputPorts={inputPorts}
                outputPorts={outputPorts}
                instanceTypes={instanceTypes}
              />
            );
          })}

          {/* Legend */}
          <g transform={`translate(${totalW - 158}, 20)`}>
            <rect x={0} y={0} width={140} height={120} rx={6} fill="#1e293b" stroke="#334155" strokeWidth={1} opacity={0.95} />
            <text x={10} y={18} fill="#64748b" fontSize={9} fontFamily="monospace" fontWeight="600" letterSpacing="1">
              SIGNAL TYPES
            </text>
            {Object.entries(SIGNAL_LABELS).map(([type, label], i) => (
              <g key={type} transform={`translate(10, ${30 + i * 18})`}>
                <circle cx={6} cy={4} r={4} fill={SIGNAL_COLORS[type]} />
                <line x1={14} y1={4} x2={28} y2={4} stroke={SIGNAL_COLORS[type]} strokeWidth={2} />
                <text x={34} y={8} fill={SIGNAL_COLORS[type]} fontSize={9} fontFamily="monospace">{label}</text>
              </g>
            ))}
          </g>
        </svg>
      );
    }

    // ─── Warnings Panel ───────────────────────────────────────────────────────────
    // T12 surface — parse-time warnings appear here the moment the PDL textarea
    // changes. This is the whole point of T12: a line the parser couldn't
    // recognize must be visible, not silently dropped. Rendering never blocks —
    // good lines still produce a diagram.
    function WarningsPanel({ warnings }) {
      if (!warnings || warnings.length === 0) return null;
      return (
        <div style={{
          marginTop: 12,
          background: "rgba(251, 191, 36, 0.06)",
          border: "1px solid rgba(251, 191, 36, 0.35)",
          borderRadius: 8,
          padding: "10px 12px",
          fontFamily: "monospace",
        }}>
          <div style={{ color: "#fbbf24", fontSize: 10, fontWeight: 700, letterSpacing: 1, marginBottom: 6 }}>
            ⚠ {warnings.length} LINE{warnings.length === 1 ? "" : "S"} NOT RECOGNIZED
          </div>
          <div style={{ fontSize: 10, color: "#cbd5e1", lineHeight: 1.7 }}>
            {warnings.map((w, i) => (
              <div key={i} style={{ marginBottom: 4 }}>
                <span style={{ color: "#fbbf24" }}>line {w.lineNumber}</span>
                <span style={{ color: "#475569" }}> — </span>
                <span style={{ color: "#e2e8f0" }}>{w.reason}</span>
                <div style={{ color: "#64748b", marginLeft: 12, fontSize: 9 }}>
                  {w.content.trim().length > 0 ? `› ${w.content.trim()}` : "› (whitespace only)"}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─── Registry Panel ───────────────────────────────────────────────────────────
    function RegistryPanel() {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ marginTop: 16 }}>
          <button
            onClick={() => setOpen(o => !o)}
            style={{
              background: "none", border: "1px solid #334155", color: "#64748b",
              borderRadius: 6, padding: "4px 10px", fontSize: 10, cursor: "pointer",
              fontFamily: "monospace", letterSpacing: 1,
            }}
          >
            {open ? "▾" : "▸"} REGISTRY — VCV Fundamental ({Object.keys(REGISTRY).length} modules)
          </button>
          {open && (
            <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 8 }}>
              {Object.entries(REGISTRY).map(([key, mod]) => (
                <div key={key} style={{
                  background: "#1e293b", border: "1px solid #2d4060",
                  borderRadius: 6, padding: "8px 10px", fontSize: 9,
                  color: "#94a3b8", minWidth: 140,
                }}>
                  <div style={{ color: "#f1f5f9", fontWeight: 700, marginBottom: 4 }}>
                    {key} <span style={{ color: "#475569", fontWeight: 400 }}>({mod.slug} · {mod.hp}hp)</span>
                  </div>
                  {mod.inputs.length > 0 && (
                    <div style={{ marginBottom: 3 }}>
                      <span style={{ color: "#475569" }}>in: </span>
                      {mod.inputs.map(p => (
                        <span key={p.name} style={{ color: SIGNAL_COLORS[p.type], marginRight: 6 }}>
                          {p.name}
                          {!p.verified && <span style={{ color: "#475569" }}>*</span>}
                        </span>
                      ))}
                    </div>
                  )}
                  {mod.outputs.length > 0 && (
                    <div>
                      <span style={{ color: "#475569" }}>out: </span>
                      {mod.outputs.map(p => (
                        <span key={p.name} style={{ color: SIGNAL_COLORS[p.type], marginRight: 6 }}>
                          {p.name}
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              ))}
              <div style={{ fontSize: 9, color: "#334155", alignSelf: "flex-end" }}>* = derived, not source-verified</div>
            </div>
          )}
        </div>
      );
    }

    // ─── App ─────────────────────────────────────────────────────────────────────
    const DEFAULT_PDL = `// Classic Subtractive Voice — sound-ready out of the gate (T11)
// KEYBOARD and OUT are virtual: they auto-bind to MIDI_CV and AUDIO_8
// at parse time, so the exported .vcv loads AND plays sound with no
// manual wiring inside Rack. Type-aware default resolution picks
// KEYBOARD:PITCH for V/OCT cables and KEYBOARD:GATE for gate cables.

@OSC  = VCO
@FILT = VCF
@ENV  = ADSR
@AMP  = VCA

// Keyboard drives pitch and gate (type-matched defaults pick PITCH / GATE)
KEYBOARD -> OSC:V/OCT
KEYBOARD -> ENV:GATE

// Audio signal chain
OSC:SAW -> FILT:IN
FILT:LPF -> AMP:IN

// Envelope controls amplifier
ENV:ENV -> AMP:CV

// Stereo-centered output — patch both interface inputs so both speakers play
AMP -> OUT:IN1
AMP -> OUT:IN2

// Parameters (emitted in T7 — currently cosmetic; modules load with VCV defaults)
* OSC:  Waveform = Saw | Tune = 0
* FILT: Cutoff = 2000Hz | Resonance = 20%
* ENV:  A = 5ms | D = 200ms | S = 70% | R = 400ms`;

    function App() {
      const [pdl, setPdl] = useState(DEFAULT_PDL);
      const [exportStatus, setExportStatus] = useState(null);

      // Re-parse on every render to drive live warnings. parsePDL is pure and
      // cheap at this spec size; if it ever gets expensive, memoize on pdl.
      const liveParse = parsePDL(pdl);

      function handleExport() {
        try {
          const result = downloadVcvPatch(pdl, "patch.vcv");
          setExportStatus({ ok: true, ...result });
        } catch (err) {
          setExportStatus({ ok: false, error: String(err && err.message || err) });
        }
      }

      return (
        <div style={{ padding: 24, minHeight: "100vh" }}>
          {/* Header */}
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 18, fontWeight: 700, letterSpacing: 1 }}>
              PDL — Patch Description Language
            </div>
            <div style={{ fontSize: 11, color: "#64748b", marginTop: 4 }}>
              Edit the spec → diagram updates live &nbsp;·&nbsp;
              {Object.entries(SIGNAL_LABELS).map(([type, label]) => (
                <span key={type} style={{ color: SIGNAL_COLORS[type], marginRight: 12 }}>● {label}</span>
              ))}
              <span style={{ color: "#3b5270" }}>■</span>
              <span style={{ color: "#475569", marginLeft: 4 }}>= registry-grounded module</span>
            </div>
          </div>

          <div style={{ display: "flex", gap: 24, alignItems: "flex-start", flexWrap: "wrap" }}>

            {/* Editor panel */}
            <div style={{ flex: "0 0 320px" }}>
              <div style={{ fontSize: 10, color: "#64748b", marginBottom: 6, letterSpacing: 1, textTransform: "uppercase" }}>
                Patch Spec
              </div>
              <textarea
                value={pdl}
                onChange={e => { setPdl(e.target.value); setExportStatus(null); }}
                spellCheck={false}
                style={{
                  width: "100%", height: 440,
                  background: "#1e293b", color: "#e2e8f0",
                  border: "1px solid #334155", borderRadius: 8,
                  padding: 14, fontSize: 12, lineHeight: 1.7,
                  fontFamily: "monospace", resize: "vertical", outline: "none",
                }}
              />

              {/* Export bar — T1: closes Stage 1 by emitting a loadable VCV Rack patch */}
              <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10 }}>
                <button
                  onClick={handleExport}
                  style={{
                    background: "#2d4060", color: "#f1f5f9",
                    border: "1px solid #3b5270", borderRadius: 6,
                    padding: "6px 12px", fontSize: 11, cursor: "pointer",
                    fontFamily: "monospace", letterSpacing: 1, fontWeight: 600,
                  }}
                >
                  ⬇ EXPORT .vcv
                </button>
                {exportStatus && exportStatus.ok && (
                  <div style={{ fontSize: 10, color: "#6ee7b7", fontFamily: "monospace" }}>
                    {exportStatus.moduleCount} modules, {exportStatus.cableCount} cables written
                    {exportStatus.skipped && exportStatus.skipped.length > 0 && (
                      <span style={{ color: "#fbbf24", marginLeft: 8 }}>
                        · {exportStatus.skipped.length} skipped
                      </span>
                    )}
                  </div>
                )}
                {exportStatus && !exportStatus.ok && (
                  <div style={{ fontSize: 10, color: "#ef4444", fontFamily: "monospace" }}>
                    {exportStatus.error}
                  </div>
                )}
              </div>
              {exportStatus && exportStatus.ok && exportStatus.skipped && exportStatus.skipped.length > 0 && (
                <div style={{ marginTop: 6, fontSize: 9, color: "#64748b", fontFamily: "monospace", lineHeight: 1.6 }}>
                  <div style={{ color: "#fbbf24", marginBottom: 2 }}>Skipped cables (endpoints not registered):</div>
                  {exportStatus.skipped.map((s, i) => (
                    <div key={i}>· {s.line} — <span style={{ color: "#475569" }}>{s.reason}</span></div>
                  ))}
                </div>
              )}

              {/* T12 — parse-time diagnostics: every non-comment line the parser
                  couldn't recognize shows up here the moment it's typed. This is
                  the live-feedback surface the 2026-04-19 comment-strip bug
                  would have exposed immediately. */}
              <WarningsPanel warnings={liveParse.warnings} />

              {/* Syntax reference */}
              <div style={{ marginTop: 12, fontSize: 10, color: "#475569", lineHeight: 2.0 }}>
                <div style={{ color: "#64748b", fontWeight: 600, marginBottom: 4 }}>Syntax</div>
                <div><span style={{ color: "#60a5fa" }}>@INST = ModuleType</span> &nbsp;— bind to registry</div>
                <div><span style={{ color: "#94a3b8" }}>A -&gt; B</span> &nbsp;— connection (type from registry)</div>
                <div><span style={{ color: "#94a3b8" }}>A -&gt; B:Port</span> &nbsp;— named input port</div>
                <div><span style={{ color: "#94a3b8" }}>A:Port -&gt; B</span> &nbsp;— named output port</div>
                <div><span style={{ color: "#94a3b8" }}>A -&gt; B [type]</span> &nbsp;— explicit type override</div>
                <div><span style={{ color: "#94a3b8" }}>* Mod: P=V | P=V</span> &nbsp;— parameters</div>
                <div><span style={{ color: "#94a3b8" }}>// text</span> &nbsp;— comment</div>
                <div style={{ marginTop: 8, color: "#64748b", fontWeight: 600 }}>Registry Module Keys</div>
                <div style={{ color: "#3b82f6" }}>{Object.keys(REGISTRY).join(" · ")}</div>
                <div style={{ marginTop: 8, color: "#475569" }}>
                  Brackets are deprecated for registry-grounded instances.<br/>
                  They remain valid as explicit overrides.
                </div>
              </div>

              {/* Registry panel */}
              <RegistryPanel />
            </div>

            {/* Diagram panel */}
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 10, color: "#64748b", marginBottom: 6, letterSpacing: 1, textTransform: "uppercase" }}>
                Signal Flow
              </div>
              <div style={{ overflowX: "auto" }}>
                <Diagram pdl={pdl} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
